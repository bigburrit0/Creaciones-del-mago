        shake: [[T.freeze, 0.008, 0.3]], punch: [[1.4, 0.1], [5.4, 0.12], [T.freeze + 0.02, 0.18], [20.3, 0.1], [23.4, 0.08]],

      cam.measure();
      // ---------- text: kinetic captions, hook, time cards, end card ----------
      const overlay = kineticOverlay({ LINES, ENV, FPS, T, subsEl: document.getElementById("subs"), cardEl: document.getElementById("card"), hookEl: document.getElementById("hook"), hook: [0.15, 1.3] });
      const tcard = document.getElementById("tcard"), tcardTxt = document.getElementById("tcardTxt");
      const CARDS = [[T.card1, 7.95, "Esa noche…", "🌙"], [T.card2, 18.45, "A la mañana…", "☀"]];
      function timeCards(t) { let v = 0, txt = ""; for (const [a, b, s] of CARDS) if (t >= a && t < b) { v = Math.min(clamp((t - a) / 0.1, 0, 1), clamp((b - t) / 0.12, 0, 1)); txt = s; }
        tcard.style.visibility = v > 0 ? "visible" : "hidden"; tcard.style.opacity = v.toFixed(3); if (tcardTxt.textContent !== txt) tcardTxt.textContent = txt;
        tcardTxt.style.transform = `scale(${(0.85 + 0.15 * Math.min(1, v * 1.2)).toFixed(3)}) rotate(-2deg)`; }
      let lastT = null;
      function renderAt(t) { if (t === lastT) return; lastT = t; poseAt(t); springs(t); props(t); cam.at(t); renderer.render(scene, camera); overlay(t); timeCards(t); }

      /* QA gate (skills/reel-3d-toon/references/qa.md): the shared checks plus this reel's props and furniture */
      const QB = qaBase({ chars: { mago, santa }, DOOR, hinge, BTRACK, rig: { handC, wp } });
      const ARM = /^(hand|thumb|sleeve|cuff|arm)/;
      const meshesOf = (c, excl) => c.meshes.filter((m) => !excl || !excl.test(m.name));
      const FURN = [{ name: "table", kind: "cyl", c: TB, r: TR + 0.005, y1: TOP + 0.09 }, { name: "bench", kind: "box", min: V3(-1.255, 0, -1.075), max: V3(0.015, 0.6, -0.605) }];
      function qa(t) {

        // gifts: away from every body except the hands holding them (and both during a hand-over)
        for (const [g, nm, hold0, hold1, tH] of [[giftM, "giftM", santa, mago, T.h1], [giftS, "giftS", mago, santa, T.h2]]) if (g.visible && t >= T.grab - 0.32) {
          const cen = g.position.clone().add(V3(0, 0.06, 0)); for (const c of [mago, santa]) { const holder = (t < tH ? hold0 : hold1) === c || Math.abs(t - tH) < 0.3;
            const r = minDistToMeshes(cen, meshesOf(c, holder ? ARM : null)); if (r.d < 0.035) out.push(["gift", nm, c === mago ? "mago" : "santa", r.mesh, +r.d.toFixed(3)]); } }
        for (const [s, holder] of [[slipS, santa], [slipM, mago]]) if (s.visible) { const p = s.getWorldPosition(V3(0, 0, 0)); for (const c of [mago, santa]) { const r = minDistToMeshes(p, meshesOf(c, c === holder ? ARM : null)); if (r.d < 0.02) out.push(["slip", c === mago ? "mago" : "santa", r.mesh, +r.d.toFixed(3)]); } }
        // furniture is solid for the bodies (arms may reach into the bowl and onto the printer bed)
        for (const [c, nm] of [[mago, "mago"], [santa, "santa"]]) for (const k of c.colliders(true)) for (const p of k.b ? [k.a, k.b, k.a.clone().lerp(k.b, 0.5)] : [k.a]) for (const F of FURN) {
          let d; if (F.kind === "cyl") { const h = Math.hypot(p.x - F.c.x, p.z - F.c.z) - F.r; d = p.y > F.y1 ? Math.hypot(Math.max(h, 0), p.y - F.y1) : h; }
          else { const q = V3(clamp(p.x, F.min.x, F.max.x), clamp(p.y, F.min.y, F.max.y), clamp(p.z, F.min.z, F.max.z)); d = q.distanceTo(p); }
          if (d < k.r - 0.01) out.push(["furniture", nm, k.name, F.name, +(k.r - d).toFixed(3)]); }

      window.__draw3d = renderAt; window.__T = T; window.__JUMP_OK = [[7.4, 7.84], [17.95, 18.34]];      // staging changes hidden by the full-frame time cards window.__dbg = { mago, santa, SPR, BTRACK, frame, THREE, P1, P2, giftM, giftS };
      renderAt(0);
      markReady();
    </script>
