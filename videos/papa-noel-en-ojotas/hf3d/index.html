    <script type="module">
      /* Papá Noel en ojotas, 3D toon (21 s), with voices, subtitles and an end card. Story: GUION.md. Research: RESEARCH_3D_TOON.md, RESEARCH_3D_FORMS.md.
         Characters: biblioteca/3d (mago3d.py, santa3d.py). Every frame is a pure function of t. */
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { toon, outline, shade, Character, rotWorld, ikArm, simulateSprings, cameraAt, ss, seg, clamp, lerp, pulse, rnd, pushOut, colDist, minDistToMeshes } from "./lib/toon3d.js";
      import { V3, stage, canvasTex, rbox, cyl, sph, workshop, cast, makeMate, makeSack, gift, makeFX, unwrap, hd, hTurn, makeRig, voices, characterSprings, pillOverlay, qaBase } from "./lib/escena3d.js";

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let markReady; window.__hf.buildReady.scene = new Promise((r) => (markReady = r));
      const DUR = 21, FPS = 60, WO = 0.0024;
      const { renderer, scene, camera } = stage();

      // ---------- helpers ----------

      // ---------- the workshop (metres) ----------
      const { planks, floor, DOOR, wall, hinge, spill, outside, yard, glass, glassN, sky, WIN, beam, motes, mpos, NM, rug, bench, S, K, stool, tree, bulbs, sun, hemi, front, lamp, led, setLight } = workshop();      // the set and its light (escena3d.js)

      // ---------- characters and models ----------
      const { mago, santa, gp, ALLCOLS, beardTrack, BTRACK, blob, blobM, blobS, blobK, printer, prM, PR, PRrest, nozzleMat, PRINT_OUT } = await cast();      // characters, colliders, beard tracking, printer (escena3d.js)

      // mate (gourd + silver rim + bombilla); one per owner, toggled
      const mate = makeMate(); mate.scale.setScalar(1.25);
      // sack: one lathe, scaled per fill level, with a gold drawstring
      const sack = makeSack();
      // gifts (stylised 3D-printed products; no logos or text)
      const CLICK = ["cafe", "banana", "suculenta", "hamster"].map(gift), CREEPER = gift("creeper"), TNT = gift("tnt");
      const RAPID = ["pokebox", "dragon", "f40", "garaje", "plegable", "hoja", "penarol", "nacional"].map(gift);
      [...CLICK, CREEPER, TNT, ...RAPID].forEach((g) => g.scale.setScalar(1.35));
      // effects: sparks, confetti, sweat, moth, idea bulb, dust puffs
      const { sparkM, SPK, CONF, SWEAT, moth, bulb, PUFF } = makeFX();

      // ---------- staging: positions, clip schedules, beats ----------
      const T = { doorOpen: 0.03, sW0: 0.2, sW1: 2.3, sit: 2.3, mW0: 2.6, mW1: 3.6, offer: 3.7, give: 4.3, sip0: 4.4, relief: 5.2, back: 5.85, mSip: 6.2,
                  shake0: 6.0, shake1: 7.0, sad1: 7.85, think: 7.0, idea: 7.65, mB0: 8.0, mB1: 9.0, press: 9.0, pop1: 9.7, toss1: 10.05, pop2: 10.4, toss2: 10.7,
                  rapid: 10.9, popT: 11.75, tossT: 12.05, boom: 12.5, stand: 12.55, shoulder: 13.6, sE0: 14.05, sE1: 15.2, wave: 15.3, out0: 16.2, out1: 17.9, doorClose: 17.55, exit: 17.7, mPick: 16.4, mSip2: 16.8, mTalk: 17.95, cut5: 17.95, card: 18.0 };
      const Q0 = V3(-0.25, 0, -0.5), Q1 = V3(-0.27, 0, -0.3), DOORP = V3(0.85, 0, -1.72), DOORIN = V3(0.85, 0, -1.08);
      // Santa's sitting pose decides where he stands and how tall the stool is
      santa.add("Sitting_Idle_Loop", -10, -9); const sitE = santa.sched[0]; sitE.a = 0; sitE.b = 1; santa.apply(0.5);
      const hipS = new THREE.Vector3(); santa.b("DEF-hips").getWorldPosition(hipS); santa.sched.length = 0; santa.mixer.stopAllAction();
      const SIT = V3(S.x - hipS.x, 0, S.z - hipS.z), seatH = Math.max(0.12, hipS.y - 0.075);
      // Santa's routes go through the MIDDLE of the doorway, square to the wall (a round body with a sack: QA checks the
      // jambs); he waves well inside the room, turns, and walks straight out with the sack centred on his back; the door
      // (it swings INTO the room) closes behind him while he walks away
      const END = V3(0.85, 0, -0.52);
      const PIN = new THREE.CatmullRomCurve3([DOORP, V3(0.85, 0, -1.1), V3(0.8, 0, -0.82), SIT], false, "centripetal");
      const POUT = new THREE.CatmullRomCurve3([END, V3(0.85, 0, -1.1), V3(0.85, 0, -1.5), V3(0.85, 0, -2.1)], false, "centripetal");
      const tanH = (cv, u) => { const d = cv.getTangentAt(clamp(u, 0, 1)); return Math.atan2(d.x, d.z); };
      cyl(0.19, 0.17, 0.05, "#A0603A", 0, seatH - 0.025, 0, stool, { mo: { spec: 0.1 } }); for (let k = 0; k < 3; k++) { const a = k * 2.094 + 0.5; cyl(0.024, 0.02, seatH - 0.04, "#8A5638", Math.cos(a) * 0.12, (seatH - 0.04) / 2, Math.sin(a) * 0.12, stool); }
      const vS = santa.stanceSpeed("Walk_Loop"), vM = mago.stanceSpeed("Walk_Loop");
      const tsS1 = clamp(PIN.getLength() / (T.sW1 - T.sW0) / vS, 0.7, 1.7), tsS2 = clamp(SIT.distanceTo(END) / (T.sE1 - T.sE0) / vS, 0.7, 1.8);
      const tsM1 = clamp(Q0.distanceTo(Q1) / (T.mW1 - T.mW0) / vM, 0.8, 1.9), tsM2 = clamp(Q1.distanceTo(Q0) / (T.mB1 - T.mB0) / vM, 0.8, 1.9);
      console.log("speeds", vS.toFixed(3), vM.toFixed(3), "ts", tsS1.toFixed(2), tsS2.toFixed(2), tsM1.toFixed(2), tsM2.toFixed(2), "seat", seatH.toFixed(3));
      // Santa
      santa.add("Walk_Loop", -0.5, T.sW1 + 0.12, { speed: tsS1 * 0.92 });
      santa.add("Idle_Loop", T.sW1 - 0.15, T.sit + 0.25);
      santa.add("Sitting_Enter", T.sit, T.sit + 0.95, { loop: false, speed: 1.4, fade: 0.15 });
      santa.add("Sitting_Idle_Loop", T.sit + 0.8, T.stand + 0.25);
      santa.add("Sitting_Exit", T.stand, T.stand + 0.95, { loop: false, speed: 1.35, fade: 0.15 });
      santa.add("Idle_Loop", T.stand + 0.8, T.sE0 + 0.15);
      santa.add("Walk_Loop", T.sE0, T.sE1 + 0.15, { speed: tsS2 });
      santa.add("Idle_Loop", T.sE1, T.out0 + 0.15);
      santa.add("Walk_Loop", T.out0 - 0.1, DUR + 1, { speed: clamp(POUT.getLength() / (T.out1 - T.out0) / vS, 0.7, 1.8) });
      // El Mago
      mago.add("Interact", -0.3, 0.65, { loop: false, off: 0.6 });
      mago.add("Idle_Loop", 0.45, T.mW0 + 0.15);
      mago.add("Walk_Loop", T.mW0, T.mW1 + 0.12, { speed: tsM1 });
      mago.add("Idle_Loop", T.mW1, T.mB0 + 0.15, { off: 0.7 });
      mago.add("Walk_Loop", T.mB0, T.mB1 + 0.12, { speed: tsM2 });
      mago.add("Interact", T.press - 0.1, T.press + 0.75, { loop: false, off: 0.5 });
      mago.add("Idle_Loop", T.press + 0.6, T.boom + 0.1, { off: 0.3 });     // the throws are IK (the casting clip swept through his beard)
      mago.add("Dance_Loop", T.boom - 0.15, T.shoulder + 0.4);
      mago.add("Idle_Loop", T.shoulder + 0.2, DUR + 1, { off: 0.4 });

      const faceSanta = hd(Q1, V3(S.x, 0, S.z + 0.2)), hPR = hd(Q0, V3(-0.42, 0, -0.84));     // beside the printer, not in front of it
      const { frame, wp, IKQ, arm, armNow, handC, TH, DP, drinkPose, towards, headPt, solveArms } = makeRig([mago, santa]);      // arm IK and contact guard (escena3d.js)
      let P1 = V3(0, 0.5, 0), P2 = V3(0, 0.5, 0);                     // hand-off meeting points (set below from the poses)

      // voices: start, length and text come from the <audio data-who> clips; loudness envelopes (60 fps) from build3d.sh
      const { LINES, ENV, talk } = await voices(FPS);
      let SACKR = 0.15, SACKC = V3(0, 0, 0), MATE = { pos: V3(0, 0, 0), q: new THREE.Quaternion() };
      function poseAt(t) {
        IKQ.length = 0;
        // ---- Santa
        santa.apply(t);
        let sp, sh;
        if (t < T.sW1 + 0.1) { const f = clamp((t - T.sW0) / (T.sW1 - T.sW0), 0, 1), h0 = tanH(PIN, f); sp = PIN.getPointAt(f); sh = lerp(h0, unwrap(0, h0), seg(t, T.sW1 - 0.35, T.sit + 0.1)); }
        else if (t < T.sE0) { sp = SIT.clone(); sh = 0; }
        else if (t < T.out0) { sp = SIT.clone().lerp(END, ss(clamp((t - T.sE0) / (T.sE1 - T.sE0), 0, 1)) * 0.3 + clamp((t - T.sE0) / (T.sE1 - T.sE0), 0, 1) * 0.7);
               sh = hTurn(t, [[T.sE0, 0], [T.sE0 + 0.4, hd(SIT, END)], [T.sE1 - 0.3, hd(SIT, END)], [T.wave + 0.12, 0.15], [T.out0 - 0.45, 0.15], [T.out0, tanH(POUT, 0)]]); }
        else { const f = clamp((t - T.out0) / (T.out1 - T.out0), 0, 1); sp = POUT.getPointAt(f); sh = tanH(POUT, f); }
        santa.W.position.copy(sp); santa.W.rotation.y = sh; santa.W.visible = t < T.exit;
        // plop squash, startled jolt, relief sigh (volume kept, capped)
        const pl = t - (T.sit + 0.62), plop = pl > 0 && pl < 0.5 ? -Math.sin(pl / 0.5 * Math.PI * 2.2) * Math.exp(-pl * 7) * 0.1 : 0;
        const st = t - 11.8, jolt = st > 0 && st < 0.45 ? Math.sin(st / 0.45 * Math.PI * 2) * Math.exp(-st * 6) * 0.07 : 0;
        const sigh = -0.035 * pulse(t, T.relief, T.relief + 0.25, T.relief + 0.45, T.relief + 0.8);
        const sq = plop + jolt + sigh; santa.W.scale.set(1 - sq / 2, 1 + sq, 1 - sq / 2); santa.W.position.y += Math.max(0, jolt) * 0.5;
        santa.W.updateMatrixWorld(true);
        const SF = frame(santa);
        rotWorld(santa.b("DEF-upper_arm.L"), SF.fwd, 0.16); rotWorld(santa.b("DEF-upper_arm.R"), SF.fwd, -0.16);
        // exhausted posture while walking in and fanning; sad slump; head tilt back to sip
        const tired = Math.max(pulse(t, T.sW0, T.sW0 + 0.3, T.sit + 0.3, T.sit + 0.7) * 0.16, pulse(t, T.shake1, T.shake1 + 0.2, T.sad1 - 0.1, T.sad1 + 0.25) * 0.12);
        rotWorld(santa.b("DEF-spine.003"), SF.left, tired);
        rotWorld(santa.b("DEF-head"), SF.left, tired * 1.15 - 0.18 * pulse(t, T.sip0 + 0.15, T.sip0 + 0.4, T.relief - 0.1, T.relief + 0.15)
                                                + 0.1 * pulse(t, T.shake1, T.shake1 + 0.25, T.sad1 - 0.1, T.sad1 + 0.25));
        rotWorld(santa.b("DEF-head"), SF.up, 0.35 * pulse(t, T.press - 0.3, T.press, T.boom - 0.2, T.boom) * Math.sign(-1));   // looks toward the printer
        // arms (IK): fan himself, take the mate and sip, hand it back, shake the sack, hold it sad, startled, cheer, sack on shoulder, wave
        const fanW = pulse(t, T.sit + 0.7, T.sit + 1.05, T.give - 0.62, T.give - 0.32);
        arm(santa, "L", headPt(santa, 0.08 + 0.04 * Math.sin(t * 2 * Math.PI * 3.2), 0.12, -0.26), fanW);
        const dS = pulse(t, T.sip0 - 0.05, T.sip0 + 0.3, T.relief - 0.2, T.relief + 0.15);
        rotWorld(santa.b("DEF-head"), SF.left, 0.08 * dS);                                  // leans in to meet the straw
        DP.S = drinkPose(santa, 0.1, 0.205);
        const lapS = wp(santa.b("DEF-hips")).add(SF.fwd.clone().multiplyScalar(0.3)).add(V3(0, 0.14, 0)).add(SF.right.clone().multiplyScalar(0.1));
        const holdS = pulse(t, T.give - 0.32, T.give - 0.08, T.back + 0.05, T.back + 0.3);
        const tgS = lapS.clone().lerp(DP.S.grip, dS).lerp(towards(P1, S, 0.09), pulse(t, T.give - 0.32, T.give - 0.08, T.give + 0.1, T.give + 0.35))
                         .lerp(towards(P2, S, 0.09), pulse(t, T.back - 0.32, T.back - 0.08, T.back + 0.05, T.back + 0.3));
        arm(santa, "R", tgS, holdS);
        const shakeW = pulse(t, T.shake0 - 0.1, T.shake0 + 0.2, T.sad1 - 0.15, T.sad1 + 0.15), sackUp = pulse(t, T.shake0, T.shake0 + 0.25, T.shake1 - 0.1, T.shake1 + 0.2);
        SACKC = pushOut(wp(santa.b("DEF-hips")).add(SF.fwd.clone().multiplyScalar(0.36)).add(V3(0, 0.14 + 0.1 * sackUp + 0.035 * sackUp * Math.sin(t * 2 * Math.PI * 5), 0)), 0.15, santa.colliders(true));
        arm(santa, "R", SACKC.clone().add(SF.right.clone().multiplyScalar(0.15)), shakeW, null, 0.04); arm(santa, "L", SACKC.clone().add(SF.left.clone().multiplyScalar(0.15)), shakeW, null, 0.04);
        const jW = pulse(t, 11.72, 11.95, 12.05, 12.35), cheer = pulse(t, T.stand + 0.45, T.stand + 0.75, T.shoulder - 0.2, T.shoulder + 0.1), upW = Math.max(jW, cheer);
        const wig = 0.04 * Math.sin(t * 14) * cheer;
        const sx = lerp(0.22, 0.34, cheer / Math.max(upW, 1e-3)), su = lerp(0.22, 0.3, cheer / Math.max(upW, 1e-3)), sf = lerp(0.14, 0.08, cheer / Math.max(upW, 1e-3));   // startled: hands up close to the face; cheering: wide
        arm(santa, "R", headPt(santa, su, sf, sx + wig), upW); arm(santa, "L", headPt(santa, su, sf, -sx - wig), upW);
        const shW = pulse(t, T.shoulder - 0.05, T.shoulder + 0.3, T.out0 - 0.45, T.out0 - 0.15);
        arm(santa, "R", headPt(santa, -0.02, -0.05, 0.2), shW * 0.9);
        arm(santa, "L", headPt(santa, 0.3, 0.05, -0.28 + 0.07 * Math.sin(t * 2 * Math.PI * 3)), pulse(t, T.wave - 0.15, T.wave + 0.15, T.out0 - 0.55, T.out0 - 0.25));
        talk(santa, "santa", t, SF);
        // face: glasses slide down the nose with relief, brows up when startled and happy
        const gl = santa.b("glasses"), br = santa.b("brows");
        gl.position.y -= 0.022 * pulse(t, T.relief, T.relief + 0.15, T.stand + 1.0, T.stand + 1.2);
        br.position.y += 0.012 * Math.max(pulse(t, 11.8, 11.85, 12.3, 12.5), pulse(t, T.relief, T.relief + 0.1, T.relief + 0.6, T.relief + 0.8), pulse(t, T.boom, T.boom + 0.1, T.shoulder, T.shoulder + 0.2));
        br.position.y -= 0.008 * pulse(t, T.shake1, T.shake1 + 0.15, T.sad1 - 0.1, T.sad1 + 0.1);
        // ---- El Mago
        mago.apply(t);
        let mp, mh;
