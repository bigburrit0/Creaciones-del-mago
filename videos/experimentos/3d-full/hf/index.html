<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="mode.js"></script>
    <script src="lib/gsap.min.js"></script>
    <script>
      // the runtime seeks this paused timeline; its onUpdate draws the 3D frame for that time (see the module below)
      window.__timelines = window.__timelines || {};
      window.__draw3d = null;
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 8, ease: "none", onUpdate: () => window.__draw3d && window.__draw3d(tl.time()) });
      window.__timelines["main"] = tl;
    </script>
    <script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2e2160; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #2e2160; }
      #c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <canvas id="c" width="1080" height="1920"></canvas>
    </div>
    <script type="module">
      /* Fully-3D test: the workshop in low-poly 3D, the printer exported from Blender (biblioteca/3d), a CC0 mannequin
         dressed as the wizard and moved by motion-capture clips (Quaternius Universal Animation Library).
         Every frame is a pure function of time t (hf-seek): clip times, blend weights, path and camera come from t.
         MODE "toon": full-resolution toon shading + outlines. MODE "pixel": rendered at 270x480 (the reels' art grid),
         snapped to the 32-colour palette with a 4x4 ordered dither and scaled x4 with nearest neighbour. */
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const MODE = window.MODE || "toon", PIXEL = MODE === "pixel";
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let markReady; window.__hf.buildReady.scene = new Promise((r) => (markReady = r));

      const PAL = ["#150A34","#2E2160","#4B3A8E","#6A58B8","#C98A2B","#F2C14E","#C8AE88","#F0D8B2","#D9826A","#E1AE73","#F0C090","#5A3424",
                   "#8A5638","#6E3B22","#A0603A","#D8D4C8","#FFF3B0","#F2B640","#1E3A2A","#2F5A32","#5C9A4A","#9BC46A","#7A1E22","#C0392B",
                   "#E86A4A","#2B4C7E","#4F86C6","#9CC9E8","#5B4636","#B08A5A","#E9D8B4","#FBF4E4"];
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: !PIXEL, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false); renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = PIXEL ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene(); scene.background = new THREE.Color("#2E2160");
      const camera = new THREE.PerspectiveCamera(34, 1080 / 1920, 0.1, 50);

      // ---------- toon materials ----------
      const grad = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1);
      grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
      const toon = (c, o) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: grad }, o || {}));
      const OUTLINE = PIXEL ? 0.016 : 0.012;
      function outlineMat(skinned) {
        const m = new THREE.MeshBasicMaterial({ color: "#150A34", side: THREE.BackSide });
        m.onBeforeCompile = (sh) => { sh.vertexShader = sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\n transformed += normalize(normal) * " + OUTLINE.toFixed(4) + ";"); };
        return m;
      }
      function addOutline(mesh, scaleFix) {     // inverted hull, follows skinning
        const o = mesh.isSkinnedMesh ? new THREE.SkinnedMesh(mesh.geometry, outlineMat(true)) : new THREE.Mesh(mesh.geometry, outlineMat(false));
        if (mesh.isSkinnedMesh) o.bind(mesh.skeleton, mesh.bindMatrix);
        o.material.onBeforeCompile = (sh) => { sh.vertexShader = sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\n transformed += normalize(normal) * " + (OUTLINE / (scaleFix || 1)).toFixed(4) + ";"); };
        mesh.add(o); o.frustumCulled = false; return o;
      }
      function canvasTex(w, h, draw) {
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(cv); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
        t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
      }
      const shade = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
      const box = (w, h, d, c, x, y, z, parent, outline) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === "string" ? toon(c) : c);
        m.position.set(x, y, z); shade(m); (parent || scene).add(m); if (outline) addOutline(m); return m;
      };

      // ---------- room ----------
      const planks = canvasTex(32, 32, (g, w, h) => { g.fillStyle = "#A0603A"; g.fillRect(0, 0, w, h); g.fillStyle = "#8A5638";
        for (let y = 0; y < h; y += 8) g.fillRect(0, y, w, 1); g.fillRect(10, 0, 1, 8); g.fillRect(26, 8, 1, 8); g.fillRect(5, 16, 1, 8); g.fillRect(19, 24, 1, 8); });
      planks.repeat.set(8, 8);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), toon("#ffffff", { map: planks }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const wallTex = canvasTex(32, 32, (g, w, h) => { g.fillStyle = "#F2B640"; g.fillRect(0, 0, w, h); g.fillStyle = "#C98A2B";
        for (let y = 0; y < h; y += 8) g.fillRect(0, y + 7, w, 1); g.fillStyle = "#F2C14E"; for (let y = 0; y < h; y += 8) g.fillRect(0, y, w, 1); });
      wallTex.repeat.set(3, 3);
      const back = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.2), toon("#ffffff", { map: wallTex })); back.position.set(0, 1.6, -2.2); back.receiveShadow = true; scene.add(back);
      const left = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.2), toon("#ffffff", { map: wallTex.clone() })); left.rotation.y = Math.PI / 2; left.position.set(-2.1, 1.6, 0.8); left.receiveShadow = true; scene.add(left);
      // window with sky and a sun
      const sky = canvasTex(32, 24, (g, w, h) => { g.fillStyle = "#9CC9E8"; g.fillRect(0, 0, w, h); g.fillStyle = "#FBF4E4"; g.fillRect(6, 4, 6, 6);
        g.fillStyle = "#5C9A4A"; g.fillRect(20, 10, 12, 5); g.fillRect(24, 6, 8, 4); g.fillStyle = "#2F5A32"; g.fillRect(22, 14, 10, 3); });
      sky.wrapS = sky.wrapT = THREE.ClampToEdgeWrapping;
      const win = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), new THREE.MeshBasicMaterial({ map: sky })); win.position.set(0.55, 1.75, -2.19); scene.add(win);
      for (const [w, h, x, y] of [[1.32, 0.08, 0.55, 2.24], [1.32, 0.08, 0.55, 1.26], [0.08, 1.0, -0.07, 1.75], [0.08, 1.0, 1.17, 1.75], [0.05, 0.9, 0.55, 1.75]]) box(w, h, 0.06, "#8A5638", x, y, -2.17);
      // rug
      const rugTex = canvasTex(64, 64, (g) => { for (let r = 32; r > 0; r -= 4) { g.fillStyle = (r / 4) % 2 ? "#C8AE88" : "#B08A5A"; g.beginPath(); g.arc(32, 32, r, 0, 7); g.fill(); } });
      const rug = new THREE.Mesh(new THREE.CircleGeometry(0.8, 32), toon("#ffffff", { map: rugTex })); rug.rotation.x = -Math.PI / 2; rug.scale.y = 0.75; rug.position.set(0.35, 0.005, 0.15); rug.receiveShadow = true; scene.add(rug);
      // bench + shelves with prints
      const bench = new THREE.Group(); bench.position.set(-1.05, 0, -1.75); scene.add(bench);
      box(1.7, 0.08, 0.62, "#B08A5A", 0, 0.86, 0, bench, true);
      for (const [x, z] of [[-0.78, -0.24], [0.78, -0.24], [-0.78, 0.24], [0.78, 0.24]]) box(0.08, 0.84, 0.08, "#8A5638", x, 0.42, z, bench, true);
      box(1.6, 0.06, 0.06, "#8A5638", 0, 0.25, 0.24, bench);
      for (const y of [1.55, 1.95]) {
        box(1.0, 0.05, 0.24, "#8A5638", -1.25, y, -2.08, null, true);
        [["#C0392B", -1.6], ["#4F86C6", -1.3], ["#5C9A4A", -0.98]].forEach(([c, x], i) => {
          const g = i === 1 ? new THREE.ConeGeometry(0.07, 0.18, 6) : new THREE.CylinderGeometry(0.06, 0.07, 0.16, 8);
          const m = new THREE.Mesh(g, toon(c)); m.position.set(x, y + 0.1, -2.06); shade(m); scene.add(m); addOutline(m);
        });
      }
      // little tree in the corner
      const tree = new THREE.Group(); tree.position.set(1.55, 0, -1.85); scene.add(tree);
      box(0.22, 0.18, 0.22, "#C0392B", 0, 0.09, 0, tree, true);
      [[0.32, 0.4, 0.38], [0.25, 0.34, 0.62], [0.17, 0.28, 0.84]].forEach(([r, h, y]) => { const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), toon("#2F5A32")); c.position.y = y; shade(c); tree.add(c); addOutline(c); });
      const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.06), new THREE.MeshBasicMaterial({ color: "#FFF3B0" })); star.position.y = 1.02; tree.add(star);
      const bulbs = []; for (let k = 0; k < 8; k++) { const a = k * 2.1, y = 0.3 + k * 0.075, r = 0.3 - k * 0.028;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 4), new THREE.MeshBasicMaterial({ color: "#E86A4A" })); b.position.set(Math.cos(a) * r, y, Math.abs(Math.sin(a)) * r + 0.02); tree.add(b); bulbs.push(b); }

      // lights: warm sun through the window, sky fill
      const sun = new THREE.DirectionalLight("#FFE6B0", 2.4); sun.position.set(1.2, 4.2, -0.6); sun.target.position.set(-0.5, 0, 0.6);
      sun.castShadow = true; sun.shadow.mapSize.set(PIXEL ? 1024 : 2048, PIXEL ? 1024 : 2048); Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 12 });
      sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02; scene.add(sun, sun.target);
      scene.add(new THREE.HemisphereLight("#9CC9E8", "#6E3B22", 1.1));
      const key2 = new THREE.DirectionalLight("#FFF3B0", 0.7); key2.position.set(-2, 3, 3); scene.add(key2);

      // ---------- sparkle burst (pre-computed, deterministic) ----------
      const SPARK_T = 6.0, sparks = [];
      const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      for (let i = 0; i < 28; i++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.035), new THREE.MeshBasicMaterial({ color: i % 3 ? "#F2C14E" : "#FFF3B0" }));
        m.userData.v = new THREE.Vector3((rnd(i) - 0.5) * 1.6, 1.4 + rnd(i + 50) * 1.4, (rnd(i + 99) - 0.3) * 1.2); m.visible = false; scene.add(m); sparks.push(m);
      }

      // ---------- load the printer and the wizard ----------
      const loader = new GLTFLoader();
      const [prGl, ual] = await Promise.all([loader.loadAsync("assets/printer.glb"), loader.loadAsync("assets/AnimationLibrary_Godot_Standard.gltf")]);

      const printer = prGl.scene; printer.scale.setScalar(0.15); printer.position.set(-0.75, 0.9, -1.78); printer.rotation.y = 0.25;
      const prMeshes = []; printer.traverse((m) => { if (m.isMesh) prMeshes.push(m); });
      prMeshes.forEach((m) => { { const c = m.material.color.clone(); const e = m.material.emissiveIntensity > 0 && m.material.emissive.getHex() !== 0;
        m.material = e ? new THREE.MeshBasicMaterial({ color: m.material.emissive }) : toon(c); shade(m); if (!e) addOutline(m, 0.15); } });
      scene.add(printer);
      const P = {}; for (const n of ["head", "bed", "gantry", "print", "bow", "nozzle", "screen", "tube"]) P[n] = printer.getObjectByName(n);
      const rest = {}; for (const n in P) if (P[n]) rest[n] = { p: P[n].position.clone(), s: P[n].scale.clone() };
      if (P.tube) P.tube.visible = false;
      const nozzleMat = P.nozzle && P.nozzle.isMesh ? P.nozzle.material : null;

      // wizard: mannequin recoloured by bone (skin on head/hands, boots, robe), chibi head, hat and beard on the head bone
      const wiz = ual.scene; const mesh = []; wiz.traverse((o) => { if (o.isSkinnedMesh) mesh.push(o); });
      const WS = 0.5; const W = new THREE.Group(); W.add(wiz); scene.add(W); wiz.scale.setScalar(WS);
      const sk = mesh[0].skeleton, boneIdx = (n) => sk.bones.findIndex((b) => b.name === n);
      const SKIN = new Set(["DEF-head", "DEF-neck"].map(boneIdx)), HAND = new Set(sk.bones.map((b, i) => (/hand|f_|thumb/.test(b.name) ? i : -1)).filter((i) => i >= 0));
      const FOOT = new Set(sk.bones.map((b, i) => (/foot|toe/.test(b.name) ? i : -1)).filter((i) => i >= 0));
      const LEG = new Set(sk.bones.map((b, i) => (/shin/.test(b.name) ? i : -1)).filter((i) => i >= 0));
      const cSkin = new THREE.Color("#F0C090"), cRobe = new THREE.Color("#6A58B8"), cBoot = new THREE.Color("#5A3424"), cLeg = new THREE.Color("#4B3A8E");
      for (const m of mesh) {
        const g = m.geometry, si = g.attributes.skinIndex, sw = g.attributes.skinWeight, col = new Float32Array(si.count * 3);
        for (let v = 0; v < si.count; v++) {
          let best = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = sw.getComponent(v, k); if (w > bw) { bw = w; best = si.getComponent(v, k); } }
          const c = SKIN.has(best) || HAND.has(best) ? cSkin : FOOT.has(best) ? cBoot : LEG.has(best) ? cLeg : cRobe; col.set([c.r, c.g, c.b], v * 3);
        }
        g.setAttribute("color", new THREE.BufferAttribute(col, 3));
        m.material = toon("#ffffff", { vertexColors: true }); m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
        addOutline(m, WS);
      }
      const head = sk.bones[boneIdx("DEF-head")], hips = sk.bones[boneIdx("DEF-hips")];
      // calibrate on the first frame of the idle clip (standing, facing +z): accessories hang world-aligned in that pose
      const calib = mixer0 => { const a = mixer0.clipAction(THREE.AnimationClip.findByName(ual.animations, "Idle_Loop")); a.play(); mixer0.update(0); W.updateMatrixWorld(true); return a; };
      const tmpMixer = new THREE.AnimationMixer(wiz); const ca = calib(tmpMixer);
      function hang(bone) {
        const g = new THREE.Group(); bone.add(g);
        const qb = new THREE.Quaternion(); bone.getWorldQuaternion(qb); g.quaternion.copy(qb.invert());
        const s = new THREE.Vector3(); bone.getWorldScale(s); g.scale.setScalar(1 / s.x); return g;     // world units
      }
      const acc = hang(head), robeG = hang(hips);
      const hipsY = new THREE.Vector3(); hips.getWorldPosition(hipsY);
      ca.stop(); tmpMixer.uncacheRoot(wiz);
      const HEADK = 1.5;            // chibi: big head (the bone scale also scales what hangs from it)
      // sizes in metres, before the chibi head scale (wizard ~0.9 m tall, head radius ~0.055 m)
      const hat = new THREE.Group(); acc.add(hat); hat.position.set(0, 0.098, -0.004);
      const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.01, 20), toon("#4B3A8E")); hat.add(brim);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.052, 0.16, 14), toon("#6A58B8")); cone.position.y = 0.08; cone.rotation.x = -0.3; hat.add(cone);
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.051, 0.053, 0.016, 14), toon("#F2C14E")); band.position.y = 0.012; hat.add(band);
      const beard = new THREE.Mesh(new THREE.ConeGeometry(0.046, 0.13, 12), toon("#FBF4E4")); beard.rotation.x = Math.PI + 0.25; beard.position.set(0, 0.0, 0.042); acc.add(beard);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), toon("#D9826A")); nose.position.set(0, 0.045, 0.056); acc.add(nose);
      for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 6), new THREE.MeshBasicMaterial({ color: "#150A34" })); e.position.set(sx * 0.022, 0.06, 0.05); acc.add(e);
        const br = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.009, 0.01), toon("#FBF4E4")); br.position.set(sx * 0.023, 0.073, 0.05); br.rotation.z = -sx * 0.2; acc.add(br); }
      // robe: a wide cone hanging from the hips (legs move inside it, boots show below), with a belt
      const robe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.23, 0.66, 18, 1, true), toon("#6A58B8", { side: THREE.DoubleSide }));
      robe.position.y = -0.06; robeG.add(robe);
      const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.14, 0.035, 18), toon("#5A3424")); belt.position.y = 0.05; robeG.add(belt);
      const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.035, 0.012), toon("#F2C14E")); buckle.position.set(0, 0.05, 0.14); robeG.add(buckle);
      for (const o of [brim, cone, band, beard, nose, robe, belt, buckle]) { shade(o); addOutline(o, 1); }

      // ---------- clip schedule (crossfades), path and facing: all from t ----------
      const mixer = new THREE.AnimationMixer(wiz);
      const clip = (n) => THREE.AnimationClip.findByName(ual.animations, n);
      const SCHED = [
        { c: "Walk_Loop", a: 0.0, b: 2.55, loop: true },
        { c: "Idle_Loop", a: 2.3, b: 3.0, loop: true },
        { c: "Interact", a: 2.75, b: 4.6, loop: false, speed: 1.1 },
        { c: "Idle_Loop", a: 4.35, b: 6.35, loop: true, off: 0.9 },
        { c: "Dance_Loop", a: 6.1, b: 8.6, loop: true },
      ].map((e) => Object.assign(e, { act: mixer.clipAction(clip(e.c).clone()), fade: 0.25 }));
      SCHED.forEach((e) => { e.act.play(); e.act.setEffectiveWeight(0); });
      const ss = (x) => x * x * (3 - 2 * x), clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, f) => a + (b - a) * f;
      const A0 = new THREE.Vector3(1.1, 0, 0.55), A1 = new THREE.Vector3(-0.62, 0, -1.05);
      function heading(t) {
        const walkH = Math.atan2(A1.x - A0.x, A1.z - A0.z);
        if (t < 2.35) return walkH;
        if (t < 2.8) return lerp(walkH, Math.PI, ss((t - 2.35) / 0.45));
        if (t < 6.0) return Math.PI;
        return lerp(Math.PI, 2 * Math.PI - 0.35, ss(clamp((t - 6.0) / 0.45, 0, 1)));
      }

      const rt = new THREE.WebGLRenderTarget(270, 480, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, samples: 0 });
      rt.texture.colorSpace = THREE.SRGBColorSpace;
      const post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const palV = PAL.map((h) => new THREE.Color(h)).map((c) => new THREE.Vector3(c.r, c.g, c.b));   // linear
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
        uniforms: { tex: { value: rt.texture }, pal: { value: palV } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }",
        fragmentShader: `uniform sampler2D tex; uniform vec3 pal[32]; varying vec2 vUv;
          float bayer(vec2 p){ int x=int(mod(p.x,4.)), y=int(mod(p.y,4.)); int i=x+y*4;
            float m[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.); return m[i]/16.-0.5; }
          void main(){ vec2 px = floor(vUv*vec2(270.,480.)); vec3 c = texture2D(tex, (px+0.5)/vec2(270.,480.)).rgb;
            c += bayer(px)*0.02; float bd=1e9; vec3 best=c;
            for(int i=0;i<32;i++){ vec3 d=c-pal[i]; float e=dot(d,d*vec3(0.3,0.59,0.11)); if(e<bd){bd=e; best=pal[i];} }
            gl_FragColor = vec4(best,1.);
            #include <colorspace_fragment>
          }`,
      }));
      post.add(quad);

      function renderAt(t) {
        // character animation: clip-local times and normalised crossfade weights
        const ws = SCHED.map((e) => (t < e.a || t > e.b ? 0 : Math.min(1, (t - e.a) / e.fade, (e.b - t) / e.fade)));
        const sum = ws.reduce((a, b) => a + b, 0) || 1;
        SCHED.forEach((e, i) => { const d = e.act.getClip().duration, lt = (Math.max(0, t - e.a) * (e.speed || 1)) + (e.off || 0);
          e.act.time = e.loop ? lt % d : Math.min(lt, d - 1e-3); e.act.setEffectiveWeight(ws[i] / sum); });
        mixer.update(0);
        head.scale.setScalar(HEADK);
        const f = ss(clamp(t / 2.55, 0, 1)); W.position.lerpVectors(A0, A1, f); W.rotation.y = heading(t);
        if (t > 6.1) W.position.y = 0;
        // printer: steady printing 3.4-6.0, the gift grows, done at 6.0
        const pt = clamp((t - 3.4) / 2.6, 0, 1), on = t > 3.4 && t < 6.0;
        if (P.head) P.head.position.x = rest.head.p.x + (on ? 0.32 * Math.sin(t * 19) : 0.5);
        if (P.bed) P.bed.position.z = rest.bed.p.z + (on ? 0.28 * Math.sin(t * 7.5) : 0);
        const h = t < 3.4 ? 0 : 0.85 * pt;
        if (P.print) { P.print.scale.set(rest.print.s.x, Math.max(1e-3, h / 0.85) * rest.print.s.y, rest.print.s.z); P.print.visible = h > 0.01; }
        if (P.bow) P.bow.visible = t >= 6.0;
        if (P.gantry) P.gantry.position.y = rest.gantry.p.y + (on || t >= 6 ? (0.55 + h + 0.67) - rest.gantry.p.y : 0);
        if (nozzleMat) nozzleMat.color.set(on ? "#F2C14E" : "#2E2160");
        // sparkles
        sparks.forEach((m, i) => { const dt = t - SPARK_T - (i % 4) * 0.02; m.visible = dt > 0 && dt < 1.3;
          if (m.visible) { const v = m.userData.v; m.position.set(-0.72 + v.x * dt, 1.25 + v.y * dt - 2.6 * dt * dt, -1.75 + v.z * dt); m.rotation.set(dt * 9, dt * 7, 0); m.scale.setScalar(1 - dt / 1.3); } });
        bulbs.forEach((b, k) => b.material.color.set(["#E86A4A", "#F2C14E", "#9CC9E8", "#2E2160"][(k + Math.floor(t * 4)) % 4]));
        // camera: slow push-in and drift
        const cf = ss(clamp(t / 8, 0, 1));
        camera.position.set(lerp(0.4, 0.0, cf), lerp(4.3, 3.5, cf), lerp(3.6, 2.6, cf));
        camera.lookAt(lerp(-0.1, -0.45, cf), lerp(0.45, 0.6, cf), lerp(-1.05, -1.35, cf));
        if (PIXEL) { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(post, postCam); }
        else renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__draw3d = renderAt;
      renderAt(0);
      markReady();
    </script>
  </body>
</html>
