<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ground: #f3e3c6; --spark: #fff3b0; --spark-edge: #f2b640; --dust: #c9a06a; --leaf: #5c9a4a; --leaf-dark: #2f5a32; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
      img { image-rendering: pixelated; display: block; }
      #stage, .layer, .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .hid { opacity: 0; }
      .px { position: absolute; width: 8px; height: 8px; opacity: 0; }
      .star { width: 6px; height: 6px; background: var(--spark);
        box-shadow: 6px 0 var(--spark), -6px 0 var(--spark), 0 6px var(--spark), 0 -6px var(--spark),
                    12px 0 var(--spark-edge), -12px 0 var(--spark-edge), 0 12px var(--spark-edge), 0 -12px var(--spark-edge); }
      .dust { width: 12px; height: 12px; background: var(--dust); box-shadow: 0 0 0 3px #f1dcb4; }
      .leaf { width: 12px; height: 12px; background: var(--leaf); box-shadow: 6px 6px 0 0 var(--leaf-dark); }
      .seed { width: 12px; height: 12px; background: #ffd34a; box-shadow: 0 0 0 4px rgba(255, 220, 90, 0.45), 0 0 18px 6px rgba(255, 210, 80, 0.5); }
      #rope-clip { clip-path: inset(0% 0% 0% 100%); }
      /* paint order inside the patio: ground < plant < feeder < perched birds < sparrows < wizard < flying birds */
      #plate { z-index: 1; } #plate-nochair { z-index: 2; }
      #sprout, #sapling, #trunk, #trunk8 { z-index: 10; } #canopy { z-index: 11; } #rope-clip { z-index: 12; }
      #l-wiz { z-index: 16; } #feeder { z-index: 20; } #l-kis, #l-hor-o, #l-hor { z-index: 22; }
      #l-sp1, #l-sp2 { z-index: 25; } #kneel, #stand, #point { z-index: 30; }
      #kis, #hor { z-index: 40; } #seed { z-index: 41; } #leaves-fx { z-index: 42; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion>
        <!-- ===== patio (keyframes 1-3) ===== -->
        <div id="grp-patio" class="layer">
          <img id="plate" class="full" src="assets/plate.jpg" alt="" />
          <img id="plate-nochair" class="full hid" src="assets/plate_nochair.jpg" alt="" />
          <img id="sprout" class="full hid" src="assets/sprout.png" alt="" />
          <img id="sapling" class="full hid" src="assets/sapling.png" alt="" />
          <img id="trunk" class="full hid" src="assets/trunk.png" alt="" />
          <img id="trunk8" class="full hid" src="assets/trunk8.png" alt="" />
          <img id="canopy" class="full hid" src="assets/canopy.png" alt="" />
          <div id="rope-clip" class="layer"><img id="rope" class="full" src="assets/rope.png" alt="" /></div>
          <img id="feeder" class="full hid" src="assets/feeder.png" alt="" />
          <img id="l-wiz" class="full hid" src="assets/l_wiz.png" alt="" />
          <img id="l-kis" class="full hid" src="assets/l_kis.png" alt="" />
          <img id="l-hor-o" class="full hid" src="assets/l_hor_orange.png" alt="" />
          <img id="l-hor" class="full hid" src="assets/l_hor.png" alt="" />
          <img id="l-sp1" class="full hid" src="assets/l_sp1.png" alt="" />
          <img id="l-sp2" class="full hid" src="assets/l_sp2.png" alt="" />
          <img id="kneel" class="full" src="assets/kneel.png" alt="" />
          <img id="stand" class="full hid" src="assets/stand.png" alt="" />
          <img id="point" class="full hid" src="assets/point.png" alt="" />
          <!-- flying birds: two-frame flap (wings open from keyframe 3, wings closed from keyframe 4) -->
          <div id="kis" class="layer hid">
            <img id="kis-open" class="full" src="assets/kis_fly.png" alt="" />
            <img id="kis-closed" class="full hid" src="assets/kis_closed.png" alt="" />
          </div>
          <div id="hor" class="layer hid">
            <img id="hor-open" class="full" src="assets/hor_fly.png" alt="" />
            <img id="hor-closed" class="full hid" src="assets/hor_closed.png" alt="" />
          </div>
          <div id="seed" class="px seed" style="left:436px;top:1022px"></div>
          <div id="leaves-fx" class="layer">
            <div id="lf1" class="px leaf"></div><div id="lf2" class="px leaf"></div><div id="lf3" class="px leaf"></div>
            <div id="lf4" class="px leaf"></div><div id="lf5" class="px leaf"></div><div id="lf6" class="px leaf"></div>
            <div id="lf7" class="px leaf"></div><div id="lf8" class="px leaf"></div>
          </div>
        </div>

        <!-- ===== final garden (keyframe 4) ===== -->
        <div id="grp-final" class="layer hid">
          <img id="k4-base" class="full" src="assets/k4_base.jpg" alt="" />
          <img id="f-leaves" class="full" src="assets/f_leaves.png" alt="" />
          <img id="f-sp1" class="full" src="assets/f_sp1.png" alt="" />
          <img id="f-sp2" class="full" src="assets/f_sp2.png" alt="" />
          <img id="f-mate" class="full" src="assets/f_mate.png" alt="" />
        </div>
        <!-- block dissolve frames -->
        <img id="dis1" class="full hid" src="assets/dis1.png" alt="" />
        <img id="dis2" class="full hid" src="assets/dis2.png" alt="" />
        <img id="dis3" class="full hid" src="assets/dis3.png" alt="" />
        <img id="dis4" class="full hid" src="assets/dis4.png" alt="" />
        <img id="dis5" class="full hid" src="assets/dis5.png" alt="" />
        <img id="dis6" class="full hid" src="assets/dis6.png" alt="" />
        <img id="dis7" class="full hid" src="assets/dis7.png" alt="" />
        <img id="k4" class="full hid" src="assets/k4.jpg" alt="" />

        <!-- sparkles and dust (positions are set per burst in the script) -->
        <div id="fx" class="layer">
          <div id="st1" class="px star"></div><div id="st2" class="px star"></div><div id="st3" class="px star"></div>
          <div id="st4" class="px star"></div><div id="st5" class="px star"></div><div id="st6" class="px star"></div>
          <div id="du1" class="px dust"></div><div id="du2" class="px dust"></div><div id="du3" class="px dust"></div>
          <div id="du4" class="px dust"></div><div id="du5" class="px dust"></div><div id="du6" class="px dust"></div>
          <div id="du7" class="px dust"></div><div id="du8" class="px dust"></div>
        </div>
      </div>

      <audio id="aud-music" class="clip" src="assets/g_music.wav" data-start="0" data-duration="10" data-track-index="1" data-volume="0.55"></audio>
      <audio id="aud-sfx" class="clip" src="assets/g_sfx.wav" data-start="0" data-duration="10" data-track-index="2" data-volume="1"></audio>
      <audio id="aud-birds" class="clip" src="assets/g_birds.wav" data-start="0" data-duration="10" data-track-index="3" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const show = (sel, t) => tl.set(sel, { opacity: 1 }, t);
      const hide = (sel, t) => tl.set(sel, { opacity: 0 }, t);
      const S1 = "steps(1)";

      // ---- motion helpers (all stepped: sprite-style poses, no tweening between them)
      // hops with anticipation and landing squash; origin = the sprite's feet
      function hops(sel, t0, dur, from, to, n, h, origin) {
        const kf = [], d = dur / n / 3;
        for (let i = 1; i <= n; i++) {
          const fm = (i - 0.5) / n, f = i / n;
          const mx = from[0] + (to[0] - from[0]) * fm, my = from[1] + (to[1] - from[1]) * fm;
          const x = from[0] + (to[0] - from[0]) * f, y = from[1] + (to[1] - from[1]) * f;
          kf.push({ x: mx, y: my - h, scaleY: 1.06, duration: d, ease: S1 });
          kf.push({ x, y, scaleY: 0.9, duration: d, ease: S1 });
          kf.push({ scaleY: 1, duration: d, ease: S1 });
        }
        tl.fromTo(sel, { x: from[0], y: from[1], scaleY: 1, transformOrigin: origin }, { keyframes: kf, immediateRender: false }, t0);
      }
      // walk: every step bobs up and tilts left/right like a 16-bit walk cycle
      function walk(sel, t0, pts, stepDur, bob, tilt, origin) {
        const kf = [];
        pts.slice(1).forEach(([x, y], i) => {
          kf.push({ x, y: y - bob, rotation: i % 2 ? -tilt : tilt, duration: stepDur / 2, ease: S1 });
          kf.push({ x, y, rotation: 0, duration: stepDur / 2, ease: S1 });
        });
        tl.fromTo(sel, { x: pts[0][0], y: pts[0][1], rotation: 0, transformOrigin: origin }, { keyframes: kf, immediateRender: false }, t0);
      }
      // a stepped path through points (flight)
      function path(sel, t0, pts, dur) {
        const kf = pts.slice(1).map(([x, y]) => ({ x, y, duration: dur / (pts.length - 1), ease: "steps(2)" }));
        tl.fromTo(sel, { x: pts[0][0], y: pts[0][1] }, { keyframes: kf, immediateRender: false }, t0);
      }
      // two-frame wing flap
      function flap(open, closed, t0, t1, rate) {
        let k = 0;
        for (let t = t0; t < t1 - 1e-6; t += rate, k++) {
          tl.set(open, { opacity: k % 2 ? 0 : 1 }, t);
          tl.set(closed, { opacity: k % 2 ? 1 : 0 }, t);
        }
        tl.set(open, { opacity: 1 }, t1); tl.set(closed, { opacity: 0 }, t1);
      }
      // squash-and-stretch pop for things that appear (plant stages, feeder, wizard sitting)
      function pop(sel, t, origin, from) {
        tl.fromTo(sel, { scaleX: 1, scaleY: from, transformOrigin: origin }, {
          keyframes: [{ scaleY: 1.14, scaleX: 0.94, duration: 0.07, ease: S1 }, { scaleY: 0.96, scaleX: 1.03, duration: 0.07, ease: S1 }, { scaleY: 1, scaleX: 1, duration: 0.07, ease: S1 }],
          immediateRender: false }, t);
      }
      // idle loops: small stepped head-bob / breathing
      function idle(sel, t0, t1, every, vars, origin) {
        let k = 0;
        for (let t = t0; t < t1 - 1e-6; t += every, k++) tl.set(sel, Object.assign({ transformOrigin: origin }, k % 2 ? vars : resetOf(vars)), t);
        tl.set(sel, resetOf(vars), t1);
      }
      function resetOf(v) { const r = {}; for (const k in v) r[k] = k.startsWith("scale") ? 1 : 0; return r; }
      const ring = [[-60, -40], [55, -55], [70, 20], [-70, 25], [0, -80], [10, 60]];
      function sparkle(t, cx, cy, s) {
        ring.forEach(([dx, dy], i) => {
          const id = "#st" + (i + 1);
          tl.set(id, { left: cx + dx * s, top: cy + dy * s, opacity: 1, scale: 1 }, t + i * 0.02);
          tl.set(id, { scale: 0.5 }, t + 0.12 + i * 0.02);
          tl.set(id, { opacity: 0 }, t + 0.22 + i * 0.02);
        });
      }
      function burst(prefix, n, t, cx, cy, spread, life) {
        for (let i = 1; i <= n; i++) {
          const a = (i / n) * Math.PI * 2 + 0.4, dx = Math.cos(a) * spread, dy = Math.sin(a) * spread * 0.6;
          tl.set("#" + prefix + i, { left: cx, top: cy, x: 0, y: 0, rotation: 0, opacity: 1 }, t);
          tl.to("#" + prefix + i, { x: dx, y: dy + spread * 0.35, rotation: i % 2 ? 90 : -90, duration: life, ease: "steps(4)" }, t);
          tl.set("#" + prefix + i, { opacity: 0 }, t + life + 0.02);
        }
      }
      const FEET = "296px 1497px";          // standing wizard's feet (sprite coords)
      const PLANT = "560px 1160px";         // base of the planted tree

      // ---------- 0-2 s : seed, stand up and step back, three growth stages
      tl.fromTo("#kneel", { y: 0 }, { keyframes: [{ y: 6, duration: 0.05 }, { y: 0, duration: 0.05 }, { y: 6, duration: 0.05 }, { y: 0, duration: 0.05 }], ease: S1, immediateRender: false }, 0.08);
      burst("du", 4, 0.1, 640, 1150, 40, 0.2);
      show("#seed", 0.26);
      tl.fromTo("#seed", { x: 0, y: 0 }, { keyframes: [{ x: 22, y: -18 }, { x: 48, y: -22 }, { x: 72, y: 8 }, { x: 94, y: 62 }, { x: 108, y: 120 }, { x: 111, y: 128 }].map(k => Object.assign(k, { duration: 0.05, ease: S1 })), immediateRender: false }, 0.26);
      hide("#seed", 0.58);
      sparkle(0.58, 547, 1150, 0.6);
      // stand up where he knelt (crouch -> stretch), then hop back
      hide("#kneel", 0.34); show("#stand", 0.34);
      tl.fromTo("#stand", { x: 279, y: -336, scaleY: 0.86, transformOrigin: FEET }, { keyframes: [{ scaleY: 1.06, duration: 0.05, ease: S1 }, { scaleY: 1, duration: 0.05, ease: S1 }], immediateRender: false }, 0.34);
      hops("#stand", 0.46, 0.42, [279, -336], [0, 0], 3, 36, FEET);
      // stage 1 sprout, stage 2 sapling, stage 3 young tree (keyframe 2)
      show("#sprout", 0.8); pop("#sprout", 0.8, PLANT, 0.3); sparkle(0.82, 560, 1110, 0.7);
      hide("#sprout", 1.2); show("#sapling", 1.2); pop("#sapling", 1.2, PLANT, 0.55); sparkle(1.22, 552, 1040, 1.0);
      hide("#sapling", 1.6); show(["#trunk", "#canopy"], 1.6); pop(["#trunk", "#canopy"], 1.6, PLANT, 0.7); sparkle(1.62, 552, 900, 1.5);
      idle("#stand", 1.0, 2.1, 0.4, { scaleY: 1.015 }, FEET);           // breathing while he watches

      // ---------- 2-5 s : the feeder grows from the branch, birds fly in
      tl.fromTo("#rope-clip", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.3, ease: "steps(4)" }, 2.05);
      // the canopy swells and bursts into leaves exactly as the feeder grows out of it
      tl.fromTo("#canopy", { scale: 1, transformOrigin: "552px 880px" }, { keyframes: [{ scale: 1.1, duration: 0.07, ease: S1 }, { scale: 0.5, duration: 0.05, ease: S1 }, { scale: 0, duration: 0.05, ease: S1 }], immediateRender: false }, 2.36);
      burst("lf", 8, 2.43, 552, 880, 150, 0.32);
      hide("#trunk", 2.45); show("#trunk8", 2.45);
      show("#feeder", 2.45);
      tl.fromTo("#feeder", { scale: 0.15, transformOrigin: "574px 748px" }, { keyframes: [{ scale: 0.55, duration: 0.08, ease: S1 }, { scale: 1.12, duration: 0.08, ease: S1 }, { scale: 0.96, duration: 0.08, ease: S1 }, { scale: 1, duration: 0.08, ease: S1 }], immediateRender: false }, 2.45);
      sparkle(2.5, 574, 880, 1.6); sparkle(2.8, 574, 860, 2.0);
      // the feeder sways on its rope and settles
      tl.fromTo("#feeder", { rotation: 0 }, { keyframes: [{ rotation: 4 }, { rotation: -3 }, { rotation: 2 }, { rotation: -1 }, { rotation: 0 }].map(k => Object.assign(k, { duration: 0.12, ease: S1 })), immediateRender: false }, 2.8);
      // the wizard points at the sky as the birds come
      hide("#stand", 3.1); show("#point", 3.1); pop("#point", 3.1, FEET, 0.94);
      // kiskadee swoops in from the top-left and hovers at the feeder (keyframe 3 at 5 s)
      show("#kis", 3.0);
      path("#kis", 3.0, [[-560, -600], [-430, -470], [-300, -300], [-180, -140], [-80, -40], [-20, 6], [0, 0]], 1.0);
      flap("#kis-open", "#kis-closed", 3.0, 4.0, 0.09);
      flap("#kis-open", "#kis-closed", 4.0, 4.98, 0.14);
      idle("#kis", 4.0, 4.98, 0.14, { y: -6 }, "0px 0px");
      // rufous hornero dips in from the right
      show("#hor", 3.6);
      path("#hor", 3.6, [[460, -300], [340, -150], [220, -40], [120, 20], [40, 10], [0, 0]], 1.2);
      flap("#hor-open", "#hor-closed", 3.6, 4.8, 0.09);
      flap("#hor-open", "#hor-closed", 4.8, 4.98, 0.09);

      // ---------- 5-8 s : landing, sparrows, the wizard unfolds the chair and sits
      // kiskadee: fold wings, drop onto its perch, little bounce
      flap("#kis-open", "#kis-closed", 5.0, 5.2, 0.1);
      tl.set("#kis-open", { opacity: 0 }, 5.2); tl.set("#kis-closed", { opacity: 1 }, 5.2);
      tl.to("#kis", { x: 53 * 0.5, y: 71 * 0.5 - 10, duration: 0.06, ease: S1 }, 5.2);
      tl.to("#kis", { x: 53, y: 71, duration: 0.06, ease: S1 }, 5.26);
      hide("#kis", 5.32); show("#l-kis", 5.32);
      tl.fromTo("#l-kis", { y: 0 }, { keyframes: [{ y: 6 }, { y: -2 }, { y: 0 }].map(k => Object.assign(k, { duration: 0.06, ease: S1 })), immediateRender: false }, 5.32);
      // hornero: flies left onto the other side of the feeder
      path("#hor", 5.0, [[0, 0], [-60, -40], [-130, -70], [-190, -80], [-220, -76]], 0.6);
      flap("#hor-open", "#hor-closed", 5.0, 5.6, 0.09);
      tl.set("#hor-open", { opacity: 0 }, 5.6); tl.set("#hor-closed", { opacity: 1 }, 5.6);
      hide("#hor", 5.66); show("#l-hor-o", 5.66);
      tl.fromTo("#l-hor-o", { y: 0 }, { keyframes: [{ y: 6 }, { y: -2 }, { y: 0 }].map(k => Object.assign(k, { duration: 0.06, ease: S1 })), immediateRender: false }, 5.66);
      // ... and its colour settles to the rufous of the final keyframe
      tl.fromTo("#l-hor", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "steps(3)", immediateRender: false }, 5.9);
      hide("#l-hor-o", 6.2);
      // perched birds peck at the feeder
      idle("#l-kis", 5.6, 7.4, 0.35, { rotation: 6 }, "470px 1020px");
      idle("#l-hor", 6.25, 7.4, 0.4, { rotation: -6 }, "650px 1000px");
      // two sparrows hop in and peck the fallen seeds
      show(["#l-sp1", "#l-sp2"], 5.6);
      hops("#l-sp1", 5.6, 0.8, [-440, 40], [0, 0], 4, 30, "430px 1250px");
      hops("#l-sp2", 5.72, 0.8, [440, 40], [0, 0], 4, 30, "690px 1250px");
      for (let t = 6.55; t < 7.4; t += 0.3) {
        tl.set("#l-sp1", { rotation: 18, y: 4, transformOrigin: "430px 1250px" }, t); tl.set("#l-sp1", { rotation: 0, y: 0 }, t + 0.12);
        tl.set("#l-sp2", { rotation: -18, y: 4, transformOrigin: "690px 1250px" }, t + 0.15); tl.set("#l-sp2", { rotation: 0, y: 0 }, t + 0.27);
      }
      // the wizard walks along the front path, then up the right side to the folded chair
      hide("#point", 5.5); show("#stand", 5.5);
      const front = [[0, 0], [110, 6], [220, 10], [330, 14], [440, 16], [560, 18]];
      const up = [[560, 18], [572, -92], [582, -200], [590, -306], [596, -410], [600, -500]];
      walk("#stand", 5.52, front, 0.11, 14, 4, FEET);
      tl.set("#stand", { zIndex: 15 }, 6.07);                         // now behind the feeder and the sparrows
      walk("#stand", 6.07, up, 0.13, 12, 4, FEET);
      // poof: the chair unfolds and he sits down with his mate
      burst("du", 8, 6.74, 930, 760, 120, 0.26);
      sparkle(6.78, 930, 700, 2.2);
      hide("#plate", 6.86); show("#plate-nochair", 6.86);
      hide("#stand", 6.86); show("#l-wiz", 6.86);
      pop("#l-wiz", 6.86, "880px 963px", 0.82);
      idle("#l-wiz", 7.1, 7.4, 0.15, { scaleY: 1.01 }, "880px 963px");

      // ---------- 7.4-8 s : 16-bit block dissolve into keyframe 4
      for (let i = 1; i <= 7; i++) {
        show("#dis" + i, 7.4 + (i - 1) * 0.075);
        if (i > 1) hide("#dis" + (i - 1), 7.4 + (i - 1) * 0.075);
      }
      show("#grp-final", 7.925); hide("#dis7", 7.925); hide("#grp-patio", 7.925);

      // ---------- 8-9.2 s : pecking loop, mate sip, leaves sway
      for (let t = 8.0; t < 9.2; t += 0.3) {
        tl.set("#f-sp1", { rotation: 16, y: 3, transformOrigin: "395px 1282px" }, t); tl.set("#f-sp1", { rotation: 0, y: 0 }, t + 0.12);
        tl.set("#f-sp2", { rotation: -16, y: 3, transformOrigin: "560px 1282px" }, t + 0.15); tl.set("#f-sp2", { rotation: 0, y: 0 }, t + 0.27);
      }
      tl.fromTo("#f-mate", { y: 0 }, { keyframes: [{ y: -8 }, { y: -16 }, { y: -16 }, { y: -16 }, { y: -8 }, { y: 0 }], duration: 0.6, ease: S1, immediateRender: false }, 8.3);
      [[8.0, 4], [8.25, 0], [8.5, -4], [8.75, 0], [9.0, 3], [9.15, 0]].forEach(([t, x]) => tl.set("#f-leaves", { x }, t));

      // ---------- 9.2-10 s : calm, exact keyframe 4
      show("#k4", 9.2);
      tl.set("#stage", { x: 0 }, 9.99);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
