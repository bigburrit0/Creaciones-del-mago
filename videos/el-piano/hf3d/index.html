      // ---------- the rambla at Kibón (Pocitos), Montevideo, a clear summer day: the checkerboard paving and the pink granite bench-wall of the
      //            Rambla Sur's design, the beach below it, the Río de la Plata, the bay's buildings, the celeste sky, the MONTEVIDEO letters ----------

      const foam = new THREE.Mesh(new THREE.PlaneGeometry(90, 0.3, 90, 1), new THREE.MeshBasicMaterial({ color: "#F4FAFC", transparent: true, opacity: 0.8 })); foam.rotation.x = -Math.PI / 2; foam.position.set(0, -0.355, -15.5); scene.add(foam);

        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 2.2, 10), toon("#8A6A4A")); trunk.position.y = 1.1; shade(trunk); g.add(trunk); outline(trunk, WO);

      // the MONTEVIDEO letters (the photo spot at Kibón), behind El Mago's left on the promenade
      { const g = new THREE.Group(); g.position.set(-2.75, 0, -1.02); g.rotation.y = 0; scene.add(g); const word = "MONTEVIDEO", cols = ["#E86A4A", "#F2C14E", "#4F86C6", "#5C9A4A", "#C0392B"];

      // the bench: wooden slats on two iron legs

      { const g = new THREE.Group(); g.position.set((BN.x0 + BN.x1) / 2, 0, (BN.z0 + BN.z1) / 2); scene.add(g); const W = BN.x1 - BN.x0;

      // a lamp post at the left (set dressing far from everyone)

      const PW = 0.75, PD = 0.32, PH = 0.74;
      const piano = new THREE.Group(); scene.add(piano); const wheels = [];
      { rbox(PW, PH, PD, "#4A2A1C", 0, 0.05 + PH / 2, 0, piano, { r: 0.05 }); rbox(PW + 0.04, 0.04, PD + 0.04, "#3A2016", 0, 0.05 + PH + 0.02, 0, piano, { r: 0.2 });

      const vS = santa.stanceSpeed("Walk_Loop"), W0 = -0.6;
      const sAt = (t) => { const u = clamp((t - W0) / (T.stop - W0), 0, 1); return lerp(SX0, SX1, u * 0.85 + 0.15 * ss(u)); };
      santa.add("Walk_Loop", -1.0, T.stop + 0.12, { speed: clamp((SX0 - SX1) / (T.stop - W0) / Math.max(vS, 0.05), 0.5, 1.6) });
      santa.add("Idle_Loop", T.stop - 0.1, DUR + 1, { off: 0.2 });
      mago.add("Idle_Loop", -0.3, DUR + 1, { off: 0.6 });
      const { frame, wp, IKQ, arm, handC, headPt, solveArms } = makeRig([mago, santa]);
      const { LINES, ENV, talk } = await voices(FPS);
      const hSAt = (t) => lerp(-Math.PI / 2, -1.2, seg(t, T.stop + 0.6, T.stop + 1.2));
      function poseAt(t) {
        IKQ.length = 0;
        santa.apply(t); santa.W.position.set(sAt(t), 0, SZ); santa.W.rotation.y = hSAt(t); santa.W.updateMatrixWorld(true);
        mago.apply(t); mago.W.position.copy(MD); mago.W.rotation.y = hM; mago.W.updateMatrixWorld(true);
        const SF = frame(santa), MF = frame(mago);
        rotWorld(santa.b("DEF-upper_arm.L"), SF.fwd, 0.16); rotWorld(santa.b("DEF-upper_arm.R"), SF.fwd, -0.16);
        rotWorld(mago.b("DEF-upper_arm.L"), MF.fwd, 0.1); rotWorld(mago.b("DEF-upper_arm.R"), MF.fwd, -0.1);
        const turnTo = (c, P0, k) => { const dir = P0.clone().sub(c.W.position); const a = unwrap(Math.atan2(dir.x, dir.z), c.W.rotation.y) - c.W.rotation.y; rotWorld(c.b("DEF-head"), V3(0, 1, 0), clamp(a, -0.9, 0.9) * k); };
        // ---- Papá Noel: pushes the piano (both mittens on its right end, leaning in); out of breath when it stops; watches; asks
        const push = 1 - seg(t, T.stop + 0.35, T.stop + 0.8), pc = sAt(t) - PGAP;
        for (const [side, dz] of [["L", 0.11], ["R", -0.11]]) arm(santa, side, V3(pc + PW / 2 + 0.03, 0.66, SZ + dz), push, null, 0.04);
        rotWorld(santa.b("DEF-spine.003"), SF.left, 0.07 * push + 0.05 * Math.sin(t * 5.5) * pulse(t, T.stop, T.stop + 0.3, T.m1 + 0.6, T.m1 + 1.0));   // leans into it; puffs
        turnTo(santa, FP, 0.45 * pulse(t, T.rise, T.rise + 0.3, T.s2 - 0.2, T.s2 + 0.2));
        // ---- El Mago: deadpan; the magic hand (left) lifts the ocarina and conducts; the same hand opens to receive it; to the viewer for the CTA
        const magic = pulse(t, T.rise - 0.4, T.rise, T.give - 0.3, T.give + 0.1), palm = seg(t, T.give - 0.25, T.give + 0.35);
        { const sh = wp(mago.b("DEF-upper_arm.L")); arm(mago, "L", sh.clone().add(MF.left.clone().multiplyScalar(0.16)).add(MF.fwd.clone().multiplyScalar(0.1)).add(V3(0, 0.2 + 0.025 * Math.sin(t * 4.5) + 0.12 * (1 - magic), 0)), magic, null, 0.08); }
        arm(mago, "L", PALM, palm, null, 0.04);
        turnTo(mago, FP, 0.5 * pulse(t, T.rise - 0.2, T.rise + 0.2, T.ocaEnd, T.ocaEnd + 0.4));
        turnTo(mago, LENS_C, Math.max(pulse(t, T.m1 - 0.25, T.m1 + 0.05, T.m1 + 1.6, T.m1 + 1.9), pulse(t, T.m2 - 0.2, T.m2 + 0.1, T.m2 + 2.3, T.m2 + 2.6), pulse(t, T.cta - 0.2, T.cta + 0.1, DUR, DUR + 1)));
        { const sh = wp(mago.b("DEF-upper_arm.R")), dir = LENS_C.clone().sub(sh).normalize();
          arm(mago, "R", sh.clone().add(dir.multiplyScalar(0.4)).add(V3(0, -0.04, 0)), pulse(t, T.c5 + 0.1, T.c5 + 0.65, T.card + 0.3, T.card + 0.8), null, 0.08); }
        let e = 0; for (const b of [1.8, 5.0, 8.1, 10.9, 13.9, 15.8, 18.3, 21.6]) { const u = (t - b) * FPS; if (u >= 0 && u < 12) e = Math.max(e, u < 4 ? u / 4 : u < 6 ? 1 : 1 - (u - 6) / 6); }
        mago.b("eyes").scale.y = 1 - 0.9 * e;
        santa.b("brows").position.y += 0.016 * Math.max(pulse(t, -1, 0, 2.6, 3.0), pulse(t, T.oca + 0.4, T.oca + 0.7, T.s2 + 2.0, T.s2 + 2.3));
        talk(santa, "santa", t, SF); talk(mago, "mago", t, MF);
        solveArms([santa, mago]);
      }
      const { springs } = characterSprings(mago, santa, DUR, FPS, poseAt);

      // ---------- props ----------
      const flyArc = (A, Bp, u, h) => A.clone().lerp(Bp, u).add(V3(0, 4 * h * u * (1 - u), 0));
      function props(t) {
        const pc = sAt(t) - PGAP; piano.position.set(pc, 0, SZ); wheels.forEach((w) => (w.rotation.y = -(pc - (SX0 - PGAP)) / 0.025));
        const v = ss(clamp((t - T.rise) / (T.land - T.rise), 0, 1)), w = ss(clamp((t - T.give) / 0.7, 0, 1)), bob = 0.008 * Math.sin(t * 2.4) * seg(t, T.land, T.land + 0.3) * (1 - w);
        OC.g.position.copy(flyArc(ONBENCH, FP, v, 0.1)); OC.g.position.y += bob; if (w > 0) OC.g.position.copy(flyArc(FP, INHAND, w, 0.08));
        OC.g.rotation.set(lerp(lerp(0, 0.8, v), 0.45, w), lerp(lerp(0.15, 0, v), hM - Math.PI / 2 + 0.25, w) + 0.25 * Math.sin((t - T.prod) * 1.1) * pulse(t, T.prod - 0.1, T.prod + 0.2, T.cta - 0.2, T.cta), 0.06 * Math.sin(t * 1.7) * seg(t, T.land, T.land + 0.3) * (1 - w));
        const mag = seg(t, T.caps, T.caps + 0.4) * (1 - seg(t, T.ocaEnd + 0.1, T.ocaEnd + 0.45));
        const st = OC.play(t, NOTES, T.oca, mag);
        scene.updateMatrixWorld(true);
        for (const id of OC.ALL) { const d = st.since[id], pr = HS[id], P = OC.holeWorld(id);
          pr.forEach((m, i) => { m.visible = d !== undefined && d < 0.35; if (!m.visible) return; const a = i * 2.4 + id.length;
            m.position.copy(P).add(V3(Math.cos(a) * 0.04 * d / 0.35, 0.05 * d / 0.35 + 0.01, Math.sin(a) * 0.03 * d / 0.35)); m.scale.setScalar(1 - d / 0.35); m.rotation.y = t * 6; }); }
        SPK.forEach((m, i) => { let best = null, dt = 9;
          for (const [t0, Q] of [[T.rise, ONBENCH], [T.caps, FP]]) { const d = t - t0 - (i % 5) * 0.012; if (d > 0 && d < dt) { dt = d; best = Q; } }
          m.visible = dt < 0.5 && i < 16; if (!m.visible) return; const q = V3((rnd(i) - 0.5) * 0.4, 0.15 + rnd(i + 50) * 0.25, (rnd(i + 99) - 0.5) * 0.4);
          m.position.copy(best).add(q.multiplyScalar(dt * 0.7)); m.position.y -= 0.35 * dt * dt; m.scale.setScalar(0.25 * (1 - dt / 0.5)); });
        seaTex.offset.set((t * 0.004) % 1, (t * 0.006) % 1); foam.position.z = -15.5 + 0.15 * Math.sin(t * 0.9);
        blobM.position.set(mago.W.position.x, 0.003, mago.W.position.z); blobS.position.set(santa.W.position.x, 0.003, santa.W.position.z);
      }

      // ---------- camera and editing (every camera looks toward the water) ----------
      const SHOTS = [
        { t: 0.0, d: 1.5, fov: 36, from: [0.3, 0.78, 0.12], to: [0.27, 0.76, 0.04], look: [0.08, 0.45, -0.75] },                                          // hook: the ocarina on the bench; the piano rolls in
        { t: 1.5, d: T.m1 - 0.05 - 1.5, fov: 40, subj: "santa", h: 1.3, az: -50, el: 4, v: 0.2, track: true },                                              // "…para la rambla!": pushing, puffing
        { t: T.m1 - 0.05, d: T.rise - 0.05 - T.m1 + 0.05, fov: 30, subj: "mago", h: 0.74, az: 48, el: -9, v: -0.02 },                                        // "Yo también."
        { t: T.rise - 0.05, d: T.oca - 0.25 - T.rise + 0.05, fov: 50, from: [0.35, 1.2, 3.45], to: [0.35, 1.18, 3.3], look: [0.33, 0.62, -0.4] },             // the ocarina rises, tiny next to the piano
        { t: T.oca - 0.25, d: 8.7 - T.oca + 0.25, fov: 30, subj: "oca", h: 0.2, az: 6, el: 10, v: 0.0, whip: 1 },                                             // it plays
        { t: 8.7, d: T.s2 - 0.1 - 8.7, fov: 36, subj: "santa", h: 1.25, az: -38, el: 8, v: 0.2 },                                    // the ocarina in front, the piano and Papá Noel behind
        { t: T.s2 - 0.1, d: T.give - 0.05 - T.s2 + 0.1, fov: 34, subj: "santa", h: 1.0, az: -40, el: 4, v: 0.2 },                                             // "¿Y eso entra en una mano?"
        { t: T.give - 0.05, d: T.prod - T.give + 0.05, fov: 36, subj: "mago", h: 1.0, az: 48, el: -3, v: 0.2 },                                               // into his hand: "En una mano…"
        { t: T.prod, d: T.cta - T.prod, fov: 30, subj: "inhand", h: 0.36, az: 32, el: 16, v: 0.08, push: [1.06, 0.96] },                                       // the product beat
        { t: T.cta, d: T.card - T.cta, fov: 36, subj: "mago", h: 1.15, az: 40, el: -3, v: 0.12, whip: 1 },                                                     // CTA
        { t: T.card, d: DUR - T.card, fov: 52, from: [0.35, 1.25, 3.5], to: [0.35, 1.23, 3.4], look: [0.33, 0.66, -0.4] },                                         // the card over the rambla
      ];
      const cam = camRig({ camera, shots: SHOTS, chars: { mago, santa }, poseAt, props, points: { oca: FP.clone(), inhand: INHAND.clone() },
        punch: [[T.s2 + 0.1, 0.06]], shake: [], flash: [[T.prod, 0.12, "#FFFDF2"]],
        canvasEl: document.getElementById("c"), flashEl: document.getElementById("flash") });
      cam.measure();

      // ---------- text ----------
      const overlay = kineticOverlay({ LINES, ENV, FPS, T, subsEl: document.getElementById("subs"), cardEl: document.getElementById("card"), hookEl: document.getElementById("hook"), hook: [-0.2, 1.55] });
      const backOut = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
      const snd = { style: {} }, prod = document.getElementById("prod"), TAGS = [...prod.querySelectorAll(".tag")];
      function dom(t) {
        { const a = Math.min(clamp((t - T.oca + 0.2) / 0.2, 0, 1), clamp((T.ocaEnd + 0.3 - t) / 0.2, 0, 1)); snd.style.visibility = a > 0 ? "visible" : "hidden";
          if (a > 0) { snd.style.opacity = a.toFixed(3); snd.style.transform = `translateX(-50%) scale(${(0.8 + 0.2 * backOut(clamp((t - T.oca + 0.2) / 0.25, 0, 1))).toFixed(3)}) rotate(${(-2 + Math.sin(t * 3)).toFixed(2)}deg)`; } }
        const pv = t >= T.prod && t < T.cta; prod.style.visibility = pv ? "visible" : "hidden";
        if (pv) { prod.style.opacity = Math.min(1, (t - T.prod) / 0.1, (T.cta - t) / 0.1).toFixed(3);
          TAGS.forEach((g, i) => { const a = clamp((t - T.prod - 0.25 - i * 0.35) / 0.25, 0, 1); g.style.opacity = a > 0 ? "1" : "0";
            g.style.transform = `rotate(${(i ? 3 : -4) + (1 - a) * 10}deg) scale(${(0.7 + 0.3 * backOut(a)).toFixed(3)})`; }); }
      }
      let lastT = null;
      function renderAt(t) { if (t === lastT) return; lastT = t; poseAt(t); springs(t); props(t); cam.at(t); renderer.render(scene, camera); overlay(t); dom(t); }

      /* QA gate: the shared checks (no walls here: a dummy door far away; everyone stays well in front of the wall line z = -1.1),
         the bench, the rambla wall and the moving piano against both bodies (his arms excluded while he pushes), the ocarina */
      const DOOR = { x0: 40, x1: 41, h: 1.55, z: -40 }, hinge = new THREE.Group(); hinge.position.set(50, 0, 50); scene.add(hinge);
      const QB = qaBase({ chars: { mago, santa }, DOOR, hinge, BTRACK, rig: { handC, wp } });
      const boxD = (p, F) => { const q = V3(clamp(p.x, F.min.x, F.max.x), clamp(p.y, F.min.y, F.max.y), clamp(p.z, F.min.z, F.max.z)); return q.distanceTo(p); };
      function qa(t) {
        lastT = null; poseAt(t); springs(t); props(t); scene.updateMatrixWorld(true); const out = [];
        const pc = piano.position.x;
        const FURN = [{ name: "bench", min: V3(BN.x0, 0, BN.z0), max: V3(BN.x1, 0.8, BN.z1) }, { name: "wall", min: V3(-8, 0, -1.45), max: V3(8, 0.52, -1.1) },
          { name: "piano", min: V3(pc - PW / 2, 0, SZ - PD / 2 - 0.01), max: V3(pc + PW / 2, PH + 0.1, SZ + PD / 2 + 0.14) }];
        for (const [c, nm] of [[mago, "mago"], [santa, "santa"]]) for (const k of c.colliders(true)) for (const p of k.b ? [k.a, k.b, k.a.clone().lerp(k.b, 0.5)] : [k.a]) for (const F of FURN) {
          if (F.name === "piano" && nm === "santa" && /^(upper|fore)/.test(k.name) && t < T.stop + 0.9) continue;
          const d = boxD(p, F); if (d < k.r - 0.01) out.push(["furniture", nm, k.name, F.name, +(k.r - d).toFixed(3)]); }
        const op = OC.g.getWorldPosition(V3(0, 0, 0)), held = t > T.give;
        for (const [cn, c] of [["mago", mago], ["santa", santa]]) for (const k of c.colliders(true)) { if (held && cn === "mago" && /^(upper|fore)/.test(k.name)) continue;
          const d = colDist(op, k).d; if (d < (held ? 0.035 : 0.1)) out.push(["ocarina", cn, k.name, +d.toFixed(3)]); }
        if (boxD(op, FURN[2]) < 0.03) out.push(["ocarina-piano"]);
        const J = QB(out, []);
        return { t, out, J };
      }
      window.__qa = qa;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__draw3d = renderAt; window.__T = T; window.__JUMP_OK = [];
      window.__dbg = { mago, santa, OC, piano, scene, renderer, camera, THREE };
      renderAt(0);
      markReady();
    </script>
