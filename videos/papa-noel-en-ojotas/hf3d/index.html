        const mouthM = headPt(mago, 0.0, 0.17, 0.01);
        arm(mago, "R", mouthM, Math.max(pulse(t, T.mSip, T.mSip + 0.2, T.mSip + 0.55, T.mSip + 0.75), pulse(t, T.mSip2, T.mSip2 + 0.2, DUR, DUR + 1)));

        const get = Math.max(pulse(t, T.pop1, T.pop1 + 0.1, T.toss1 - 0.05, T.toss1 + 0.05), pulse(t, T.pop2, T.pop2 + 0.1, T.toss2 - 0.05, T.toss2 + 0.05), pulse(t, T.popT, T.popT + 0.1, T.tossT - 0.05, T.tossT + 0.05));

        rotWorld(mago.b("DEF-spine.003"), MF.left, -0.1 * get);
        // face: surprised brows at the door bang, at the idea and at the TNT
        mago.b("brows").position.y += 0.012 * Math.max(pulse(t, 0.6, 0.65, 1.6, 1.9), pulse(t, T.idea - 0.05, T.idea, T.idea + 0.6, T.idea + 0.8), pulse(t, T.popT, T.popT + 0.05, T.boom, T.boom + 0.2));
        let e = 0; for (const b of [1.9, 3.4, 5.1, 7.4, 9.4, 11.3, 13.7, 15.2, 16.6]) { const u = (t - b) * FPS; if (u >= 0 && u < 12) e = Math.max(e, u < 4 ? u / 4 : u < 6 ? 1 : 1 - (u - 6) / 6); }

      }

      // ---------- secondary motion (simulated once): hats, beards, Santa's belly ----------
      const N = DUR * FPS + 1, qW = (b) => { const q = new THREE.Quaternion(); b.getWorldQuaternion(q); return q; };
      const pt = (b, x, y, z) => () => { const p = V3(x, y, z); b.localToWorld(p); return p; };
      const SPR = simulateSprings(N, FPS, poseAt, [
        { ref: pt(mago.b("DEF-head"), 0, 0.35, 0), frame: () => qW(mago.b("DEF-head")), f: 2.3, z: 0.3, g: 0.06, lim: 0.5 },
        { ref: pt(mago.b("DEF-spine.003"), 0, 0.1, 0.2), frame: () => qW(mago.b("DEF-spine.003")), f: 2.6, z: 0.3, g: 0.035, lim: 0.25, minB: -0.02 },
        { ref: pt(santa.b("DEF-head"), 0, 0.35, 0), frame: () => qW(santa.b("DEF-head")), f: 1.8, z: 0.25, g: 0.09, lim: 0.6 },
        { ref: pt(santa.b("DEF-spine.003"), 0, 0.1, 0.25), frame: () => qW(santa.b("DEF-spine.003")), f: 2.4, z: 0.3, g: 0.035, lim: 0.25, minB: -0.02 },
        { ref: pt(santa.b("DEF-hips"), 0, 0.1, 0.2), frame: () => qW(santa.b("DEF-hips")), f: 1.9, z: 0.2, g: 0.025, lim: 0.12, gy: true },
      ]);
      const eu = new THREE.Euler(), qq = new THREE.Quaternion();
      const tilt = (b, x, z) => { if (!b) return; eu.set(z, 0, -x); b.quaternion.multiply(qq.setFromEuler(eu)); };
      function springs(t) {
        const f = clamp(Math.round(t * FPS), 0, N - 1), g = (k, i) => SPR[k][f * 2 + i];
        [0.35, 0.6, 0.9].forEach((k, i) => tilt(mago.b("hat." + (i + 1)), g(0, 0) * k, g(0, 1) * k));
        [0.5, 0.8].forEach((k, i) => tilt(mago.b("beard." + (i + 1)), g(1, 0) * k, g(1, 1) * k));
        [0.35, 0.65, 1.0].forEach((k, i) => tilt(santa.b("hat." + (i + 1)), g(2, 0) * k, g(2, 1) * k));
        [0.5, 0.8].forEach((k, i) => tilt(santa.b("beard." + (i + 1)), g(3, 0) * k, g(3, 1) * k));
        const bl = santa.b("belly"); if (bl) { const v = g(4, 1); bl.scale.set(1 + v * 0.8, 1 - v * 1.2, 1 + v * 0.8); }
      }
      // where the gifts leave his hands (pose evaluated once per toss)
      const REL = {}; for (const k of ["toss1", "toss2", "tossT"]) { poseAt(T[k]); REL[k] = wp(mago.b("DEF-hand.R")).lerp(wp(mago.b("DEF-hand.L")), 0.5).add(V3(0, 0.05, 0)); }

      // ---------- props per frame ----------
      const SACK_TOP = 0.36;
      function arc(obj, t, t0, dur, A, Bp, h, spin = 1) { const u = (t - t0) / dur; obj.visible = u >= 0 && u <= 1; if (!obj.visible) return u > 1;

      function props(t) {
        // door: bursts open with an overshoot, light spills in, closes at the end with a small bounce
        const o = t - T.doorOpen, c = t - T.doorClose;
        let ang = o < 0 ? 0 : -1.75 - 0.25 * Math.sin(Math.min(o, 0.6) / 0.6 * Math.PI * 2.5) * Math.exp(-o * 5) * (o < 0.6 ? 1 : 0) - (o < 0.12 ? (1 - o / 0.12) * -1.75 : 0);
        if (c > 0) ang = c < 0.12 ? -1.75 * (1 - c / 0.12) : 0.06 * Math.sin((c - 0.12) * 40) * Math.exp(-(c - 0.12) * 10);
        hinge.rotation.y = ang; spill.material.opacity = clamp(-ang / 1.75, 0, 1) * 0.85;
        // printer: printing in the press windows
        const on = (t > 0 && t < 0.6) || (t > T.press + 0.1 && t < T.pop1) || (t > T.pop1 + 0.35 && t < T.pop2) || (t > T.rapid - 0.1 && t < T.popT);
        if (PR.head) PR.head.position.x = PRrest.head.x + (on ? 0.32 * Math.sin(t * 21) : 0.55);
        if (PR.bed) PR.bed.position.z = PRrest.bed.z + (on ? 0.25 * Math.sin(t * 8.3) : 0);
        if (nozzleMat) nozzleMat.color.set(on ? "#F2C14E" : "#2E2160");
        // mate: bench -> El Mago -> Santa -> El Mago -> bench -> El Mago
        const owner = t < T.mW0 ? "bench" : t < T.give ? "M" : t < T.back ? "S" : t < T.press ? "M" : t < T.mPick ? "bench" : "M";
        if (owner === "bench") { mate.position.set(-0.98, 0.58, -0.66); mate.rotation.set(0, 0, 0); }
        else { const c2 = owner === "M" ? mago : santa, hp = wp(c2.b("DEF-hand.R")), F = frame(c2); mate.position.copy(hp).add(F.fwd.clone().multiplyScalar(0.03)).add(V3(0, -0.04, 0));
               const sipping = owner === "S" ? pulse(t, T.sip0 + 0.1, T.sip0 + 0.3, T.relief - 0.15, T.relief) : pulse(t, T.mSip + 0.1, T.mSip + 0.3, T.mSip + 0.5, T.mSip + 0.7) + pulse(t, T.mSip2 + 0.1, T.mSip2 + 0.3, DUR, DUR + 1);

        // sack: on Santa's back, dropped by the stool, shaken upside down, on his lap, filling with gifts, on his shoulder

        let bounce = 0; for (const lt of [10.6, 11.2, 11.0, 11.1, 11.2, 11.3, 11.4, 11.5, 11.6, 11.7, T.boom]) { const d = t - lt; if (d > 0 && d < 0.5) bounce += Math.sin(d / 0.5 * Math.PI * 2) * Math.exp(-d * 7) * 0.12; }
        const SF = frame(santa); let sp, sq = 0, rot = 0, sc = 1;
        if (t < T.sit + 0.45) { sp = wp(santa.b("DEF-spine.003")).add(SF.fwd.clone().multiplyScalar(-0.24)).add(V3(0, -0.12, 0)); rot = 0.3; }
        else if (t < T.shake0) { const d = clamp((t - T.sit - 0.45) / 0.18, 0, 1); sp = wp(santa.b("DEF-spine.003")).add(SF.fwd.clone().multiplyScalar(-0.24)).lerp(K, d); sp.y = lerp(0.55, 0, d * d); rot = 0.3 * (1 - d); }

               sp = wp(santa.b("DEF-hand.R")).lerp(wp(santa.b("DEF-hand.L")), 0.5).add(V3(0, -0.12 + 0.28 * up, 0)); rot = Math.PI * up; }
        else if (t < T.shoulder) { const d = clamp((t - T.sad1 - 0.1) / 0.2, 0, 1); sp = wp(santa.b("DEF-hips")).add(SF.fwd.clone().multiplyScalar(0.25)).lerp(K, d); sp.y = lerp(0.18, 0, d); }
        else if (t < T.exit) { const d = clamp((t - T.shoulder) / 0.25, 0, 1); sp = K.clone().lerp(wp(santa.b("DEF-shoulder.R")).add(V3(0, 0.02, 0)).add(SF.fwd.clone().multiplyScalar(-0.1)), d); rot = -0.9 * d; }

        sq = bounce; const fs = 0.55 + 0.45 * fill; sack.scale.set(fs * (1.25 - 0.25 * fill) * (1 - sq / 2), fs * (0.55 + 0.45 * fill) * (1 + sq), fs * (1.25 - 0.25 * fill) * (1 - sq / 2));

        CLICK.forEach((g, i) => { const off = V3((i - 1.5) * 0.06, 0, 0);
          if (t >= T.pop1 && t < T.toss1) { g.visible = true; g.position.copy(wp(mago.b("DEF-hand.R")).lerp(wp(mago.b("DEF-hand.L")), 0.5)).add(V3(0, 0.07, 0)).add(off); g.rotation.set(0, t * 2 + i, 0); }
          else arc(g, t, T.toss1 + 0.04 * i, 0.5, REL.toss1.clone().add(off), mouth, 0.35, 1 + i * 0.2); });
        if (t >= T.pop2 && t < T.toss2) { CREEPER.visible = true; CREEPER.position.copy(wp(mago.b("DEF-hand.R")).lerp(wp(mago.b("DEF-hand.L")), 0.5)).add(V3(0, 0.06, 0)); CREEPER.rotation.set(0, t * 2, 0); }
        else arc(CREEPER, t, T.toss2, 0.5, REL.toss2, mouth, 0.35);
        RAPID.forEach((g, i) => arc(g, t, T.rapid + i * 0.1, 0.45, PRINT_OUT, mouth, 0.45, 1.3));
        if (t >= T.popT && t < T.tossT) { TNT.visible = true; TNT.position.copy(wp(mago.b("DEF-hand.R")).lerp(wp(mago.b("DEF-hand.L")), 0.5)).add(V3(0, 0.06, 0)); TNT.rotation.set(0, Math.sin(t * 30) * 0.15, 0); }
        else arc(TNT, t, T.tossT, 0.45, REL.tossT, mouth, 0.35);
        // sparkles at the printer pops and the TNT fuse; confetti at the boom
        SPK.forEach((m, i) => { const pops = [T.pop1, T.pop2, T.popT]; let best = -1, dt = 9; for (const p of pops) { const d = t - p - (i % 5) * 0.015; if (d > 0 && d < dt) { dt = d; best = p; } }
          m.visible = dt < 0.8; if (!m.visible) return; const v = V3((rnd(i) - 0.5) * 1.1, 0.8 + rnd(i + 50) * 1.0, (rnd(i + 99) - 0.3) * 0.8);
          const base = best === T.popT ? TNT.position.clone().add(V3(0, 0.16, 0)) : PRINT_OUT; m.position.copy(base).add(v.multiplyScalar(dt * 0.6)); m.position.y -= 1.2 * dt * dt; m.scale.setScalar(1 - dt / 0.8); });
        CONF.forEach((m, i) => { const d = t - T.boom - (i % 7) * 0.01; m.visible = d > 0 && d < 2.2; if (!m.visible) return;
          const v = V3((rnd(i) - 0.5) * 1.6, 1.4 + rnd(i + 3) * 1.4, (rnd(i + 9) - 0.5) * 1.2); m.position.copy(mouth).add(v.multiplyScalar(d)); m.position.y -= 2.2 * d * d * (1 - Math.min(d, 1) * 0.6);
          m.position.y = Math.max(m.position.y, 0.01); m.rotation.set(d * (3 + i % 5), d * (4 + i % 3), d * 2); });
        // sweat drops while he is hot; the moth flies out of the empty sack; the idea bulb; dust puffs
        SWEAT.forEach((m, i) => { const per = 0.9, ph = ((t - 0.3 + i * 0.3) % per + per) % per; m.visible = t > 0.3 && t < T.give && ph < 0.55;
          if (m.visible) { const p = headPt(santa, 0.08, 0.05, (i - 1) * 0.12); m.position.copy(p).add(V3(0, -ph * 0.35 - 1.2 * ph * ph, 0)); } });
        const md = t - 6.3; moth.visible = md > 0 && md < 1.3;
        if (moth.visible) { moth.position.copy(wp(santa.b("DEF-hand.R")).lerp(wp(santa.b("DEF-hand.L")), 0.5)).add(V3(0.1 * Math.sin(md * 9) + md * 0.25, 0.1 + md * 0.55, 0.05 * Math.cos(md * 7)));
          moth.rotation.set(0.3, md * 2, 0); moth.children.forEach((w) => { if (w.name) w.rotation.y = (w.name === "w1" ? 1 : -1) * Math.sin(md * 60) * 0.9; }); }
        const bd = t - T.idea; bulb.visible = bd > 0 && bd < 0.9;
        if (bulb.visible) { bulb.position.copy(headPt(mago, 0.52, 0.0, 0)); const s = 0.9 + 0.35 * Math.exp(-bd * 6) * Math.sin(bd * 25); bulb.scale.setScalar(s * Math.min(1, bd * 8) * (bd > 0.75 ? (0.9 - bd) / 0.15 : 1)); }
        PUFF.forEach((m, i) => { const ev = [[T.doorOpen, V3(0.85, 0.2, -1.0)], [T.sit + 0.62, V3(S.x, 0.06, S.z + 0.1)], [T.boom, mouth]][Math.floor(i / 6)];
          const d = t - ev[0] - (i % 6) * 0.02; m.visible = d > 0 && d < 0.6; if (!m.visible) return; const a = (i % 6) * 1.05;
          m.position.copy(ev[1]).add(V3(Math.cos(a) * d * 0.5, d * 0.25, Math.sin(a) * d * 0.4)); m.scale.setScalar(0.6 + d * 2.2); m.material.opacity = 0.7 * (1 - d / 0.6); });
        bulbs.forEach((b, k) => b.material.color.set(["#E86A4A", "#F2C14E", "#9CC9E8", "#3a2a4a"][(k + Math.floor(t * 3)) % 4]));
        for (let i = 0; i < NM; i++) { const ph = rnd(i) * 6.28, u = rnd(i + 7), w = rnd(i + 13);
          mpos[i * 3] = lerp(WIN.x - 0.35, 0.3, w) + 0.06 * Math.sin(t * 0.5 + ph) + (u - 0.5) * 0.4; mpos[i * 3 + 1] = lerp(WIN.y + 0.2, 0.1, w) + 0.05 * Math.sin(t * 0.7 + ph * 2);
          mpos[i * 3 + 2] = lerp(-1.0, 0.3, w) + 0.04 * Math.cos(t * 0.6 + ph); }
        motes.geometry.attributes.position.needsUpdate = true;
        blobM.position.set(mago.W.position.x, 0.003, mago.W.position.z); blobM.scale.setScalar(1 - Math.min(0.4, mago.W.position.y * 4));
        blobS.position.set(santa.W.position.x, 0.003, santa.W.position.z + (t > T.sit + 0.5 && t < T.sE0 ? 0.1 : 0)); blobS.visible = santa.W.visible;
        blobK.position.set(K.x, 0.003, K.z); blobK.visible = sack.position.y < 0.05 && sack.position.y > -1;
      }

      // ---------- camera: four shots, cut on action (research: wide entrance, two-shot, insert, wide hero) ----------
      const SHOTS = [
        { t: 0, d: 3.2, fov: 40, from: [0.25, 2.25, 5.3], to: [0.25, 1.95, 4.6], lookFrom: [0.05, 0.62, -0.55], lookTo: [0.15, 0.6, -0.5] },
        { t: 3.2, d: 4.8, fov: 30, from: [0.55, 1.4, 2.65], to: [0.45, 1.32, 2.35], lookFrom: [0.25, 0.58, -0.4], lookTo: [0.28, 0.55, -0.42] },
        { t: 8.0, d: 4.5, fov: 34, from: [-0.95, 1.6, 2.55], to: [-0.7, 1.5, 2.25], lookFrom: [0.05, 0.6, -0.6], lookTo: [0.1, 0.62, -0.55] },
        { t: 12.5, d: 4.5, fov: 36, from: [0.3, 1.85, 4.5], to: [0.2, 1.65, 3.95], lookFrom: [0.2, 0.62, -0.55], lookTo: [0.15, 0.6, -0.5] },

      function renderAt(t) { poseAt(t); springs(t); props(t); cameraAt(camera, SHOTS, t); renderer.render(scene, camera); }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__draw3d = renderAt; window.__T = T;
      renderAt(0);
      markReady();
    </script>
