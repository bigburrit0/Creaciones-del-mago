    <script type="module">
      /* "¿Vikingo o caballero?" (26.8 s, 3D toon; chess series reel 1 of ../../PLAN_AJEDREZ.md): El Mago plays the medieval
         knights (red), Papá Noel the vikings (bronze, "porque soy del norte"). The knights hop in an L, the vikings cheer too
         early, the queen mates, the viking king tips over, and Papá Noel hears "mate" and wants one. Research and rules:
         ../../RESEARCH_AJEDREZ_2026.md. Built on the shared kit (escena3d.js) and the chess kit (ajedrez3d.js). */
      import * as THREE from "three";
      import { toon, outline, shade, rotWorld, ss, seg, clamp, lerp, pulse, rnd, pushOut } from "./lib/toon3d.js";
      import { V3, stage, canvasTex, rbox, cyl, sph, workshop, cast, makeFX, unwrap, makeRig, voices, characterSprings, kineticOverlay, camRig, qaBase } from "./lib/escena3d.js";
      import { chessKit } from "./lib/ajedrez3d.js";

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let markReady; window.__hf.buildReady.scene = new Promise((r) => (markReady = r));
      const DUR = 26.8, FPS = 60, WO = 0.0024;
      const { renderer, scene, camera } = stage();
      const { DOOR, hinge, spill, WIN, motes, mpos, NM, bulbs, setLight } = workshop();
      spill.material.opacity = 0;
      const { mago, santa, BTRACK, blobM, blobS, blobK, PR, PRrest, nozzleMat } = await cast();
      blobK.visible = false;
      await document.fonts.load('700 48px "Caveat"'); await document.fonts.load('700 48px "Fredoka"');

      // ---------- timing (voice first: the measured lines set every beat) ----------
      const T = { m1: 0.1, s1: 2.35, m2: 6.38, hopM: 7.6, hopV: 8.45, face: 9.05, s2: 9.85, slide: 12.15, m3: 12.85, tip: 13.55, s3: 14.3, react: 17.5,
                  proof: 18.2, cta: 20.75, m4: 20.85, card: 24.05, exit: 99 };

      // ---------- the chess table (centre of the room) and the board ----------
      const TC = V3(0.55, 0, -0.32), TOP = 0.58;
      const tbl = new THREE.Group(); tbl.position.copy(TC); scene.add(tbl);
      rbox(0.6, 0.04, 0.56, "#8A5638", 0, TOP - 0.02, 0, tbl, { r: 0.15 }); rbox(0.54, 0.05, 0.5, "#6E3B22", 0, TOP - 0.065, 0, tbl, { line: false });
      for (const [x, z] of [[-0.26, -0.24], [0.26, -0.24], [-0.26, 0.24], [0.26, 0.24]]) rbox(0.04, TOP - 0.04, 0.04, "#6E3B22", x, (TOP - 0.04) / 2, z, tbl);
      const CK = chessKit(scene, { wo: WO });
      const B = CK.board(); B.g.position.set(TC.x, TOP, TC.z); B.g.rotation.y = -Math.PI / 2; B.g.updateMatrixWorld(true);   // rank 1 at El Mago's end (-x), files along z
      const BACK = ["rook", "knight", "bishop", "queen", "king", "bishop", "knight", "rook"], P = {};
      const COLM = CK.SIDES.red, COLV = CK.SIDES.bronze;
      for (const [side, set, col, r0, r1, face] of [["M", "medieval", COLM, 0, 1, Math.PI], ["V", "viking", COLV, 7, 6, 0]]) for (let f = 0; f < 8; f++) {
        for (const [type, r] of [[BACK[f], r0], ["pawn", r1]]) { const g = CK.piece(set, type, col); g.rotation.order = "YXZ"; g.position.copy(B.sq(f, r)); g.rotation.y = face + B.g.rotation.y;
          g.userData.home = g.position.clone(); g.userData.yaw = g.rotation.y; P[side + type[0].toUpperCase() + (type === "knight" ? "N" : "") + f + r] = g; } }
      const pc = (side, f, r) => Object.entries(P).find(([k, g]) => k.startsWith(side) && k.endsWith("" + f + r))[1];
      const kM = pc("M", 6, 0), kV = pc("V", 6, 7), qM = pc("M", 3, 0), kingV = pc("V", 4, 7), pawnF7 = pc("V", 5, 6), qV = pc("V", 3, 7);
      const ALLP = Object.values(P);
      const sq = (f, r) => B.sq(f, r);
      const { SPK, PUFF } = makeFX();

      // ---------- staging ----------
      const MD = V3(TC.x - 0.6, 0, TC.z), SD = V3(TC.x + 0.62, 0, TC.z), hM = Math.PI / 2, hS = -Math.PI / 2;
      const LENS_C = V3(1.08, 1.05, 1.04), LENS_S = V3(0.22, 1.05, 0.82), LENS_M = V3(0.79, 1.0, 0.68);      // where those shots put the lens (poses never read the camera)
      for (const [c, off] of [[santa, 0.2], [mago, 0.6]]) c.add("Idle_Loop", -0.3, DUR + 1, { off });
      const { frame, wp, IKQ, arm, handC, headPt, solveArms } = makeRig([mago, santa]);
      const { LINES, ENV, talk } = await voices(FPS);
      function poseAt(t) {
        IKQ.length = 0;
        santa.apply(t); santa.W.position.copy(SD); santa.W.rotation.y = hS; santa.W.updateMatrixWorld(true);
        mago.apply(t); mago.W.position.copy(MD); mago.W.rotation.y = hM; mago.W.updateMatrixWorld(true);
        const SF = frame(santa), MF = frame(mago);
        rotWorld(santa.b("DEF-upper_arm.L"), SF.fwd, 0.16); rotWorld(santa.b("DEF-upper_arm.R"), SF.fwd, -0.16);
        rotWorld(mago.b("DEF-upper_arm.L"), MF.fwd, 0.1); rotWorld(mago.b("DEF-upper_arm.R"), MF.fwd, -0.1);
        const turnTo = (c, P0, k) => { const dir = P0.clone().sub(c.W.position); const a = unwrap(Math.atan2(dir.x, dir.z), c.W.rotation.y) - c.W.rotation.y; rotWorld(c.b("DEF-head"), V3(0, 1, 0), clamp(a, -0.9, 0.9) * k); };
        const boardPt = TC.clone().setY(TOP + 0.05);
        // ---- heads: El Mago to the viewer for the hook and the CTA, at the board while playing, deadpan to the lens for "Jaque mate"
        turnTo(mago, LENS_C, Math.max(pulse(t, -1, 0, 1.6, 1.9), pulse(t, T.cta - 0.2, T.cta + 0.1, DUR, DUR + 1)));
        rotWorld(mago.b("DEF-head"), MF.left, 0.18 * pulse(t, T.hopM - 0.3, T.hopM, T.s2 + 1.6, T.s2 + 2.0));                 // looks down at the board
        turnTo(mago, LENS_M, 0.85 * pulse(t, T.m3 - 0.25, T.m3 - 0.05, T.react + 0.6, T.react + 0.8));
        rotWorld(mago.b("DEF-head"), MF.left, 0.14 * pulse(t, T.react, T.react + 0.3, T.react + 0.45, T.react + 0.65));          // the sigh
        // ---- Papá Noel: proud (chin up), looks at the board, celebrates, "¿Mate?" to the lens
        rotWorld(santa.b("DEF-head"), SF.left, -0.14 * pulse(t, T.s1, T.s1 + 0.3, T.s1 + 3.4, T.s1 + 3.8));
        rotWorld(santa.b("DEF-spine.003"), SF.left, -0.06 * pulse(t, T.s1, T.s1 + 0.3, T.s1 + 3.4, T.s1 + 3.8));
        rotWorld(santa.b("DEF-head"), SF.left, 0.16 * pulse(t, T.hopM - 0.2, T.hopM + 0.1, T.s2 - 0.1, T.s2 + 0.2));
        rotWorld(santa.b("DEF-head"), SF.left, -0.2 * pulse(t, T.s2, T.s2 + 0.2, T.s2 + 1.7, T.s2 + 2.0));
        rotWorld(santa.b("DEF-head"), SF.left, 0.2 * pulse(t, T.slide - 0.1, T.slide + 0.1, T.s3 - 0.3, T.s3));                // watches the mate, aghast
        turnTo(santa, LENS_S, pulse(t, T.s3 - 0.2, T.s3 + 0.05, T.react, T.react + 0.3));
        // ---- arms (IK)
        mago && arm(mago, "R", TC.clone().add(V3(-0.2, 0.26, 0.12)), pulse(t, 0.3, 0.75, 1.9, 2.3), null, 0.07);                    // hook: "vikingos contra caballeros", a hand over the board
        arm(mago, "R", wp(mago.b("DEF-spine.003")).add(MF.fwd.clone().multiplyScalar(0.36)).add(MF.right.clone().multiplyScalar(0.1)).add(V3(0, -0.04, 0)), pulse(t, T.m2 - 0.25, T.m2 + 0.1, T.m2 + 0.9, T.m2 + 1.3), null, 0.07);   // "yo soy caballero": hand to chest
        { const sh = wp(mago.b("DEF-upper_arm.R")), dir = LENS_C.clone().sub(sh).normalize();                                    // CTA: points at the viewer
          arm(mago, "R", sh.clone().add(dir.multiplyScalar(0.4)).add(V3(0, -0.04, 0)), pulse(t, T.m4 + 0.6, T.m4 + 0.95, T.card + 0.3, T.card + 0.8), null, 0.08); }
        arm(santa, "L", wp(santa.b("DEF-spine.003")).add(SF.fwd.clone().multiplyScalar(0.44)).add(SF.left.clone().multiplyScalar(0.1)).add(V3(0, -0.04, 0)), pulse(t, T.s1 + 0.1, T.s1 + 0.45, T.s1 + 3.2, T.s1 + 3.6), null, 0.07);   // "yo soy vikingo": hand to chest
        const cheer = pulse(t, T.s2 - 0.15, T.s2 + 0.25, T.s2 + 1.7, T.s2 + 2.1);
        for (const [side, f] of [["L", SF.left], ["R", SF.right]]) { const sh = wp(santa.b("DEF-upper_arm." + side));               // "¡Ganamos!": arms up
          arm(santa, side, sh.clone().add(f.clone().multiplyScalar(0.24)).add(V3(0, 0.28, 0)).add(SF.fwd.clone().multiplyScalar(0.08)), cheer, null, 0.08); }
        // ---- faces
        let e = 0; for (const b of [1.4, 4.6, 8.9, 11.6, 15.5, 22.4, 25.2]) { const u = (t - b) * FPS; if (u >= 0 && u < 12) e = Math.max(e, u < 4 ? u / 4 : u < 6 ? 1 : 1 - (u - 6) / 6); }
        const slowBlink = pulse(t, T.react + 0.05, T.react + 0.25, T.react + 0.45, T.react + 0.65);
        mago.b("eyes").scale.y = 1 - 0.9 * Math.max(e, slowBlink);
        mago.b("brows").position.y += 0.012 * pulse(t, 0.1, 0.3, 1.0, 1.3) - 0.008 * pulse(t, T.m3 - 0.2, T.m3, T.react, T.react + 0.3);
        santa.b("brows").position.y += 0.014 * Math.max(pulse(t, T.tip, T.tip + 0.1, T.s3 + 0.6, T.s3 + 0.9), pulse(t, T.s1, T.s1 + 0.2, T.s1 + 1.0, T.s1 + 1.3));
        santa.b("glasses").position.y -= 0.016 * pulse(t, T.s3 - 0.05, T.s3 + 0.1, T.s3 + 1.2, T.s3 + 1.5);
        talk(santa, "santa", t, SF); talk(mago, "mago", t, MF);
        solveArms([santa, mago]);
      }
      const { springs } = characterSprings(mago, santa, DUR, FPS, poseAt);

      // ---------- the pieces: the knights hop in an L, a stare-down, the vikings cheer, the queen mates, the king tips over ----------
      function pieces(t) {
        for (const g of ALLP) { g.position.copy(g.userData.home); g.rotation.set(0, g.userData.yaw, 0); g.scale.set(1, 1, 1); g.visible = true; }
        const arcTo = (g, A, Bp, t0, d, h) => { const u = clamp((t - t0) / d, 0, 1), e = ss(u); if (t < t0) return 0; g.position.copy(A).lerp(Bp, e); g.position.y += h * 4 * e * (1 - e);
          const land = t - (t0 + d); if (land > 0 && land < 0.18) { const k = Math.sin(land / 0.18 * Math.PI); g.scale.set(1 + 0.08 * k, 1 - 0.12 * k, 1 + 0.08 * k); } return u; };
        // the knights: g1 -> f3, g8 -> f6 (legal), with a lean into the jump; then a stare-down (lean toward each other)
        const uM = arcTo(kM, sq(6, 0), sq(5, 2), T.hopM, 0.55, 0.075); kM.rotation.x = -0.35 * Math.sin(Math.PI * uM) * (uM > 0 && uM < 1 ? 1 : 0);
        const uV = arcTo(kV, sq(6, 7), sq(5, 5), T.hopV, 0.55, 0.075); kV.rotation.x = -0.35 * Math.sin(Math.PI * uV) * (uV > 0 && uV < 1 ? 1 : 0);
        if (t > T.face) { const s = pulse(t, T.face, T.face + 0.2, T.face + 0.55, T.face + 0.75); kM.rotation.x += 0.22 * s; kV.rotation.x += 0.22 * s;
          kM.position.y += 0.004 * Math.sin((t - T.face) * 40) * s; kV.position.y += 0.004 * Math.sin((t - T.face) * 40 + 1) * s; }
        // the vikings cheer too early: pawns, queen and king hop in a wave
        for (let f = 0; f < 8; f++) { const g = pc("V", f, 6); if (g === pawnF7 && t > T.slide + 0.5) continue; const t0 = T.s2 + 0.1 + f * 0.07;
          g.position.y += 0.022 * (Math.max(0, Math.sin((t - t0) * 9)) * (t > t0 && t < t0 + 1.4 ? 1 : 0)); }
        for (const [g, d] of [[qV, 0.2], [kingV, 0.35]]) { const t0 = T.s2 + d; if (t > t0 && t < t0 + 1.4) g.position.y += 0.018 * Math.max(0, Math.sin((t - t0) * 8)); }
        // the medieval queen: d1 -> h5 -> f7 in one glide (bell at the end); the f7 pawn is knocked off the board
        if (t > T.slide) { const u = clamp((t - T.slide) / 0.6, 0, 1), A = sq(3, 0), M = sq(7, 4), Z = sq(5, 6);
          const p = u < 0.55 ? A.clone().lerp(M, ss(u / 0.55)) : M.clone().lerp(Z, ss((u - 0.55) / 0.45)); qM.position.copy(p); qM.rotation.z = 0.08 * Math.sin(u * Math.PI * 3) * (1 - u); }
        if (t > T.slide + 0.52) { const u = clamp((t - T.slide - 0.52) / 0.45, 0, 1), A = sq(5, 6), Z = B.g.localToWorld(V3((9.4 - 3.5) * B.S, B.T - 0.035, (3.5 - 6.4) * B.S)).setY(TOP + 0.012);
          pawnF7.position.copy(A).lerp(Z, ss(u)); pawnF7.position.y += 0.08 * 4 * u * (1 - u); pawnF7.rotation.z = -1.5 * ss(u); pawnF7.rotation.x = 0.6 * u; }
        // the viking king wobbles, then tips over backward (resigns)
        if (t > T.tip) { const w = clamp((t - T.tip) / 0.28, 0, 1), f = clamp((t - T.tip - 0.25) / 0.3, 0, 1), a = 1.5 * f * f;
          kingV.rotation.z = 0.12 * Math.sin((t - T.tip) * 30) * (1 - f) * (w < 1 ? 1 : 0.6); kingV.rotation.x = -a; kingV.position.y += 0.021 * Math.sin(a); }
      }

      // ---------- props, light and effects per frame ----------
      function props(t) {
        setLight("day");
        pieces(t);
        if (PR.head) PR.head.position.x = PRrest.head.x + 0.55; if (nozzleMat) nozzleMat.color.set("#2E2160");
        // sparkles: the knights' landing, the mate
        SPK.forEach((m, i) => { const evs = [[T.hopM + 0.55, sq(5, 2).add(V3(0, 0.01, 0))], [T.hopV + 0.55, sq(5, 5).add(V3(0, 0.01, 0))], [T.slide + 0.6, sq(5, 6).add(V3(0, 0.05, 0))]]; let best = null, dt = 9;
          for (const [t0, Q] of evs) { const d = t - t0 - (i % 5) * 0.012; if (d > 0 && d < dt) { dt = d; best = Q; } }
          m.visible = dt < 0.5; if (!m.visible) return; const v = V3((rnd(i) - 0.5) * 0.3, 0.2 + rnd(i + 50) * 0.3, (rnd(i + 99) - 0.5) * 0.3);
          m.position.copy(best).add(v.multiplyScalar(dt * 0.6)); m.position.y -= 0.4 * dt * dt; m.scale.setScalar(0.35 * (1 - dt / 0.5)); });
        // dust puffs where the king falls
        PUFF.forEach((m, i) => { const d = t - (T.tip + 0.55) - (i % 6) * 0.01; m.visible = i < 6 && d > 0 && d < 0.5; if (!m.visible) return; const a = i / 6 * Math.PI * 2;
          m.position.copy(sq(4, 7)).add(V3(Math.cos(a) * (0.02 + d * 0.08), 0.01 + d * 0.03, Math.sin(a) * (0.02 + d * 0.08))); m.scale.setScalar(0.18 + d * 0.4); m.material.opacity = 0.7 * (1 - d / 0.5); });
        bulbs.forEach((b, k2) => b.material.color.set(["#E86A4A", "#F2C14E", "#9CC9E8", "#3a2a4a"][(k2 + Math.floor(t * 3)) % 4]));
        for (let i = 0; i < NM; i++) { const ph = rnd(i) * 6.28, uu = rnd(i + 7), w = rnd(i + 13);
          mpos[i * 3] = lerp(WIN.x - 0.35, 0.3, w) + 0.06 * Math.sin(t * 0.5 + ph) + (uu - 0.5) * 0.4; mpos[i * 3 + 1] = lerp(WIN.y + 0.2, 0.1, w) + 0.05 * Math.sin(t * 0.7 + ph * 2);
          mpos[i * 3 + 2] = lerp(-1.0, 0.3, w) + 0.04 * Math.cos(t * 0.6 + ph); }
        motes.geometry.attributes.position.needsUpdate = true;
        blobM.position.set(mago.W.position.x, 0.003, mago.W.position.z); blobS.position.set(santa.W.position.x, 0.003, santa.W.position.z);
      }

      // ---------- camera and editing (cuts every 0.7-2.5 s; worm's-eye on the knights; a beat before the punchline) ----------
      const follow = (g, off, look, fov) => (t) => { const p = g.position.clone(); return { p: p.clone().add(V3(...off)), l: p.clone().add(V3(...look)), fov, roll: 0 }; };
      const mid = () => kM.position.clone().lerp(kV.position, 0.5);
      const SHOTS = [
        { t: 0.0, d: T.s1, fov: 54, from: [TC.x, 0.9, TC.z + 0.96], to: [TC.x, 0.87, TC.z + 0.86], look: [TC.x, 0.64, TC.z - 0.02] },                       // hook: the two armies
        { t: T.s1, d: T.m2 - T.s1, fov: 34, subj: "santa", h: 1.0, az: -55, el: 4, v: 0.14 },                                                                  // "Yo soy vikingo"
        { t: T.m2, d: T.hopM - 0.05 - T.m2, fov: 34, subj: "mago", h: 1.0, az: 55, el: 4, v: 0.14, whip: -1 },                                                 // "Yo soy caballero"
        { t: T.hopM - 0.05, d: 0.85, fn: follow(kM, [0.13, 0.12, 0.19], [0, 0.05, 0], 44), whip: 1 },                      // from the empty middle: El Mago looms behind his army                                                       // the medieval knight hops
        { t: T.hopV - 0.05, d: 0.6, fn: follow(kV, [-0.13, 0.12, 0.19], [0, 0.05, 0], 44), whip: -1 },                    // Papá Noel looms behind his                                                       // the viking knight hops
        { t: T.face, d: T.s2 - T.face, fn: (t) => { const m = mid(); return { p: m.clone().add(V3(0, 0.035, 0.42)), l: m.clone().add(V3(0, 0.05, 0)), fov: 56, roll: 0 }; } },   // nose to nose
        { t: T.s2, d: T.slide - T.s2, fov: 36, subj: "santa", h: 1.15, az: -42, el: -4, v: 0.22 },                                                              // "¡Jo, jo! ¡Ganamos!" (vikings cheering in front)
        { t: T.slide, d: T.m3 - 0.05 - T.slide, fov: 40, from: [TC.x + 0.02, 1.32, TC.z + 0.1], to: [TC.x + 0.02, 1.28, TC.z + 0.09], look: [TC.x, 0.6, TC.z] },   // top view: the queen's glide
        { t: T.m3 - 0.05, d: T.tip - T.m3 + 0.05, fov: 30, subj: "mago", h: 0.72, az: 40, el: -9, v: -0.02 },                                                      // deadpan: "Jaque mate."
        { t: T.tip, d: T.s3 - 0.05 - T.tip, fn: (t) => { const k = sq(4, 7); return { p: k.clone().add(V3(-0.15, 0.14, -0.1)), l: k.clone().add(V3(0.015, 0.03, 0)), fov: 40, roll: 0 }; } },   // the viking king tips over
        { t: T.s3 - 0.05, d: T.react - T.s3 + 0.05, fov: 32, subj: "santa", h: 0.85, az: -40, el: 2, v: 0.06 },                                               // "¿Mate? ¡Dale! ¡Cebame uno!"
        { t: T.react, d: T.proof - T.react, fov: 30, subj: "mago", h: 0.72, az: 40, el: -9, v: -0.02 },                                                              // the sigh
        { t: T.proof, d: T.cta - T.proof, fov: 30, subj: "mago", h: 0.72, az: 40, el: -9, v: -0.02 },                                                                // (under the proof panel)
        { t: T.cta, d: T.card - T.cta, fov: 36, subj: "mago", h: 1.15, az: 40, el: -3, v: 0.12, whip: 1 },                                                         // CTA
        { t: T.card, d: DUR - T.card, fov: 50, from: [TC.x, 1.06, TC.z + 0.9], to: [TC.x, 1.03, TC.z + 0.84], look: [TC.x, 0.62, TC.z - 0.02] },                 // the card over the armies (loop)
      ];
      const cam = camRig({ camera, shots: SHOTS, chars: { mago, santa }, poseAt, props, points: {},
        punch: [[T.hopM + 0.55, 0.06], [T.hopV + 0.55, 0.06], [T.face + 0.2, 0.1], [T.m3 + 0.05, 0.1], [T.tip + 0.55, 0.08], [T.s3 + 0.05, 0.12]],
        shake: [[T.tip + 0.55, 0.004, 0.25]], flash: [[T.proof, 0.12, "#FFFDF2"]],
        canvasEl: document.getElementById("c"), flashEl: document.getElementById("flash") });
      cam.measure();
      // ---------- text: kinetic captions, hook, proof, end card ----------
      const overlay = kineticOverlay({ LINES, ENV, FPS, T, subsEl: document.getElementById("subs"), cardEl: document.getElementById("card"), hookEl: document.getElementById("hook"), hook: [-0.2, 2.3] });
      const backOut = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
      const proof = document.getElementById("proof"), POLS = [...proof.querySelectorAll(".pol")], ROT = [-5, 4, -2];
      function dom(t) {
        const pv = t >= T.proof && t < T.cta; proof.style.visibility = pv ? "visible" : "hidden";
        if (pv) { proof.style.opacity = Math.min(1, (t - T.proof) / 0.08, (T.cta - t) / 0.1).toFixed(3);
          POLS.forEach((p, i) => { const a = clamp((t - T.proof - 0.15 - i * 0.3) / 0.26, 0, 1); p.style.opacity = a > 0 ? "1" : "0";
            p.style.transform = `translateY(${((1 - ss(a)) * -150).toFixed(1)}px) rotate(${(ROT[i] + (1 - a) * 14).toFixed(2)}deg) scale(${(1.25 - 0.25 * backOut(a)).toFixed(3)})`; }); }
      }
      let lastT = null;
      function renderAt(t) { if (t === lastT) return; lastT = t; poseAt(t); springs(t); props(t); cam.at(t); renderer.render(scene, camera); overlay(t); dom(t); }

      /* QA gate (skills/reel-3d-toon/references/qa.md): the shared checks plus the furniture (the chess table's top and legs, the bench) */
      const QB = qaBase({ chars: { mago, santa }, DOOR, hinge, BTRACK, rig: { handC, wp } });
      const FURN = [{ name: "tableTop", min: V3(TC.x - 0.3, TOP - 0.09, TC.z - 0.28), max: V3(TC.x + 0.3, TOP + 0.03, TC.z + 0.28) },
        ...[[-0.26, -0.24], [0.26, -0.24], [-0.26, 0.24], [0.26, 0.24]].map(([x, z], i) => ({ name: "leg" + i, min: V3(TC.x + x - 0.02, 0, TC.z + z - 0.02), max: V3(TC.x + x + 0.02, TOP, TC.z + z + 0.02) })),
        { name: "bench", min: V3(-1.255, 0, -1.075), max: V3(0.015, 0.6, -0.605) }];
      function qa(t) {
        lastT = null; poseAt(t); springs(t); props(t); scene.updateMatrixWorld(true); const out = [];
        for (const [c, nm] of [[mago, "mago"], [santa, "santa"]]) for (const k of c.colliders(true)) for (const p of k.b ? [k.a, k.b, k.a.clone().lerp(k.b, 0.5)] : [k.a]) for (const F of FURN) {
          const q = V3(clamp(p.x, F.min.x, F.max.x), clamp(p.y, F.min.y, F.max.y), clamp(p.z, F.min.z, F.max.z)), d = q.distanceTo(p);
          if (d < k.r - 0.01) out.push(["furniture", nm, k.name, F.name, +(k.r - d).toFixed(3)]); }
        // pieces: nothing of a body inside a piece (hands included)
        for (const g of [kM, kV, qM, kingV, pawnF7]) { const p = g.position.clone().add(V3(0, 0.03, 0));
          for (const [c, nm] of [[mago, "mago"], [santa, "santa"]]) for (const k of c.colliders(true)) { const d = k.b ? (() => { const ab = k.b.clone().sub(k.a), u = clamp(p.clone().sub(k.a).dot(ab) / ab.lengthSq(), 0, 1); return k.a.clone().add(ab.multiplyScalar(u)).distanceTo(p); })() : k.a.distanceTo(p);
            if (d < k.r + 0.02) out.push(["piece", nm, k.name, +(k.r + 0.02 - d).toFixed(3)]); } }
        const J = QB(out, []);
        return { t, out, J };
      }
      window.__qa = qa;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__draw3d = renderAt; window.__T = T; window.__JUMP_OK = [];
      window.__dbg = { mago, santa, P, B, scene, renderer, camera, THREE };
      renderAt(0);
      markReady();
    </script>
  </body>
