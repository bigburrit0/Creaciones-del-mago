:root{
  --night:#1F1A3D; --night-2:#2A2350; --night-3:#191433; --line:#3F3566; --violet:#4E4399; --violet-2:#7B6ED0;
  --lilac:#D6D0F7; --cream:#F3E9D2; --cream-2:#C9BC9C; --gold:#F2A93B; --gold-ink:#2A1638; --done:#7FD3A0;
  --f-pixel:"MagoPixel","Courier New",monospace;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s-1:.8125rem; --s0:1rem; --s1:1.1875rem; --s2:1.5rem; --s3:2.125rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--cream);font-family:var(--f-body);font-size:var(--s0);line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--night-3)}
.pix{image-rendering:pixelated}
code{font-family:var(--f-mono);font-size:.88em;background:var(--night-3);border:1px solid var(--line);padding:0 .3em;border-radius:3px;color:var(--lilac)}
strong{color:var(--cream)}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night-3);border-bottom:2px solid var(--line)}
.bar__in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;flex:none}
.brand img{width:30px;height:auto}
.brand b{font-family:var(--f-pixel);font-size:var(--s-1);letter-spacing:.04em;color:var(--gold);line-height:1.2}
.brand b span{display:block;color:var(--lilac);font-weight:400}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;gap:9px;align-items:center;background:var(--night-2);color:var(--cream);border:2px solid var(--line);border-radius:4px;padding:6px 12px 6px 8px;cursor:pointer;font:inherit;text-align:left;box-shadow:0 3px 0 var(--night)}
.tab:hover{border-color:var(--violet-2)}
.tab[aria-selected="true"]{border-color:var(--gold);background:var(--violet);box-shadow:0 3px 0 var(--gold-ink)}
.tab__ico{width:32px;height:32px;flex:none;display:grid;place-items:center;background:var(--night-3);border:1px solid var(--line);font-family:var(--f-pixel);font-size:10px;color:var(--gold);line-height:1}
.tab__ico img{width:32px;height:32px}
.tab__t{display:flex;flex-direction:column;line-height:1.2}
.tab__k{font-family:var(--f-pixel);font-size:var(--s-1);white-space:nowrap}
.tab__p{font-size:.75rem;color:var(--lilac);white-space:nowrap;font-variant-numeric:tabular-nums}
.tab__p.ok{color:var(--done)}
.keys{flex:none;font-size:.75rem;color:var(--cream-2)}
@media (max-width:760px){.keys,.brand b{display:none}}

/* Contenido */
main{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:start}
.eyebrow{font-family:var(--f-pixel);font-size:var(--s-1);color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
h1{font-family:var(--f-pixel);font-weight:700;font-size:var(--s3);line-height:1.15;margin:.2em 0 .35em;text-wrap:balance}
.hero p{margin:0 0 .6em;max-width:68ch;color:var(--lilac)}
.hero p strong{color:var(--cream)}

gos, no watermarks."}], "review": "que el Mago sea el mismo en las cuatro, que el tubo sea corto (del alto de un mate) y que en la imagen 4 se vea que el tablero salió del tubo. Nada de carteles ni nombres de lugares.", "video": "Create one 10-second vertical 9:16 video using the four attached images as keyframes, in this order: Image 1 is the first frame (0 s), Image 2 appears at about 3 s, Image 3 at about 6 s, and Image 4 is the final frame (10 s). Keep exactly the look, the wizard, the tube, colors and pixel art style of the images.\n\nStatic camera in both scenes, no zoom, no pan, no depth of field, no motion blur. Between Image 2 and Image 3 use one quick 16-bit style transition: a short pixel mosaic dissolve, like a 1990s role-playing game entering a location from the world map. Authentic 16-bit pixel art: hard square pixels, limited palette, low frame-rate sprite animation, flat 2D for the whole clip.\n\nAction:\n0 to 3 seconds (Image 1 to Image 2): the little wizard walks along the dotted path with a bouncy two-frame walk cycle, tube under his arm, past the lighthouse; the sea waves move in small loops.\n3 to 5 seconds (Image 2): he reaches the sparkling gold marker on the beach and it flashes.\n5 to 6 seconds: pixel mosaic transition into the side-view beach scene.\n6 to 9 seconds (Image 3 to Image 4): the wizard twists the end cap off, the tube segments unfold one by one into a flat checkered board on the towel, and the small pieces tumble out and hop into their squares.\n9 to 10 seconds (Image 4): the wizard strokes his beard; a gold sparkle above the board. The last second holds still.\n\nAudio: cheerful 16-bit world map music with a light walking rhythm, soft footsteps on sand, sea waves in chiptune noise, a magical chime on the gold marker, a whoosh for the transition, a plastic twist-and-pop when the cap opens, quick soft clicks as the segments unfold, a cascade of tiny wooden clacks as the pieces land, and one gull call. No dialogue, no voice, no music with lyrics.\n\nNo text, no letters, no numbers, no place names, no subtitles, no captions, no logos anywhere in the video.", "setup": "En Gemini, video <strong>9:16 de 10 segundos<\/strong>. Adjuntá las cuatro imágenes <strong>en orden<\/strong> (imagen 1, 2, 3 y 4) y pegá este prompt:", "fallbacks": ["Si acepta <strong>primer y último cuadro<\/strong>: usá la imagen 3 al inicio y la imagen 4 al final, y quedate con el tramo de 6 a 10 s del prompt (solo la playa). El mapa se puede hacer como otro clip con las imágenes 1 y 2.", "Si acepta <strong>una sola imagen<\/strong>: usá la imagen 3, con el tramo de la playa.", "Si el video sale de <strong>8 s<\/strong>: en la edición, congelá el último cuadro 2 s más."], "fbcode": [], "rows": [["0:00 – 0:03", "El Mago sale del pueblo con el tubo", "<code>¿QUÉ LLEVA EN EL TUBO?<\/code>", "«Se pliega en un tubo»"], ["0:03 – 0:06", "Pasa el faro, llega a la playa", "<code>24 CM<\/code> (al lado del tubo)", "«de veinticuatro centímetros con las piezas adentro.»"], ["0:06 – 0:09", "El tubo se abre en un tablero", "<code>Ajedrez de viaje · impreso en 3D<\/code>", "«Para la playa, el ómnibus o la mochila.»"], ["0:09 – 0:10", "El Mago piensa la jugada", "<code>WhatsApp 092 104 419<\/code>", "«Escribime.»"]], "voz": "«Se pliega en un tubo de veinticuatro centímetros con las piezas adentro. Para la playa, el ómnibus o la mochila. Escribime.»", "post": "El ajedrez de viaje se pliega en un tubo de 24 cm con las piezas adentro. Lo imprimo en 3D en Montevideo, en los colores que elijas, y lo mando a todo Uruguay; en La Unión, La Blanqueada y parte de Buceo te lo llevo sin costo. Las piezas son chicas, pensadas para viajar. Te paso precio y fecha por WhatsApp antes de empezar, sin compromiso. 092 104 419 · creacionesdelmago.com", "cierres": [{"name": "Vacaciones", "text": "Para llevar de vacaciones", "vo": "Para las vacaciones. Escribime y te paso el precio."}, {"name": "Envíos", "text": "Envíos a todo Uruguay", "vo": "Lo mando a todo Uruguay. Escribime."}, {"name": "Comentarios", "text": "¿Dónde jugarías tu próxima partida?", "vo": "¿Dónde jugarías vos? Comentalo."}], "edicion": ["El <code>24 CM<\/code> va como una regla pixel dorada al lado del tubo cuando aparece en la playa (de 0:06 a 0:07), no en el mapa: ahí el tubo es muy chico.", "Textos crema <code>#F3E9D2<\/code> con contorno índigo <code>#1F1A3D<\/code>, en caja de diálogo de juego de rol.", "Cierre: caja índigo con borde dorado arriba de la zona de botones, y el glifo real <code>assets/px/glifo-oro.png<\/code>.", "Ojo: las piezas de viaje son chicas. No digas que es para chicos que empiezan (la guía 10 recomienda piezas más grandes para ellos).", "Dejá libres los 250 px de arriba y los 420 px de abajo."]}, {"slug": "dibujo", "file": "fuente/campanas/reels-ajedrez/05-del-dibujo-a-la-reina.md", "name": "Del dibujo a la reina", "title": "Reel 5 · «Del dibujo a la reina» (editor de sprites de los 90)", "genre": "Editor de sprites", "summary": "En la pantalla de un programa de dibujo retro aparece el dibujo de un chico: su perro con corona. El lápiz lo limpia y lo vuelve un sprite de pieza de ajedrez, la impresora lo imprime capa por capa y al final la pieza es la dama blanca de un ajedrez, con el dibujo pegado atrás y el perro de verdad durmiendo al lado. Para el que quiere un ajedrez propio, desde una foto o un dibujo. 9:16, 10 s.", "extra": ["Sale del psicólogo (efecto IKEA y esfuerzo visible: el cliente pone su parte, que es el dibujo, y se ve el trabajo), del papá que busca regalo (la personalización como prueba de atención) y del vendedor de Etsy (la mascota que se vuelve pieza). La guía 06 del sitio dice qué se puede pedir."], "thumb": null, "tip": "<strong>Para que salgan parecidas entre sí:<\/strong> desde la imagen 2 en adelante, adjuntá la imagen 1 junto con el prompt. Si tenés un dibujo real de un chico (con permiso), adjuntalo en la imagen 1 para que el dibujo se parezca.", "images": [{"n": "1", "t": "0:00", "title": "El dibujo en la pantalla", "prompt": "Vertical 9:16 image (1080x1920). Straight-on, static, the whole frame is the screen of an early 1990s pixel paint program. A large cream drawing canvas in the middle. On the canvas, a child's naive drawing made with thick wobbly pixel lines: a fluffy white dog with floppy ears, a big smile and a lopsided gold crown, standing on four short legs, with a few scribbles around it. A vertical toolbar on the left side of the canvas with small pixel icons only: a pencil, a paint bucket, an eraser, a magnifying glass and a spray can. A vertical palette strip on the right side with square swatches of indigo, violet, cream, gold, pine green and red. A small pixel pencil cursor rests on the dog's crown. Indigo screen frame around everything. Playful and warm.\n\nStyle: authentic 16-bit home-console pixel art from the early 1990s. Hard square pixels on a visible grid, 1-pixel dark outlines, no anti-aliasing, no blur, no soft gradients (only ordered dithering), limited palette of about 24 colors: deep night indigo #1F1A3D and #2A2350, violet-blue #4E4399, warm cream #F3E9D2, gold #F2A93B as the main accent, small touches of pine green #2F6B4F and warm red #E2504C. Flat 2D game look, not a 3D render, not photorealistic. Keep the top 13% and the bottom 22% of the image calm and plain (the plain indigo screen frame at the top, the plain indigo screen frame at the bottom) for text. No text, no letters, no numbers, no logos, no watermarks."}, {"n": "2", "t": "0:03", "title": "El dibujo se vuelve pieza", "prompt": "Vertical 9:16 image (1080x1920). Same early 1990s pixel paint program screen, straight-on and static: cream canvas in the middle, the toolbar of small pixel icons on the left (pencil, bucket, eraser, magnifier, spray can), the vertical palette strip on the right, indigo frame. On the canvas, a faint pixel grid is now visible, and the child's dog drawing has been redrawn as a clean side-view chess piece sprite: the same fluffy white dog with floppy ears and a gold crown, now sitting upright on a round stepped chess base, like a queen piece. The original wobbly drawing is still visible as a small faint thumbnail in the upper corner of the canvas. The pencil cursor is finishing the base.\n\nStyle: authentic 16-bit home-console pixel art from the early 1990s. Hard square pixels on a visible grid, 1-pixel dark outlines, no anti-aliasing, no blur, no soft gradients (only ordered dithering), limited palette of about 24 colors: deep night indigo #1F1A3D and #2A2350, violet-blue #4E4399, warm cream #F3E9D2, gold #F2A93B as the main accent, small touches of pine green #2F6B4F and warm red #E2504C. Flat 2D game look, not a 3D render, not photorealistic. Keep the top 13% and the bottom 22% of the image calm and plain (the plain indigo screen frame at the top, the plain indigo screen frame at the bottom) for text. No text, no letters, no numbers, no logos, no watermarks."}, {"n": "3", "t": "0:06", "title": "La impresora la imprime", "prompt": "Vertical 9:16 image (1080x1920). Static, straight-on view of a desk in a small home workshop at night, warm lamp light. On the desk, a small open-frame desktop 3D printer of the bed-slinger type in cream and indigo, with no logos. On its moving bed, a cream chess piece is half printed: the round stepped base and the lower half of a sitting fluffy dog are done, with fine horizontal layer lines, and the hot nozzle glows gold over the dog's chest. Pinned on the wall above the printer, the child's naive paper drawing of the white dog with a lopsided gold crown. Next to the printer, an old computer monitor shows the pixel sprite of the dog queen piece.\n\nStyle: authentic 16-bit home-console pixel art from the early 1990s. Hard square pixels on a visible grid, 1-pixel dark outlines, no anti-aliasing, no blur, no soft gradients (only ordered dithering), limited palette of about 24 colors: deep night indigo #1F1A3D and #2A2350, violet-blue #4E4399, warm cream #F3E9D2, gold #F2A93B as the main accent, small touches of pine green #2F6B4F and warm red #E2504C. Flat 2D game look, not a 3D render, not photorealistic. Keep the top 13% and the bottom 22% of the image calm and plain (the plain workshop wall at the top, the plain front edge of the desk at the bottom) for text. No text, no letters, no numbers, no logos, no watermarks."}, {"n": "4", "t": "0:10", "title": "La reina en el tablero (último cuadro)", "prompt": "Vertical 9:16 image (1080x1920). Static, straight-on view, slightly from above, of a wooden table in a living room on a summer evening. On the table, a chessboard with cream and indigo squares and a simple chess set in cream and indigo set up to play. In the place of the white queen stands the finished 3D-printed piece: a fluffy dog with floppy ears sitting upright on a round stepped base, wearing a small crown painted gold, in cream color. Behind the board, the child's naive paper drawing of the dog with the lopsided crown is taped to a vase. On the rug next to the table, a real fluffy white dog sleeps curled up. A small gold sparkle above the dog queen piece.\n\nStyle: authentic 16-bit home-console pixel art from the early 1990s. Hard square pixels on a visible grid, 1-pixel dark outlines, no anti-aliasing, no blur, no soft gradients (only ordered dithering), limited palette of about 24 colors: deep night indigo #1F1A3D and #2A2350, violet-blue #4E4399, warm cream #F3E9D2, gold #F2A93B as the main accent, small touches of pine green #2F6B4F and warm red #E2504C. Flat 2D game look, not a 3D render, not photorealistic. Keep the top 13% and the bottom 22% of the image calm and plain (the plain living room wall at the top, the plain front edge of the table at the bottom) for text. No text, no letters, no numbers, no logos, no watermarks."}], "review": "que el perro sea el mismo en el dibujo, el sprite, la pieza y el perro de verdad (blanco, orejas caídas, corona), que la impresora y el monitor no tengan logos, y que no haya letras ni en la pantalla del programa.", "video": "Create one 10-second vertical 9:16 video using the four attached images as keyframes, in this order: Image 1 is the first frame (0 s), Image 2 appears at about 3 s, Image 3 at about 6 s, and Image 4 is the final frame (10 s). Keep exactly the look, the dog, colors and pixel art style of the images.\n\nStatic camera in every shot, no zoom, no pan, no depth of field, no motion blur. Use quick 16-bit style pixel mosaic dissolves between the paint program and the desk, and between the desk and the table. Authentic 16-bit pixel art: hard square pixels, limited palette, low frame-rate sprite animation, flat 2D for the whole clip.\n\nAction:\n0 to 3 seconds (Image 1 to Image 2): the pencil cursor taps the crown, the paint bucket fills the dog white, and the wobbly drawing redraws itself line by line into a clean sitting dog on a round chess base, with a faint grid appearing.\n3 to 5.5 seconds (Image 2): the eraser cleans the last scribbles; a small gold star blinks on the finished sprite.\n5.5 to 8 seconds (Image 3): pixel mosaic dissolve to the desk; the printer bed slides back and forth and the dog piece grows upward layer by layer under the glowing nozzle.\n8 to 10 seconds (Image 4): pixel mosaic dissolve to the table; the finished dog queen piece hops into the white queen's square; the real dog on the rug lifts one ear. The last second holds still.\n\nAudio: retro mouse clicks, a bucket fill \"bloop\", quick pencil scratch blips, a cute four-note chiptune melody, the soft rhythmic whirr of a 3D printer with tiny stepper motor beeps, a magic chime when the piece lands on the board, and one small happy dog sigh. No dialogue, no voice, no music with lyrics.\n\nNo text, no letters, no numbers, no menu words, no subtitles, no captions, no logos anywhere in the video.", "setup": "En Gemini, video <strong>9:16 de 10 segundos<\/strong>. Adjuntá las cuatro imágenes <strong>en orden<\/strong> (imagen 1, 2, 3 y 4) y pegá este prompt:", "fallbacks": ["Si acepta <strong>primer y último cuadro<\/strong>: usá la imagen 1 y la imagen 4, con el mismo prompt.", "Si acepta <strong>una sola imagen<\/strong>: usá la imagen 1, con el mismo prompt.", "Si el video sale de <strong>8 s<\/strong>: en la edición, congelá el último cuadro 2 s más."], "fbcode": [], "rows": [["0:00 – 0:03", "El dibujo del perro en la pantalla", "<code>ESTE DIBUJO…<\/code>", "«Mandame una foto o un dibujo de tu perro»"], ["0:03 – 0:05", "Se vuelve sprite de pieza", "<code>…ES UNA DAMA<\/code>", "«y lo vuelvo la dama de tu ajedrez.»"], ["0:05 – 0:08", "La impresora la imprime", "<code>Desde una foto o un dibujo<\/code>", "«Lo imprimo en 3D.»"], ["0:08 – 0:10", "La dama en el tablero, el perro duerme", "<code>Ajedrez personalizado · WhatsApp 092 104 419<\/code>", "«Si no se puede imprimir, te aviso antes.»"]], "voz": "«Mandame una foto o un dibujo de tu perro y lo vuelvo la dama de tu ajedrez. Lo imprimo en 3D. Si no se puede imprimir, te aviso antes.»", "post": "Una pieza puede salir de una foto o de un dibujo: tu perro, tu gato, lo que dibujó tu hijo. La diseño y la imprimo en 3D en Montevideo, en el color que quieras. Se puede hacer una sola pieza para un ajedrez que ya tenés, o el juego entero. Si algo no se puede imprimir, te aviso antes de empezar. Te paso precio y fecha por WhatsApp, sin compromiso. 092 104 419 · creacionesdelmago.com", "cierres": [{"name": "Navidad", "text": "Para Navidad · decímelo y te digo si llego", "vo": "Si es para Navidad, decímelo y te digo si llego."}, {"name": "Gato", "text": "¿Gato? También", "vo": "¿Tenés gato? También sirve. Mandame la foto."}, {"name": "Comentarios", "text": "¿Qué mascota sería tu rey?", "vo": "¿Qué mascota sería tu rey? Comentalo."}], "edicion": ["<code>ESTE DIBUJO…<\/code> y <code>…ES UNA DAMA<\/code> en letra pixel grande, crema con contorno índigo, como si se escribieran con el lápiz del programa.", "Cierre: caja índigo con borde dorado arriba de la zona de botones, y el glifo real <code> s: deep night indigo #1F1A3D and #2A2350, violet-blue #4E4399, warm cream #F3E9D2, gold #F2A93B as the main accent, small touches of pine green #2F6B4F and warm red #E2504C. Flat 2D game look, not a 3D render, not photorealistic. Keep the top 13% and the bottom 22% of the image calm and plain (the plain indigo top of the cabinet at the top, the plain indigo lower panel of the cabinet at the bottom) for text. No text, no letters, no numbers, no logos, no watermarks."}, {"n": "4", "t": "0:10", "title": "El ajedrez en el estante (último cuadro)", "prompt": "Vertical 9:16 image (1080x1920). Static, straight-on view of a light wooden shelf in a calm living room on a summer evening, warm light. On the shelf, a small chessboard with cream and indigo squares and a complete 3D-printed sculptural chess set: tall elegant pieces whose bodies twist like ribbons in spirals, one side in cream and the other in deep indigo, set up to play. The cream king, the tallest, stands at the front. Next to the board, a ceramic coffee cup about the same height as the king, for scale. A small plant and two books with plain spines without titles. A tiny gold sparkle above the cream king. If a reference photo is attached, match the pieces to it.\n\nStyle: authentic 16-bit home-console pixel art from the early 1990s. Hard square pixels on a visible grid, 1-pixel dark outlines, no anti-aliasing, no blur, no soft gradients (only ordered dithering), limited palette of about 24 colors: deep night indigo #1F1A3D and #2A2350, violet-blue #4E4399, warm cream #F3E9D2, gold #F2A93B as the main accent, small touches of pine green #2F6B4F and warm red #E2504C. Flat 2D game look, not a 3D render, not photorealistic. Keep the top 13% and the bottom 22% of the image calm and plain (the plain living room wall at the top, the plain front edge of the shelf at the bottom) for text. No text, no letters, no numbers, no logos, no watermarks."}], "review": "que el rey sea el mismo en las cuatro (retorcido como una cinta, corona abierta), que la máquina no tenga marca ni carteles, que los libros no tengan títulos y que no haya números de precio.", "video": "Create one 10-second vertical 9:16 video using the four attached images as keyframes, in this order: Image 1 is the first frame (0 s), Image 2 appears at about 3 s, Image 3 at about 6 s, and Image 4 is the final frame (10 s). Keep exactly the look, the sculptural king, colors and pixel art style of the images.\n\nStatic camera in both scenes, no zoom, no pan, no depth of field, no motion blur. The change from Image 3 to Image 4 is one quick pixel mosaic dissolve, like a 1990s game changing rooms. Authentic 16-bit pixel art: hard square pixels, limited palette, low frame-rate sprite animation, flat 2D for the whole clip.\n\nAction:\n0 to 3 seconds (Image 1 to Image 2): the gold lights on the cabinet chase from left to right; the claw moves along the rail in small jerky steps, stops above the king, drops down and closes around it.\n3 to 6 seconds (Image 2 to Image 3): the claw rises with the king and moves toward the exit chute, wobbling; right before the chute it opens a little and the king slips, tilting in mid-air.\n6 to 7 seconds: the king falls back softly onto the pile of capsules; mosaic dissolve.\n7 to 10 seconds (Image 4): the complete sculptural chess set on the home shelf, next to the coffee cup; a tiny gold sparkle above the cream king. The last second holds still.\n\nAudio: a bouncy arcade claw machine chiptune loop, mechanical whirring and clunks as the claw moves, a \"clamp\" sound, hopeful rising notes, then a sad descending \"wah-wah\" chiptune when the king slips, a soft plastic bump, then calm warm chiptune chords for the shelf scene and one gentle magnetic click. No dialogue, no voice, no music with lyrics.\n\nNo text, no letters, no numbers, no prices, no subtitles, no captions, no logos anywhere in the video.", "setup": "En Gemini, video <strong>9:16 de 10 segundos<\/strong>. Adjuntá las cuatro imágenes <strong>en orden<\/strong> (imagen 1, 2, 3 y 4) y pegá este prompt:", "fallbacks": ["Si acepta <strong>primer y último cuadro<\/strong>: usá la imagen 1 al inicio y la imagen 3 al final (la garra lo suelta), y cerrá en la edición con la imagen 4 como cuadro fijo los últimos 3 s.", "Si acepta <strong>una sola imagen<\/strong>: usá la imagen 1, con el mismo prompt.", "Si el video sale de <strong>8 s<\/strong>: en la edición, congelá el último cuadro 2 s más."], "fbcode": [], "rows": [["0:00 – 0:03", "La garra baja y agarra al rey", "<code>ÚLTIMA FICHA<\/code>", "«Este no lo sacás con la garra.»"], ["0:03 – 0:06", "Lo sube… y se resbala", "<code>…CASI<\/code>", "(silencio: que se escuche el «wah-wah»)"], ["0:06 – 0:08", "El ajedrez en el estante", "<code>Ajedrez escultórico · rey de 8 cm<\/code>", "«Ajedrez escultórico, rey de ocho centímetros, con lugar para imanes.»"], ["0:08 – 0:10", "Destello sobre el rey", "<code>Impreso en 3D · WhatsApp 092 104 419<\/code>", "«Escribime y te paso el precio.»"]], "voz": "«Este no lo sacás con la garra. Ajedrez escultórico, rey de ocho centímetros, con lugar para imanes. Escribime y te paso el precio.»", "post": "Este no sale de la máquina de la garra. Es el ajedrez escultórico: piezas retorcidas como una cinta, con un rey de 8 cm y lugar para imanes. Lo imprimo en 3D en Montevideo, en los dos colores que elijas. Queda bien armado en un estante, aunque en tu casa nadie juegue. Las fotos del catálogo son del diseñador. Te paso precio y fecha por WhatsApp antes de empezar, sin compromiso. 092 104 419 · creacionesdelmago.com", "cierres": [{"name": "Navidad", "text": "Para Navidad · decímelo y te digo si llego", "vo": "Si es para Navidad, decímelo y te digo si llego."}, {"name": "Deco", "text": "Para alguien que no juega pero le gusta lo lindo", "vo": "Para el que no juega, pero tiene un estante vacío."}, {"name": "Comentarios", "text": "¿Cuántas fichas gastaste en una garra?", "vo": "¿Cuántas fichas perdiste vos en una de estas? Comentalo const KEY = "estudio-reels-ajedrez-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const st = s => (state[s] ||= { img: [false,false,false,false], video: false });
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const copyTexts = [];
function copyBtn(text, label = "Copiar") {
  const i = copyTexts.push(text) - 1;
  return `<button class="btn copy" type="button" data-copy="${i}">${label}</button>`;
}

function progress(s) {
  const p = st(s); const n = p.img.filter(Boolean).length;
  return p.video ? "Video listo" : `${n}/4 imágenes`;
}

function renderTabs(active) {
  document.getElementById("tabs").innerHTML = DATA.map((c, i) => {
    const ok = st(c.slug).video;
    const ico = c.thumb ? `<img class="pix" src="${c.thumb}" alt="">` : "♞";
    return `<button class="tab" role="tab" id="tab-${c.slug}" aria-selected="${c.slug === active}" data-go="${c.slug}">
      <span class="tab__ico">${ico}</span>
      <span class="tab__t"><span class="tab__k">${i + 1}. ${esc(c.name)}</span><span class="tab__p ${ok ? "ok" : ""}">${progress(c.slug)}</span></span>
    </button>`;
  }).join("");
  document.querySelector('.tab[aria-selected="true"]')?.scrollIntoView({ inline: "center", block: "nearest" });
}

function render(slug) {
  const c = DATA.find(x => x.slug === slug) || DATA[0];
  const p = st(c.slug);
  copyTexts.length = 0;
  renderTabs(c.slug);
  const idx = DATA.indexOf(c);

  const imgs = c.images.map((im, k) => `
    <article class="card ${p.img[k] ? "is-done" : ""}" id="img-${k}">
      <div class="card__h">
        <span class="num">${im.n}</span>
        <div class="card__t"><b>${im.title}</b><span>${esc(im.t)} · guardala como imagen-${im.n}.png</span></div>
      </div>
      <pre class="prompt">${esc(im.prompt)}</pre>
      <div class="card__f">
        ${copyBtn(im.prompt, "Copiar prompt")}
        <button class="btn ghost" type="button" data-toggle="${k}">Ver entero</button>
        <label class="check"><input type="checkbox" id="chk-${c.slug}-${k}" data-img="${k}" ${p.img[k] ? "checked" : ""}> Ya la generé</label>
      </div>
    </article>`).join("");

  const chips = [1,2,3,4].map(n => `<span class="chip ${p.img[n-1] ? "on" : ""}">imagen-${n}</span>`).join('<span class="arrow">→</span>');

  const rows = c.rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join("")}</tr>`).join("");
  const alts = c.cierres.map(a => `
    <div class="alt"><b>${esc(a.name)}</b>
      <p>En pantalla: <code>${esc(a.text)}</code></p>
      <p>Voz: «${esc(a.vo)}»</p>
      <div class="row">${copyBtn(a.text, "Copiar texto")}${copyBtn(a.vo, "Copiar voz")}</div>
    </div>`).join("");

  document.getElementById("main").innerHTML = `
    <section class="hero" aria-labelledby="h1">
      <div>
        <div class="eyebrow">Reel ${idx + 1} de ${DATA.length} · ${esc(c.genre)}</div>
        <h1 id="h1">«${esc(c.name)}»</h1>

      <dl class="specs">
        <dt>Formato</dt><dd>9:16 · 1080×1920</dd>
        <dt>Duración</dt><dd>10 s</dd>
        <dt>Imágenes</dt><dd>4 + video</dd>
        <dt>Progreso</dt><dd>${progress(c.slug)}</dd>

    <section class="step" aria-labelledby="s3">

      <div class="two">
        <div class="panel"><h3>Voz en off</h3>
          <p class="quote">«${esc(c.voz)}»</p>
          <div class="row">${copyBtn(c.voz, "Copiar voz")}<span class="meta">${c.voz.split(/\s+/).length} palabras. Grabala vos con el celular.</span></div>
        </div>
        <div class="panel"><h3>Texto del post</h3>
          <p class="quote small">${esc(c.post)}</p>
          <div class="row">${copyBtn(c.post, "Copiar texto del post")}</div>
        </div>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Tiempo</th><th>Qué pasa</th><th>Texto en pantalla</th><th>Voz en off</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <h3>Otros cierres para probar</h3>
      <div class="alts">${alts}</div>
      <div class="panel"><h3>Notas de edición</h3><ul class="plain">${c.edicion.map(e => `<li>${e}</li>`).join("")}</ul></div>
    </section>

    <p class="foot">Fuente: <code>${esc(c.file)}</code> en el repo. Las marcas de «Ya la generé» se guardan solo en este navegador.</p>`;
}

function current() { const h = location.hash.slice(1); return DATA.some(c => c.slug === h) ? h : DATA[0].slug; }
function go(slug) { if (location.hash.slice(1) !== slug) location.hash = slug; else render(slug); }

let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1400); }

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-go]");
  if (tab) { go(tab.dataset.go); window.scrollTo({ top: 0 }); return; }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const card = tg.closest(".card"); card.classList.toggle("open"); tg.textContent = card.classList.contains("open") ? "Ver menos" : "Ver entero"; return; }
  const b = e.target.closest("[data-copy]");
  if (b) {
    const text = copyTexts[+b.dataset.copy];
    const label = b.textContent;
    try {
      await navigator.clipboard.writeText(text);
      b.classList.add("copied"); b.textContent = "Copiado"; toast("Copiado");
      setTimeout(() => { b.classList.remove("copied"); b.textContent = label; }, 1400);
    } catch (err) {
      const pre = b.closest(".card, .video, .fbcode, .panel, .alt")?.querySelector("pre, .quote");
      if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast("Seleccioné el texto: copialo con Ctrl+C");
    }
  }
});
document.addEventListener("change", e => {
  const slug = current(); const p = st(slug);
  if (e.target.dataset.img !== undefined) p.img[+e.target.dataset.img] = e.target.checked;
  else if (e.target.dataset.video) p.video = e.target.checked;
  else return;
  save(); const y = scrollY; render(slug); scrollTo(0, y);
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = e.key === "0" ? 10 : +e.key; if (n >= 1 && n <= DATA.length) { go(DATA[n - 1].slug); window.scrollTo({ top: 0 }); }
});
addEventListener("hashchange", () => render(current()));
render(current());
</script>
