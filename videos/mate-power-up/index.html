<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000;
        --gold: #f2b640;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
      img { image-rendering: pixelated; display: block; }
      #stage, .layer, .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .sea { position: absolute; left: 0; top: 676px; width: 1080px; height: 246px; opacity: 0; }
      .sea.f0 { opacity: 1; }
      #grp-gray, #grp-fixed, #k4, #broken, #nohandle { opacity: 0; }
      #dim { position: absolute; inset: 0; background: #000; opacity: 0; }
      #grp-fixed { clip-path: circle(0px at 608px 1101px); }
      .px { position: absolute; width: 10px; height: 10px; opacity: 0; }
      .spark { background: #fff3c4; box-shadow: 0 0 0 2px #f2b640; }
      .star { width: 6px; height: 6px; background: #fffbe8;
        box-shadow: 6px 0 #fffbe8, -6px 0 #fffbe8, 0 6px #fffbe8, 0 -6px #fffbe8,
                    12px 0 #f2b640, -12px 0 #f2b640, 0 12px #f2b640, 0 -12px #f2b640; }
      .glint { width: 12px; height: 6px; background: #fff6d0; }
      #gold-glow { position: absolute; left: 308px; top: 801px; width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 210, 110, 0.55) 0%, rgba(255, 190, 80, 0.25) 35%, rgba(255, 180, 60, 0) 70%);
        opacity: 0; }
      #steam-clip { clip-path: inset(100% 0 0 0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics" data-layout-allow-overflow data-layout-allow-overlap>
        <!-- colour scene: intact (k1) then broken -->
        <div id="grp-color" class="layer">
          <img id="k1" class="full" src="assets/k1.jpg" alt="" />
          <img id="nohandle" class="full" src="assets/nohandle.jpg" alt="" />
          <img id="broken" class="full" src="assets/broken.jpg" alt="" />
          <img id="wc0" class="sea f0" src="assets/wc0.png" alt="" />
          <img id="wc1" class="sea" src="assets/wc1.png" alt="" />
          <img id="wc2" class="sea" src="assets/wc2.png" alt="" />
          <img id="wc3" class="sea" src="assets/wc3.png" alt="" />
        </div>
        <!-- falling handle pieces -->
        <img id="piece-top" class="full" src="assets/handle_top.png" alt="" />
        <img id="piece-bot" class="full" src="assets/handle_bot.png" alt="" />
        <!-- greyscale "game over" -->
        <div id="grp-gray" class="layer">
          <img id="k2" class="full" src="assets/k2.jpg" alt="" />
          <img id="wg0" class="sea f0" src="assets/wg0.png" alt="" />
          <img id="wg1" class="sea" src="assets/wg1.png" alt="" />
          <img id="wg2" class="sea" src="assets/wg2.png" alt="" />
          <img id="wg3" class="sea" src="assets/wg3.png" alt="" />
          <div id="dim"></div>
        </div>
        <!-- colour floods back from the gold handle -->
        <div id="grp-fixed" class="layer">
          <img id="fixed" class="full" src="assets/fixed.jpg" alt="" />
          <img id="wf0" class="sea f0" src="assets/wf0.png" alt="" />
          <img id="wf1" class="sea" src="assets/wf1.png" alt="" />
          <img id="wf2" class="sea" src="assets/wf2.png" alt="" />
          <img id="wf3" class="sea" src="assets/wf3.png" alt="" />
        </div>
        <!-- wave glints -->
        <div id="glints" class="layer">
          <div id="g1" class="px glint" style="left:552px;top:700px"></div>
          <div id="g2" class="px glint" style="left:640px;top:724px"></div>
          <div id="g3" class="px glint" style="left:712px;top:712px"></div>
          <div id="g4" class="px glint" style="left:600px;top:752px"></div>
          <div id="g5" class="px glint" style="left:768px;top:742px"></div>
          <div id="g6" class="px glint" style="left:690px;top:778px"></div>
          <div id="g7" class="px glint" style="left:830px;top:790px"></div>
          <div id="g8" class="px glint" style="left:520px;top:796px"></div>
        </div>
        <!-- steam + seagulls -->
        <div id="steam-clip" class="layer"><img id="steam" class="full" src="assets/steam.png" alt="" /></div>
        <img id="gull1" class="full" src="assets/gull1.png" alt="" />
        <img id="gull2" class="full" src="assets/gull2.png" alt="" />
        <!-- gold power-up handle -->
        <div id="gold-move" class="layer">
          <div id="gold-glow"></div>
          <img id="gold" class="full" src="assets/gold.png" alt="" />
          <div id="st1" class="px star" style="left:520px;top:960px"></div>
          <div id="st2" class="px star" style="left:700px;top:1010px"></div>
          <div id="st3" class="px star" style="left:560px;top:1250px"></div>
          <div id="st4" class="px star" style="left:690px;top:1200px"></div>
          <div id="st5" class="px star" style="left:600px;top:900px"></div>
        </div>
        <!-- pixel sparks (snap-off and snap-on) -->
        <div id="sparks" class="layer">
          <div id="sa1" class="px spark" style="left:628px;top:962px"></div>
          <div id="sa2" class="px spark" style="left:628px;top:962px"></div>
          <div id="sa3" class="px spark" style="left:628px;top:962px"></div>
          <div id="sa4" class="px spark" style="left:628px;top:962px"></div>
          <div id="sa5" class="px spark" style="left:628px;top:962px"></div>
          <div id="sa6" class="px spark" style="left:628px;top:962px"></div>
          <div id="sa7" class="px spark" style="left:628px;top:1240px"></div>
          <div id="sa8" class="px spark" style="left:628px;top:1240px"></div>
          <div id="sa9" class="px spark" style="left:628px;top:1240px"></div>
          <div id="sa10" class="px spark" style="left:628px;top:1240px"></div>
          <div id="sa11" class="px spark" style="left:628px;top:1240px"></div>
          <div id="sa12" class="px spark" style="left:628px;top:1240px"></div>
          <div id="sb1" class="px spark" style="left:640px;top:962px"></div>
          <div id="sb2" class="px spark" style="left:640px;top:962px"></div>
          <div id="sb3" class="px spark" style="left:640px;top:962px"></div>
          <div id="sb4" class="px spark" style="left:640px;top:962px"></div>
          <div id="sb5" class="px spark" style="left:640px;top:1240px"></div>
          <div id="sb6" class="px spark" style="left:640px;top:1240px"></div>
          <div id="sb7" class="px spark" style="left:640px;top:1240px"></div>
          <div id="sb8" class="px spark" style="left:640px;top:1240px"></div>
        </div>
        <!-- the final keyframe, held for the last second -->
        <img id="k4" class="full" src="assets/k4.jpg" alt="" />
      </div>

      <audio id="sfx-waves" class="clip" src="assets/waves.wav" data-start="0" data-duration="10" data-track-index="1" data-volume="0.5"></audio>
      <audio id="sfx-hit" class="clip" src="assets/hit.wav" data-start="0.5" data-duration="1.2" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx-countdown" class="clip" src="assets/countdown.wav" data-start="2.4" data-duration="2.6" data-track-index="3" data-volume="0.9"></audio>
      <audio id="sfx-powerup" class="clip" src="assets/powerup.wav" data-start="5" data-duration="1.75" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-victory" class="clip" src="assets/victory.wav" data-start="7.05" data-duration="1.4" data-track-index="5" data-volume="0.8"></audio>
      <audio id="sfx-gulls" class="clip" src="assets/gulls.wav" data-start="7.6" data-duration="2.4" data-track-index="6" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HX = 608, HY = 1101; // handle centre (px)

      // ---- waves: cycle 4 frames, stepped like sprite animation
      function cycle(prefix, from, to, fps) {
        let k = 0;
        for (let t = from; t < to - 1e-6; t += 1 / fps) {
          const cur = k % 4, nxt = (k + 1) % 4;
          tl.set("#" + prefix + cur, { opacity: 0 }, t + 1 / fps);
          tl.set("#" + prefix + nxt, { opacity: 1 }, t + 1 / fps);
          k++;
        }
      }
      cycle("wc", 0, 2.4, 6);   // normal sea
      cycle("wg", 2.4, 6.4, 1.2); // almost frozen
      cycle("wf", 6.4, 9.0, 6); // waves alive again

      // ---- 0.5 s: handle snaps off
      tl.fromTo("#stage", { x: 0, y: 0 }, {
        keyframes: [{ x: 16, y: -10 }, { x: -14, y: 8 }, { x: 10, y: -6 }, { x: -6, y: 4 }, { x: 3, y: -2 }, { x: 0, y: 0 }],
        duration: 0.34, ease: "none" }, 0.5);
      tl.set("#k1", { opacity: 0 }, 0.5);
      tl.set("#nohandle", { opacity: 1 }, 0.5);
      tl.set("#nohandle", { opacity: 0 }, 1.12);
      tl.set("#broken", { opacity: 1 }, 1.12);

      tl.set(["#piece-top", "#piece-bot"], { opacity: 0 }, 0);
      tl.set(["#piece-top", "#piece-bot"], { opacity: 1 }, 0.5);
      tl.fromTo("#piece-top", { x: 0, y: 0, rotation: 0, transformOrigin: "594px 1027px" },
        { keyframes: [{ x: 6, y: -24, rotation: 12, duration: 0.12, ease: "steps(2)" },
                      { x: 14, y: 400, rotation: -50, duration: 0.5, ease: "steps(6)" }] }, 0.5);
      tl.fromTo("#piece-bot", { x: 0, y: 0, rotation: 0, transformOrigin: "607px 1178px" },
        { keyframes: [{ x: 10, y: -10, rotation: -8, duration: 0.12, ease: "steps(2)" },
                      { x: -150, y: 262, rotation: -84, duration: 0.5, ease: "steps(6)" }] }, 0.5);
      tl.set(["#piece-top", "#piece-bot"], { opacity: 0 }, 1.12);

      // sparks: deterministic directions
      const dirs = [[-60,-50],[70,-70],[90,10],[-80,20],[20,-90],[50,60],[-70,40],[80,50],[-30,90],[90,-20],[-90,-30],[30,80]];
      for (let i = 1; i <= 12; i++) {
        const [dx, dy] = dirs[i - 1];
        tl.set("#sa" + i, { opacity: 1, x: 0, y: 0 }, 0.5);
        tl.to("#sa" + i, { x: dx * 1.4, y: dy * 1.4 + 30, duration: 0.36, ease: "steps(4)" }, 0.5);
        tl.set("#sa" + i, { opacity: 0 }, 0.86);
      }

      // ---- 2-3 s: palette fade to grey, scene dims ("game over")
      tl.fromTo("#grp-gray", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "steps(5)" }, 2.0);
      tl.fromTo("#dim", { opacity: 0 }, { opacity: 0.22, duration: 1.0, ease: "steps(4)" }, 2.2);

      // ---- 5 s: gold power-up handle drops in, spinning
      tl.set("#gold-move", { opacity: 0 }, 0);
      tl.set("#gold-move", { opacity: 1 }, 5.0);
      tl.fromTo("#gold-move", { x: -100, y: -1300 }, {
        keyframes: [{ x: -100, y: -494, duration: 1.0, ease: "steps(10)" },
                    { x: -60, y: -420, duration: 0.15, ease: "steps(2)" },
                    { x: 0, y: 0, duration: 0.3, ease: "steps(4)" }] }, 5.0);
      tl.fromTo("#gold", { rotation: 30, scaleX: 1, transformOrigin: HX + "px " + HY + "px" }, {
        keyframes: [{ scaleX: 0.25, rotation: 24 }, { scaleX: -1, rotation: 18 }, { scaleX: 0.25, rotation: 12 },
                    { scaleX: 1, rotation: 6 }, { scaleX: 0.25, rotation: 3 }, { scaleX: -1, rotation: 0 },
                    { scaleX: 0.25, rotation: 0 }, { scaleX: 1, rotation: 0 }],
        duration: 1.4, ease: "none" }, 5.0);
      tl.fromTo("#gold-glow", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "steps(4)" }, 5.0);
      tl.to("#gold-glow", { opacity: 0, duration: 0.3, ease: "steps(3)" }, 6.5);
      // twinkles
      const tw = [[1, 5.1], [2, 5.3], [3, 5.5], [4, 5.7], [5, 5.9], [1, 6.1], [3, 6.2], [2, 6.5], [4, 6.6], [5, 6.7]];
      tw.forEach(([i, t]) => {
        tl.set("#st" + i, { opacity: 1, scale: 1 }, t);
        tl.set("#st" + i, { scale: 0.5 }, t + 0.1);
        tl.set("#st" + i, { opacity: 0 }, t + 0.2);
      });

      // ---- 6.45 s: snap-fit, sparks, colour floods outward from the handle
      for (let i = 1; i <= 8; i++) {
        const [dx, dy] = dirs[i + 2];
        tl.set("#sb" + i, { opacity: 1, x: 0, y: 0 }, 6.45);
        tl.to("#sb" + i, { x: dx, y: dy, duration: 0.3, ease: "steps(3)" }, 6.45);
        tl.set("#sb" + i, { opacity: 0 }, 6.75);
      }
      tl.fromTo("#stage", { y: 0 }, { keyframes: [{ y: 6 }, { y: -3 }, { y: 0 }], duration: 0.12, ease: "none", immediateRender: false }, 6.45);
      tl.set("#grp-fixed", { opacity: 1 }, 6.45);
      tl.set("#gold-move", { opacity: 0 }, 6.45);
      tl.fromTo("#grp-fixed", { clipPath: `circle(0px at ${HX}px ${HY}px)` },
        { clipPath: `circle(2300px at ${HX}px ${HY}px)`, duration: 0.8, ease: "steps(10)" }, 6.45);

      // ---- 7-9 s: steam, seagulls, sparkling waves
      tl.fromTo("#steam-clip", { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 1.6, ease: "steps(12)" }, 7.2);
      tl.fromTo("#steam", { x: -4 }, { keyframes: [{ x: 4 }, { x: -4 }, { x: 4 }, { x: 0 }], duration: 1.8, ease: "steps(1)" }, 7.2);
      tl.fromTo("#gull1", { x: -960, y: 40 }, { keyframes: [{ x: -620, y: 10 }, { x: -300, y: 30 }, { x: 0, y: 0 }], duration: 1.8, ease: "steps(18)" }, 7.2);
      tl.fromTo("#gull2", { x: -1080, y: 60 }, { keyframes: [{ x: -700, y: 30 }, { x: -320, y: 50 }, { x: 0, y: 0 }], duration: 1.6, ease: "steps(16)" }, 7.4);
      [["#gull1", 7.4], ["#gull1", 8.0], ["#gull2", 7.7], ["#gull2", 8.3]].forEach(([g, t]) => {
        const o = g === "#gull1" ? "893px 549px" : "1010px 561px";
        tl.set(g, { scaleY: 0.6, transformOrigin: o }, t);
        tl.set(g, { scaleY: 1 }, t + 0.12);
      });
      const gl = [[1, 0.2], [3, 0.6], [5, 1.0], [2, 1.4], [7, 1.8], [4, 7.3], [6, 7.45], [1, 7.6], [8, 7.75], [3, 7.9], [5, 8.05], [2, 8.2], [7, 8.35], [6, 8.5], [4, 8.65], [8, 8.8]];
      gl.forEach(([i, t]) => {
        tl.set("#g" + i, { opacity: 1 }, t);
        tl.set("#g" + i, { opacity: 0 }, t + 0.17);
      });

      // ---- 9-10 s: hold the final keyframe
      tl.set("#k4", { opacity: 1 }, 9.0);
      tl.set("#stage", { x: 0, y: 0 }, 9.99);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
