<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
    <script src="lib/gsap.min.js"></script>
    <script>
      // the runtime seeks this paused timeline; its onUpdate draws the 3D frame for that time (module below)
      window.__timelines = window.__timelines || {};
      window.__draw3d = null;
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 10, ease: "none", onUpdate: () => window.__draw3d && window.__draw3d(tl.time()) });
      window.__timelines["main"] = tl;
    </script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2e2160; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #2e2160; }
      #c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 62% at 50% 46%, rgba(21,10,52,0) 62%, rgba(21,10,52,0.38) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <canvas id="c" width="1080" height="1920"></canvas>
      <div id="vig"></div>
      <audio id="aud-music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="10" data-track-index="1" data-volume="0.45"></audio>
      <audio id="aud-sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="10" data-track-index="2" data-volume="1"></audio>
      <audio id="aud-amb" class="clip" src="assets/audio/ambience.wav" data-start="0" data-duration="10" data-track-index="3" data-volume="0.3"></audio>
    </div>
    <script type="module">
      /* El Mago, 3D toon (research: videos/RESEARCH_3D_TOON.md).
         Model: biblioteca/3d/mago3d.py (chibi body on the reshaped CC0 Quaternius skeleton, 46 clips). Every frame is a
         pure function of t: clip crossfades, path, camera, printer, springs (simulated once at load), blinks. */
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      let markReady; window.__hf.buildReady.scene = new Promise((r) => (markReady = r));
      const DUR = 10, FPS = 60;
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false); renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
      const scene = new THREE.Scene(); scene.background = new THREE.Color("#3a2a4a");
      scene.fog = new THREE.FogExp2("#d9a874", 0.05);
      const camera = new THREE.PerspectiveCamera(28, 1080 / 1920, 0.05, 40);         // longer lens: cozy diorama look
      const ss = (x) => x * x * (3 - 2 * x), clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, f) => a + (b - a) * f;
      const seg = (t, a, b) => ss(clamp((t - a) / (b - a), 0, 1));

      // ---------- toon material: 3 bands + warm rim; outlines: inverted hull on smoothed normals (no spikes) ----------
      const grad = new THREE.DataTexture(new Uint8Array([107, 107, 107, 255, 184, 184, 184, 255, 255, 255, 255, 255]), 3, 1);
      grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
      function toon(color, o) {
        const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: grad }, o || {}));
        m.onBeforeCompile = (s) => {
          s.uniforms.rimColor = { value: new THREE.Color("#FFE2B8") };
          s.fragmentShader = "uniform vec3 rimColor;\n" + s.fragmentShader.replace("#include <opaque_fragment>",
            "float rim = pow(1.0 - saturate(dot(normal, normalize(vViewPosition))), 3.0);\n" +
            "outgoingLight += smoothstep(0.55, 0.72, rim) * rimColor * 0.3;\n#include <opaque_fragment>");
        };
        return m;
      }
      const OUTC = new THREE.Color("#2A1636");
      function smoothNormals(g) {
        const p = g.attributes.position, n = g.attributes.normal, acc = new Map(), out = new Float32Array(p.count * 3);
        const key = (i) => p.getX(i).toFixed(4) + "," + p.getY(i).toFixed(4) + "," + p.getZ(i).toFixed(4);
        for (let i = 0; i < p.count; i++) { const k = key(i), a = acc.get(k) || [0, 0, 0]; a[0] += n.getX(i); a[1] += n.getY(i); a[2] += n.getZ(i); acc.set(k, a); }
        for (let i = 0; i < p.count; i++) { const a = acc.get(key(i)), l = Math.hypot(a[0], a[1], a[2]) || 1; out[i * 3] = a[0] / l; out[i * 3 + 1] = a[1] / l; out[i * 3 + 2] = a[2] / l; }
        g.setAttribute("outlineNormal", new THREE.BufferAttribute(out, 3));
      }
      function outline(mesh, w) {      // w: thickness in the mesh's own units
        if (!mesh.geometry.attributes.normal) mesh.geometry.computeVertexNormals();
        smoothNormals(mesh.geometry);
        const m = new THREE.MeshBasicMaterial({ color: OUTC, side: THREE.BackSide, fog: true });
        m.onBeforeCompile = (s) => { s.vertexShader = "attribute vec3 outlineNormal;\n" + s.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\ntransformed += outlineNormal * " + w.toFixed(5) + ";"); };
        const o = mesh.isSkinnedMesh ? new THREE.SkinnedMesh(mesh.geometry, m) : new THREE.Mesh(mesh.geometry, m);
        if (mesh.isSkinnedMesh) o.bind(mesh.skeleton, mesh.bindMatrix);
        o.frustumCulled = false; mesh.add(o); return o;
      }
      const shade = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
      const W_OUT = 0.0024;
      function box(w, h, d, c, x, y, z, parent, line) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(c)); m.position.set(x, y, z); shade(m); (parent || scene).add(m); if (line !== false) outline(m, W_OUT); return m;
      }
      function canvasTex(w, h, draw, nearest) {
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(cv); if (nearest) { t.magFilter = t.minFilter = THREE.NearestFilter; }
        t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
      }

      // ---------- the workshop (metres; El Mago is ~1.2 m with his hat) ----------
      const planks = canvasTex(64, 64, (g, w, h) => { g.fillStyle = "#A0603A"; g.fillRect(0, 0, w, h); g.fillStyle = "#8A5638";
        for (let y = 0; y < h; y += 16) g.fillRect(0, y, w, 2); [[14, 0], [44, 16], [6, 32], [36, 48]].forEach(([x, y]) => g.fillRect(x, y, 2, 16));
        g.fillStyle = "#B0703F"; for (let y = 4; y < h; y += 16) g.fillRect(0, y, w, 1); });
      planks.repeat.set(12, 12);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), toon("#ffffff", { map: planks })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const wallTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = "#E8A846"; g.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 16) { g.fillStyle = "#F2C14E"; g.fillRect(0, y, w, 3); g.fillStyle = "#C98A2B"; g.fillRect(0, y + 14, w, 2); } });
      wallTex.repeat.set(7, 2.4);
      const back = new THREE.Mesh(new THREE.PlaneGeometry(9, 3), toon("#ffffff", { map: wallTex })); back.position.set(0, 1.5, -1.1); back.receiveShadow = true; scene.add(back);
      const left = new THREE.Mesh(new THREE.PlaneGeometry(9, 3), toon("#ffffff", { map: wallTex.clone() })); left.rotation.y = Math.PI / 2; left.position.set(-1.45, 1.5, 3.0); left.receiveShadow = true; scene.add(left);
      const skirt = box(9, 0.08, 0.03, "#6E3B22", 0, 0.04, -1.09, null, false);
      // window: sky, sun, plane-tree leaves
      const sky = canvasTex(128, 96, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#7FB6E0"); gr.addColorStop(1, "#BFE0F2"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
        g.fillStyle = "#FFF6D8"; g.beginPath(); g.arc(30, 26, 12, 0, 7); g.fill();
        [["#5C9A4A", 96, 44, 26], ["#2F5A32", 110, 64, 20], ["#9BC46A", 84, 30, 14], ["#5C9A4A", 120, 30, 16]].forEach(([c, x, y, r]) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }); });
      sky.wrapS = sky.wrapT = THREE.ClampToEdgeWrapping;
      const WIN = new THREE.Vector3(0.45, 1.2, -1.095);
      const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.6), new THREE.MeshBasicMaterial({ map: sky, fog: false })); glass.position.copy(WIN); scene.add(glass);
      for (const [w, h, x, y] of [[0.9, 0.06, 0, 0.33], [0.9, 0.06, 0, -0.33], [0.06, 0.72, -0.42, 0], [0.06, 0.72, 0.42, 0], [0.035, 0.6, 0, 0], [0.8, 0.035, 0, 0]]) box(w, h, 0.05, "#8A5638", WIN.x + x, WIN.y + y, -1.08);
      // garland above the window
      for (let k = 0; k < 13; k++) { const x = WIN.x - 0.48 + k * 0.08, y = WIN.y + 0.42 - Math.sin(k / 12 * Math.PI) * 0.06;
        const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.035, 0), toon(k % 2 ? "#2F5A32" : "#5C9A4A")); b.position.set(x, y, -1.07); shade(b); scene.add(b); }
      // rug
      const rugTex = canvasTex(128, 128, (g) => { for (let r = 64; r > 0; r -= 8) { g.fillStyle = (r / 8) % 2 ? "#D7B98A" : "#B08A5A"; g.beginPath(); g.arc(64, 64, r, 0, 7); g.fill(); } });
      const rug = new THREE.Mesh(new THREE.CircleGeometry(0.6, 40), toon("#ffffff", { map: rugTex })); rug.rotation.x = -Math.PI / 2; rug.position.set(0.3, 0.004, 0.15); rug.receiveShadow = true; scene.add(rug);
      // bench, shelves with prints, spools
      const bench = new THREE.Group(); bench.position.set(-0.4, 0, -0.84); scene.add(bench);
      box(1.25, 0.05, 0.46, "#B08A5A", 0, 0.55, 0, bench); box(1.2, 0.03, 0.4, "#8A5638", 0, 0.16, 0, bench);
      for (const [x, z] of [[-0.57, -0.18], [0.57, -0.18], [-0.57, 0.18], [0.57, 0.18]]) box(0.05, 0.53, 0.05, "#8A5638", x, 0.265, z, bench);
      for (const y of [0.98, 1.24]) {
        box(0.75, 0.03, 0.16, "#8A5638", -0.85, y, -1.02);
        [["#C0392B", -1.1, "c"], ["#4F86C6", -0.88, "k"], ["#5C9A4A", -0.66, "c"]].forEach(([c, x, k]) => {
          const g = k === "k" ? new THREE.ConeGeometry(0.045, 0.12, 8) : new THREE.CylinderGeometry(0.04, 0.045, 0.1, 12);
          const m = new THREE.Mesh(g, toon(c)); m.position.set(x, y + 0.07, -1.0); shade(m); scene.add(m); outline(m, W_OUT); });
      }
      [["#C0392B", -1.12], ["#2B4C7E", -0.96], ["#F2C14E", -0.8], ["#2F5A32", -0.64]].forEach(([c, x]) => {
        const s = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.07, 16), toon(c)); s.rotation.x = Math.PI / 2; s.position.set(x, 0.78, -1.04); shade(s); scene.add(s); outline(s, W_OUT); });
      // little tree with blinking lights
      const tree = new THREE.Group(); tree.position.set(1.05, 0, -0.85); scene.add(tree);
      box(0.16, 0.13, 0.16, "#C0392B", 0, 0.065, 0, tree);
      [[0.25, 0.32, 0.3], [0.19, 0.27, 0.5], [0.13, 0.22, 0.68]].forEach(([r, h, y]) => { const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 10), toon("#2F5A32")); c.position.y = y; shade(c); tree.add(c); outline(c, W_OUT); });
      const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.045), new THREE.MeshBasicMaterial({ color: "#FFF3B0", fog: false })); star.position.y = 0.83; tree.add(star);
      const bulbs = []; for (let k = 0; k < 10; k++) { const a = k * 2.3, y = 0.24 + k * 0.05, r = 0.23 - k * 0.018;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), new THREE.MeshBasicMaterial({ color: "#E86A4A", fog: false })); b.position.set(Math.cos(a) * r, y, Math.abs(Math.sin(a)) * r + 0.02); tree.add(b); bulbs.push(b); }

      // light: warm sun through the window, warm sky fill (research: hemisphere ~0.9, key ~2)
      const sun = new THREE.DirectionalLight("#FFE3AE", 2.1); sun.position.set(0.9, 3.0, -2.2); sun.target.position.set(-0.1, 0, 0.3);
      sun.castShadow = true; sun.shadow.mapSize.set(1536, 1536); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 8 });
      sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun, sun.target);
      scene.add(new THREE.HemisphereLight("#FFE9CC", "#5A4650", 1.0));
      const front = new THREE.DirectionalLight("#FFF1DC", 0.75); front.position.set(1.2, 1.6, 3); scene.add(front);
      // sunbeam (additive gradient quad) and dust motes in it
      const beamTex = canvasTex(4, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "rgba(255,240,200,0.9)"); gr.addColorStop(1, "rgba(255,240,200,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
      beamTex.wrapS = beamTex.wrapT = THREE.ClampToEdgeWrapping;
      const bg = new THREE.BufferGeometry();
      bg.setAttribute("position", new THREE.Float32BufferAttribute([WIN.x - 0.4, WIN.y + 0.3, -1.09, WIN.x + 0.4, WIN.y + 0.3, -1.09, 0.35, 0.01, 0.55, -0.55, 0.01, 0.55], 3));
      bg.setAttribute("uv", new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2)); bg.setIndex([0, 1, 2, 0, 2, 3]);
      const beam = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ map: beamTex, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
      scene.add(beam);
      const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const NM = 40, mpos = new Float32Array(NM * 3), motes = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: "#FFF3B0", size: 4, sizeAttenuation: false, transparent: true, opacity: 0.75, fog: false }));
      motes.geometry.setAttribute("position", new THREE.BufferAttribute(mpos, 3)); scene.add(motes);

      // ---------- load El Mago and the printer ----------
      const loader = new GLTFLoader();
      const [mg, pg] = await Promise.all([loader.loadAsync("assets/mago.glb"), loader.loadAsync("assets/printer.glb")]);
      const mago = mg.scene, W = new THREE.Group(); W.add(mago); scene.add(W);
      const bone = (n) => { let b = null; mago.traverse((o) => { if (o.isBone && o.name.replace(/\./g, "") === n.replace(/\./g, "")) b = o; }); return b; };
      const skinned = []; mago.traverse((o) => { if (o.isSkinnedMesh) skinned.push(o); });
      for (const m of skinned) {
        const c = m.material.color.clone(), dark = m.material.name === "eye", glint = m.material.name === "glint";
        m.material = dark ? new THREE.MeshBasicMaterial({ color: "#150A34" }) : glint ? new THREE.MeshBasicMaterial({ color: "#ffffff" }) : toon(c);
        m.castShadow = true; m.receiveShadow = !dark; m.frustumCulled = false;
        if (!["eye", "cheek", "brow", "mustache", "buckle", "thumb", "band"].includes(m.material.name || m.name.split(".")[0]) && !/^(eye|glint|cheek|brow|mustache|buckle|thumb|band)/.test(m.name)) outline(m, W_OUT);
      }
      // blob contact shadow that follows him
      const blobTex = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 2, 32, 32, 32); gr.addColorStop(0, "rgba(42,22,54,0.55)"); gr.addColorStop(1, "rgba(42,22,54,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
      const blob = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })); blob.rotation.x = -Math.PI / 2; scene.add(blob);

      const printer = pg.scene; printer.scale.setScalar(0.085); printer.position.set(-0.04, 0.575, -0.8); printer.rotation.y = -0.55;
      const prM = []; printer.traverse((m) => { if (m.isMesh) prM.push(m); });
      prM.forEach((m) => { const e = m.material.emissive && m.material.emissive.getHex() !== 0;
        m.material = e ? new THREE.MeshBasicMaterial({ color: m.material.emissive }) : toon(m.material.color.clone()); shade(m); if (!e) outline(m, W_OUT / 0.085); });
      scene.add(printer);
      const P = {}; for (const n of ["head", "bed", "gantry", "print", "bow", "nozzle", "screen", "tube"]) P[n] = printer.getObjectByName(n);
      const rest = {}; for (const n in P) if (P[n]) rest[n] = { p: P[n].position.clone(), s: P[n].scale.clone() };
      if (P.tube) P.tube.visible = false;
      const nozzleMat = P.nozzle && P.nozzle.isMesh ? P.nozzle.material : null;
      // the gift that pops out (world space, bigger than the printed one)
      const gift = new THREE.Group(); scene.add(gift);
      { const b = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), toon("#C0392B")); shade(b); gift.add(b); outline(b, W_OUT);
        for (const [x, z] of [[0.104, 0.024], [0.024, 0.104]]) { const r = new THREE.Mesh(new THREE.BoxGeometry(x, 0.104, z), toon("#F2C14E")); gift.add(r); }
        for (const s of [-1, 1]) { const l = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.009, 6, 12), toon("#F2C14E")); l.position.set(s * 0.02, 0.06, 0); l.rotation.y = s * 0.6; gift.add(l); } }
      gift.visible = false;
      const sparks = []; for (let i = 0; i < 36; i++) {
        const m = new THREE.Mesh(new THREE.OctahedronGeometry(i % 5 ? 0.012 : 0.02), new THREE.MeshBasicMaterial({ color: i % 3 ? "#F2C14E" : "#FFF3B0", fog: false }));
        m.userData.v = new THREE.Vector3((rnd(i) - 0.5) * 1.2, 0.9 + rnd(i + 50) * 1.2, (rnd(i + 99) - 0.2) * 0.9); m.visible = false; scene.add(m); sparks.push(m); }

      // ---------- motion: clip crossfades, a walk matched to the stride (no sliding) ----------
      const mixer = new THREE.AnimationMixer(mago);
      const clip = (n) => THREE.AnimationClip.findByName(mg.animations, n);
      const footL = bone("DEF-foot.L");
      function stanceSpeed(name) {          // how fast a planted foot slides back in the clip = walking speed
        const m = new THREE.AnimationMixer(mago), a = m.clipAction(clip(name)); a.play(); const d = clip(name).duration, S = [];
        for (let i = 0; i <= 120; i++) { a.time = d * i / 120; m.update(0); mago.updateMatrixWorld(true); const p = new THREE.Vector3(); footL.getWorldPosition(p); S.push(p); }
        const ymin = Math.min(...S.map((p) => p.y)); let v = 0, n = 0;
        for (let i = 1; i < S.length; i++) if (S[i].y < ymin + 0.006 && S[i - 1].y < ymin + 0.006) { v += (S[i - 1].z - S[i].z) / (d / 120); n++; }
        a.stop(); m.uncacheRoot(mago); return Math.abs(v / Math.max(n, 1));
      }
      const A0 = new THREE.Vector3(1.15, 0, 0.0), A1 = new THREE.Vector3(0.47, 0, -0.86);     // ends beside the bench, next to the printer
      const FACE_PR = Math.atan2(-0.04 - A1.x, -0.78 - A1.z);                                       // facing the printer (3/4 to the camera)
      const WALK_TS = 1.55, vWalk = stanceSpeed("Walk_Loop") * WALK_TS, walkDur = A0.distanceTo(A1) / vWalk;
      const T = {}; T.w0 = 0.0; T.w1 = T.w0 + walkDur; T.i0 = T.w1 + 0.2; T.press = T.i0 + 0.75; T.pop = T.press + 2.1; T.turn = T.pop + 0.3; T.dance = T.turn + 0.3; T.talk = T.dance + 2.2;
      let CAM;
      console.log("walk speed", vWalk.toFixed(3), "m/s, walk", walkDur.toFixed(2), "s", JSON.stringify(T)); window.__T = T;
      CAM = [
        [0.0, [2.2, 2.25, 4.3], [0.35, 0.52, -0.45]],
        [T.w1, [1.15, 1.85, 3.7], [0.25, 0.62, -0.72]],
        [T.pop - 0.1, [-0.35, 1.5, 2.95], [0.18, 0.72, -0.8]],        // slow arc to the front-left: his face and the print
        [T.pop + 0.25, [-0.3, 1.45, 2.7], [0.1, 0.86, -0.8]],         // punch-in on the pop
        [T.dance + 0.2, [0.4, 1.12, 3.05], [0.28, 0.72, -0.8]],       // low, frontal: the face reads under the brim
        [DUR, [0.32, 1.05, 2.85], [0.26, 0.74, -0.82]],
      ];
      const SCHED = [
        { c: "Walk_Loop", a: -0.3, b: T.w1 + 0.15, loop: true, speed: WALK_TS },
        { c: "Idle_Loop", a: T.w1 - 0.1, b: T.i0 + 0.3, loop: true },
        { c: "Interact", a: T.i0, b: T.i0 + 1.7, loop: false, speed: 1.15 },
        { c: "Idle_Loop", a: T.i0 + 1.45, b: T.dance + 0.15, loop: true, off: 0.6 },
        { c: "Dance_Loop", a: T.dance, b: T.talk + 0.2, loop: true, speed: 0.95 },
        { c: "Idle_Talking_Loop", a: T.talk, b: DUR + 1, loop: true },
      ].map((e) => Object.assign(e, { act: mixer.clipAction(clip(e.c).clone()), fade: 0.25 }));
      SCHED.forEach((e) => { e.act.play(); e.act.setEffectiveWeight(0); });
      const walkH = Math.atan2(A1.x - A0.x, A1.z - A0.z);
      const unwrap = (a, ref) => { while (a - ref > Math.PI) a -= 2 * Math.PI; while (a - ref < -Math.PI) a += 2 * Math.PI; return a; };
      function heading(t) {
        const toPr = unwrap(FACE_PR, walkH);
        if (t < T.w1 - 0.35) return walkH;
        if (t < T.turn) return lerp(walkH, toPr, seg(t, T.w1 - 0.35, T.w1 + 0.15));
        const toCam = unwrap(Math.atan2(CAM[CAM.length - 2][1][0] - A1.x, CAM[CAM.length - 2][1][2] - A1.z), toPr);
        return lerp(toPr, toCam, seg(t, T.turn + 0.08, T.turn + 0.33));                          // 5-frame hold, then turn to camera
      }
      const B = { head: bone("DEF-head"), hips: bone("DEF-hips"), eyes: bone("eyes"), brows: bone("brows"),
                  hat: [bone("hat.1"), bone("hat.2"), bone("hat.3")], beard: [bone("beard.1"), bone("beard.2")], arm: [bone("DEF-upper_arm.L"), bone("DEF-upper_arm.R")] };
      const restQ = (b) => b.quaternion.clone();
      const RQ = { hat: B.hat.map(restQ), beard: B.beard.map(restQ) }, browsY = B.brows.position.y;
      function poseAt(t) {                     // everything except the springs
        const ws = SCHED.map((e) => (t < e.a || t > e.b ? 0 : Math.min(1, (t - e.a) / e.fade, (e.b - t) / e.fade)));
        const sum = ws.reduce((a, b) => a + b, 0) || 1;
        SCHED.forEach((e, i) => { const d = e.act.getClip().duration, lt = (t - e.a) * (e.speed || 1) + (e.off || 0);
          e.act.time = e.loop ? ((lt % d) + d) % d : clamp(lt, 0, d - 1e-3); e.act.setEffectiveWeight(ws[i] / sum); });
        mixer.update(0);
        const f = clamp((t - T.w0) / walkDur, 0, 1); W.position.lerpVectors(A0, A1, f); W.rotation.y = heading(t);
        // surprise jolt when the gift pops: stretch up then a small squash (volume kept, max 6 %)
        const j = t - T.pop, sq = j > 0 && j < 0.5 ? Math.sin(j / 0.5 * Math.PI * 2) * Math.exp(-j * 5) * 0.06 : 0;
        W.scale.set(1 - sq / 2, 1 + sq, 1 - sq / 2);
        // head tilt while watching the print, eyebrows up at the press and at the pop
        const tilt = 0.14 * (seg(t, T.press + 0.6, T.press + 0.9) - seg(t, T.pop - 0.2, T.pop + 0.05));
        B.head.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), tilt));
        const brow = Math.max(seg(t, T.i0, T.i0 + 0.12) - seg(t, T.press + 0.3, T.press + 0.6), seg(t, T.pop - 0.05, T.pop + 0.05) - seg(t, T.pop + 0.8, T.pop + 1.1));
        B.brows.position.y = browsY + 0.012 * brow;
        // blinks: fast close (4 frames), 2 closed, slower open (6); double blink after the pop
        let e = 0; for (const b of [1.3, 3.0, T.press + 1.3, T.pop + 0.55, T.pop + 0.75, T.talk + 0.6, 9.5]) { const u = (t - b) * FPS;
          if (u >= 0 && u < 12) e = Math.max(e, u < 4 ? u / 4 : u < 6 ? 1 : 1 - (u - 6) / 6); }
        B.eyes.scale.set(1, 1 - 0.9 * e, 1);
        for (const a of B.arm) a.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0)); // hook for arm spread
      }
      // ---------- secondary motion: springs for the hat tip and beard, simulated once over the whole timeline ----------
      const N = DUR * FPS + 1, SPR = { hat: new Float32Array(N * 2), beard: new Float32Array(N * 2) };
      {
        const tip = new THREE.Vector3(), prev = [], q = new THREE.Quaternion();
        const st = { hat: [0, 0, 0, 0], beard: [0, 0, 0, 0] }, par = { hat: [2.3, 0.3, 0.06], beard: [1.8, 0.35, 0.035] };
        for (let f = 0; f < N; f++) {
          poseAt(f / FPS); mago.updateMatrixWorld(true); W.updateMatrixWorld(true);
          tip.set(0, 0.35, 0); B.head.localToWorld(tip); prev.push(tip.clone());
          let a = new THREE.Vector3();
          if (f >= 2) a.copy(prev[f]).sub(prev[f - 1].clone().multiplyScalar(2)).add(prev[f - 2]).multiplyScalar(FPS * FPS);
          B.head.getWorldQuaternion(q); a.applyQuaternion(q.invert());           // acceleration in head space
          for (const k of ["hat", "beard"]) {
            const [f0, z, g] = par[k], K = (2 * Math.PI * f0) ** 2, C = 2 * z * Math.sqrt(K), s = st[k];
            for (let sub = 0; sub < 4; sub++) { const dt = 1 / FPS / 4;
              s[2] += (-K * s[0] - C * s[2] - g * a.x) * dt; s[3] += (-K * s[1] - C * s[3] - g * a.z) * dt; s[0] += s[2] * dt; s[1] += s[3] * dt; }
            SPR[k][f * 2] = clamp(s[0], -0.5, 0.5); SPR[k][f * 2 + 1] = clamp(s[1], -0.5, 0.5);
          }
        }
      }
      const eu = new THREE.Euler(), qq = new THREE.Quaternion();
      function springs(t) {
        const f = clamp(Math.round(t * FPS), 0, N - 1);
        const hx = SPR.hat[f * 2], hz = SPR.hat[f * 2 + 1], bx = SPR.beard[f * 2], bz = SPR.beard[f * 2 + 1];
        [0.35, 0.6, 0.9].forEach((k, i) => { eu.set(hz * k, 0, -hx * k); B.hat[i].quaternion.copy(RQ.hat[i]).multiply(qq.setFromEuler(eu)); });
        [0.5, 0.8].forEach((k, i) => { eu.set(bz * k, 0, -bx * k); B.beard[i].quaternion.copy(RQ.beard[i]).multiply(qq.setFromEuler(eu)); });
      }

      // ---------- camera: establishing push-in, closer at the printer, punch-in at the pop, frontal for the payoff ----------
      const cp = new THREE.Vector3(), cl = new THREE.Vector3();
      function cam(t) {
        let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
        const [ta, pa, la] = CAM[i], [tb, pb, lb] = CAM[i + 1], f = seg(t, ta, tb);
        cp.set(lerp(pa[0], pb[0], f), lerp(pa[1], pb[1], f), lerp(pa[2], pb[2], f)); cl.set(lerp(la[0], lb[0], f), lerp(la[1], lb[1], f), lerp(la[2], lb[2], f));
        camera.position.copy(cp); camera.lookAt(cl);
      }

      function renderAt(t) {
        poseAt(t); springs(t);
        blob.position.set(W.position.x, 0.003, W.position.z);
        // printer: steady print from the press to the pop, the gift grows; done light after
        const on = t > T.press && t < T.pop, h = clamp((t - T.press) / (T.pop - T.press), 0, 1) * 0.85;
        if (P.head) P.head.position.x = rest.head.p.x + (on ? 0.32 * Math.sin(t * 19) : 0.6);
        if (P.bed) P.bed.position.z = rest.bed.p.z + (on ? 0.25 * Math.sin(t * 7.3) : 0);
        if (P.print) { P.print.scale.set(rest.print.s.x, Math.max(1e-3, h / 0.85) * rest.print.s.y, rest.print.s.z); P.print.visible = t > T.press && t < T.pop; }
        if (P.bow) P.bow.visible = false;
        if (P.gantry) P.gantry.position.y = rest.gantry.p.y + (on ? (0.55 + h + 0.67) - rest.gantry.p.y : 0.5);
        if (nozzleMat) nozzleMat.color.set(on ? "#F2C14E" : "#2E2160");
        // the gift pops out, grows, floats up beside him and spins
        const j = t - T.pop; gift.visible = j >= 0;
        if (gift.visible) { const bp = new THREE.Vector3(); (P.bed || printer).getWorldPosition(bp);
          const up = 1 - Math.exp(-j * 3.2), s = 0.55 + 0.45 * (1 - Math.exp(-j * 6) * Math.cos(j * 18));
          gift.position.set(bp.x + 0.12 * up, bp.y + 0.05 + 0.36 * up + 0.025 * Math.sin(j * 2.6), bp.z + 0.22 * up); gift.scale.setScalar(s); gift.rotation.set(0.15 * Math.sin(j * 2), j * 1.6, 0.1); }
        sparks.forEach((m, i) => { const dt = j - (i % 6) * 0.015; m.visible = dt > 0 && dt < 1.4;
          if (m.visible) { const v = m.userData.v; m.position.set(-0.04 + v.x * dt * 0.6, 0.66 + v.y * dt * 0.6 - 1.2 * dt * dt, -0.8 + v.z * dt * 0.6); m.rotation.set(dt * 9, dt * 7, 0); m.scale.setScalar(1 - dt / 1.4); } });
        bulbs.forEach((b, k) => b.material.color.set(["#E86A4A", "#F2C14E", "#9CC9E8", "#3a2a4a"][(k + Math.floor(t * 3)) % 4]));
        for (let i = 0; i < NM; i++) { const ph = rnd(i) * 6.28, u = rnd(i + 7), w = rnd(i + 13);
          mpos[i * 3] = lerp(WIN.x - 0.4, -0.3, w) + 0.06 * Math.sin(t * 0.5 + ph) + (u - 0.5) * 0.4;
          mpos[i * 3 + 1] = lerp(WIN.y + 0.2, 0.1, w) + 0.05 * Math.sin(t * 0.7 + ph * 2) - ((t * 0.03 + u) % 0.3);
          mpos[i * 3 + 2] = lerp(-1.0, 0.45, w) + 0.04 * Math.cos(t * 0.6 + ph); }
        motes.geometry.attributes.position.needsUpdate = true;
        cam(t);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__draw3d = renderAt;
      renderAt(0);
      markReady();
    </script>
  </body>
</html>
